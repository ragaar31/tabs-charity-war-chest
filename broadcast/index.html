<script>
const PLAYER_COLORS = {
    scarlet: "#FF4D5A",
    tangerine: "#FF8A3D",
    gold: "#F2C94C",
    emerald: "#32D583",
    cyan: "#22D3EE",
    blue: "#3B82F6",
    violet: "#8B5CF6",
    pink: "#FF7AB8"
};


let roomCode = null;
let state = null;
let previousState = null;
let pollTimer = null;
let pollBusy = false;

let firstState = true;
let lastSettlementId = null;
let payoutTimer = null;

let lastWinnerKey = null;
let winnerTimer = null;

let draftPlayerJustChanged = false;
let pendingDraftGliderStart = null;

let newlyJoinedPlayerIds = [];
let newlyJoinedAudienceKeys = [];

let draftOrderRevealPending = false;
let draftOrderRevealSourceRects = {};
let draftOrderRevealRunning = false;

/*
   Skill unlock animations intentionally last several seconds.
   Prevent the normal 900ms Broadcast poll from replacing the Shop DOM
   before the current unlock animation has finished.
*/
let shopUnlockAnimationUntil = 0;

let armyBuildPendingAnimations = [];
let armyBuildAnimationUntil = 0;
let armyBuildLastAnimationSignatures = new Map();


function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;
}



function draftPositionsChanged(
    oldSnapshot,
    newSnapshot
) {

    if (
        !oldSnapshot
        ||
        !newSnapshot
    ) {
        return false;
    }


    const oldMap =
        new Map(
            (oldSnapshot.players ?? [])
            .map(
                player => [
                    player.id,
                    player.draft_position
                    ?? null
                ]
            )
        );


    return (
        (newSnapshot.players ?? [])
        .some(
            player =>
                oldMap.get(
                    player.id
                )
                !==
                (
                    player.draft_position
                    ?? null
                )
        )
    );
}


function captureDraftOrderSourceRects() {

    const elements =
        document.querySelectorAll(
            "[data-order-player-id]"
        );


    const result = {};


    for (const element of elements) {

        const id =
            element.dataset
                .orderPlayerId;


        if (!id) {
            continue;
        }


        const rect =
            element
                .getBoundingClientRect();


        result[id] = {
            left: rect.left,
            top: rect.top,
            width: rect.width,
            height: rect.height
        };
    }


    return result;
}


function shuffleArray(values) {

    const result =
        [...values];


    for (
        let index =
            result.length - 1;

        index > 0;

        index--
    ) {

        const target =
            Math.floor(
                Math.random()
                *
                (index + 1)
            );


        [
            result[index],
            result[target]
        ] = [
            result[target],
            result[index]
        ];
    }


    return result;
}


function draftOrderTargetRects() {

    const targets =
        Array.from(
            document.querySelectorAll(
                ".order-reveal-strip"
            )
        );


    return new Map(
        targets.map(
            element => {

                const rect =
                    element
                    .getBoundingClientRect();


                return [
                    element.dataset
                        .orderPlayerId,

                    {
                        element,
                        left: rect.left,
                        top: rect.top,
                        width: rect.width,
                        height: rect.height
                    }
                ];
            }
        )
    );
}


function makeDraftOrderFlyer(
    player,
    sourceRect
) {

    const flyer =
        document.createElement(
            "div"
        );


    flyer.className =
        "draft-order-flyer";


    flyer.style.setProperty(
        "--player",
        playerColor(
            player.id
        )
    );


    flyer.dataset.playerId =
        player.id;


    flyer.innerHTML = `
        <div class="order-reveal-rank">
            ?
        </div>

        <div class="order-reveal-name">
            ${escapeHtml(player.display_name)}
        </div>

        <div class="order-reveal-type">
            ${
                player.is_bot
                ? "Chaos Gambler"
                : "Player"
            }
        </div>
    `;


    Object.assign(
        flyer.style,
        {
            left:
                `${sourceRect.left}px`,

            top:
                `${sourceRect.top}px`,

            width:
                `${sourceRect.width}px`,

            height:
                `${sourceRect.height}px`
        }
    );


    document.body.appendChild(
        flyer
    );


    return flyer;
}


async function animateFlyerRect(
    flyer,
    fromRect,
    toRect,
    duration = 420,
    easing =
        "cubic-bezier(.2,.8,.2,1)"
) {

    const animation =
        flyer.animate(
            [
                {
                    left:
                        `${fromRect.left}px`,
                    top:
                        `${fromRect.top}px`,
                    width:
                        `${fromRect.width}px`,
                    height:
                        `${fromRect.height}px`
                },

                {
                    left:
                        `${toRect.left}px`,
                    top:
                        `${toRect.top}px`,
                    width:
                        `${toRect.width}px`,
                    height:
                        `${toRect.height}px`
                }
            ],
            {
                duration,
                easing,
                fill: "forwards"
            }
        );


    try {
        await animation.finished;
    }
    catch {
        // Harmless if a render interrupts.
    }


    Object.assign(
        flyer.style,
        {
            left:
                `${toRect.left}px`,
            top:
                `${toRect.top}px`,
            width:
                `${toRect.width}px`,
            height:
                `${toRect.height}px`
        }
    );
}


async function runDraftOrderReveal() {

    if (
        !draftOrderRevealPending
        ||
        draftOrderRevealRunning
        ||
        state?.event?.status !==
            "draft_order"
    ) {
        return;
    }


    const targets =
        draftOrderTargetRects();


    if (!targets.size) {
        return;
    }


    draftOrderRevealRunning = true;


    const players =
        [...state.players];


    const targetRows =
        [...targets.values()]
        .sort(
            (a,b) =>
                a.top - b.top
        );


    const flyers = [];


    for (
        let index = 0;
        index < players.length;
        index++
    ) {

        const player =
            players[index];


        const fallback =
            targetRows[
                Math.min(
                    index,
                    targetRows.length - 1
                )
            ];


        const source =
            draftOrderRevealSourceRects[
                player.id
            ]
            ?? {
                left:
                    fallback.left,

                top:
                    fallback.top,

                width:
                    fallback.width,

                height:
                    fallback.height
            };


        flyers.push({
            player,
            flyer:
                makeDraftOrderFlyer(
                    player,
                    source
                ),
            rect:
                source
        });
    }


    const subtitle =
        document.getElementById(
            "draft-order-subtitle"
        );


    // First: collapse the original Lobby cards into randomized
    // one-per-row strips.
    let permutation =
        shuffleArray(
            targetRows
        );


    await Promise.all(
        flyers.map(
            async (
                item,
                index
            ) => {

                const target =
                    permutation[index];


                await animateFlyerRect(
                    item.flyer,
                    item.rect,
                    target,
                    650,
                    "cubic-bezier(.16,.82,.22,1)"
                );


                item.rect =
                    target;
            }
        )
    );


    // Then visibly scramble the strips several times.
    for (
        let pass = 0;
        pass < 4;
        pass++
    ) {

        permutation =
            shuffleArray(
                targetRows
            );


        await Promise.all(
            flyers.map(
                async (
                    item,
                    index
                ) => {

                    const target =
                        permutation[index];


                    await animateFlyerRect(
                        item.flyer,
                        item.rect,
                        target,
                        340,
                        "cubic-bezier(.35,.02,.2,1)"
                    );


                    item.rect =
                        target;
                }
            )
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    90
                )
        );
    }


    // Final settle: every player flies into their real draft
    // position.
    if (subtitle) {
        subtitle.textContent =
            "Locking final draft positions…";
    }


    await Promise.all(
        flyers.map(
            async item => {

                const target =
                    targets.get(
                        item.player.id
                    );


                if (!target) {
                    return;
                }


                const rank =
                    item.flyer
                    .querySelector(
                        ".order-reveal-rank"
                    );


                if (rank) {

                    rank.textContent =
                        `#${item.player.draft_position}`;
                }


                await animateFlyerRect(
                    item.flyer,
                    item.rect,
                    target,
                    620,
                    "cubic-bezier(.16,.88,.24,1)"
                );


                item.rect =
                    target;
            }
        )
    );


    // Reveal the real DOM strips beneath the flyers and pulse
    // them into their final locked state.
    const finalStrips =
        Array.from(
            document.querySelectorAll(
                ".order-reveal-strip"
            )
        );


    // Reveal every real strip first so there is always a visible
    // layer underneath the flyer copies during the handoff.
    finalStrips.forEach(
        (
            strip,
            index
        ) => {

            strip.style.opacity =
                "1";

            strip.classList.remove(
                "pending-target"
            );


            setTimeout(
                () => {
                    strip.classList.add(
                        "order-locked"
                    );
                },
                index * 55
            );
        }
    );


    // Give the browser a full paint opportunity with the final strips
    // visible before fading the animated flyer copies away.
    await new Promise(
        resolve =>
            requestAnimationFrame(
                () =>
                    requestAnimationFrame(
                        resolve
                    )
            )
    );


    const flyerFades =
        flyers.map(
            item =>
                item.flyer.animate(
                    [
                        { opacity: 1 },
                        { opacity: 0 }
                    ],
                    {
                        duration: 170,
                        fill: "forwards"
                    }
                )
        );


    await Promise.all(
        flyerFades.map(
            async fade => {

                try {
                    await fade.finished;
                }
                catch {
                    // Harmless.
                }
            }
        )
    );


    for (const item of flyers) {
        item.flyer.remove();
    }


    if (subtitle) {

        subtitle.innerHTML = `
            Draft order locked.
            <span class="order-reveal-locked-label">
                Ready to Draft
            </span>
        `;
    }


    draftOrderRevealPending = false;
    draftOrderRevealSourceRects = {};
    draftOrderRevealRunning = false;
}


function playerById(id) {

    return (
        state?.players?.find(
            player =>
                player.id === id
        )
        ?? null
    );
}


function playerName(id) {

    return (
        playerById(id)
        ?.display_name
        ?? "Player"
    );
}


function playerColor(id) {

    const code =
        playerById(id)
        ?.color_code;

    return (
        PLAYER_COLORS[code]
        ?? "#8B97AE"
    );
}


function money(value) {

    const number =
        Number(value ?? 0);

    return (
        "$"
        +
        Math.round(number)
        .toLocaleString()
    );
}


function signedMoney(value) {

    const number =
        Math.round(
            Number(value ?? 0)
        );

    if (number === 0) {
        return "$0";
    }

    return (
        number > 0
        ? `+${money(number)}`
        : `-${money(Math.abs(number))}`
    );
}


function standings() {

    return [...(state?.players ?? [])]
        .sort(
            (a,b) =>
                b.war_chest - a.war_chest
                ||
                b.wins - a.wins
                ||
                a.display_name.localeCompare(
                    b.display_name
                )
        );
}


function currentMatch() {

    const event =
        state?.event;

    if (!event) {
        return null;
    }

    return (
        state.matches?.find(
            match =>
                match.round_number ===
                    event.current_round
                &&
                match.match_number ===
                    event.current_match_number
        )
        ?? null
    );
}


function currentFinalMatch() {

    const stage =
        state?.event
        ?.final_war_current_stage;

    return (
        state?.final_war_matches
        ?.find(
            match =>
                match.stage_number ===
                stage
        )
        ?? null
    );
}


function armyFor(playerId) {

    return (
        state?.current_armies
        ?.find(
            army =>
                army.player_id ===
                playerId
        )
        ?? null
    );
}


function finalArmyFor(playerId) {

    return (
        state?.final_war_armies
        ?.find(
            army =>
                army.player_id ===
                playerId
        )
        ?? null
    );
}


async function ensureBroadcastSession() {

    const sessionResult =
        await db.auth.getSession();

    if (
        sessionResult.data
        ?.session
    ) {
        return;
    }


    const { error } =
        await db.auth
            .signInAnonymously();


    if (error) {
        throw error;
    }
}


function roomFromUrl() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("room")
        ?.trim()
        .toUpperCase()
        ?? ""
    );
}


async function connectBroadcast() {

    const input =
        document.getElementById(
            "room-code"
        );

    const message =
        document.getElementById(
            "setup-message"
        );


    const code =
        input.value
            .trim()
            .toUpperCase();


    if (code.length !== 6) {

        message.textContent =
            "Enter the 6-character room code.";

        return;
    }


    message.textContent =
        "Connecting…";


    try {

        await ensureBroadcastSession();


        roomCode = code;


        const url =
            new URL(
                window.location.href
            );

        url.searchParams.set(
            "room",
            roomCode
        );

        history.replaceState(
            null,
            "",
            url
        );


        await refreshState(true);


        document
            .getElementById(
                "setup-screen"
            )
            .classList.add("hidden");


        document
            .getElementById(
                "broadcast-shell"
            )
            .classList.remove("hidden");


        startPolling();
    }

    catch (error) {

        console.error(error);

        message.textContent =
            error.message;
    }
}


function startPolling() {

    clearInterval(
        pollTimer
    );


    pollTimer =
        setInterval(
            () =>
                refreshState(false),
            900
        );
}


async function refreshState(
    initial = false
) {

    if (
        pollBusy
        ||
        !roomCode
    ) {
        return;
    }


    pollBusy = true;


    try {

        const { data, error } =
            await db.rpc(
                "get_broadcast_state",
                {
                    p_code:
                        roomCode
                }
            );


        if (error) {
            throw error;
        }


        if (
            data?.event?.status === "lobby"
        ) {

            const {
                data:
                    fullAudienceRoster,
                error:
                    audienceRosterError
            } =
                await db.rpc(
                    "get_broadcast_audience_roster",
                    {
                        p_code:
                            roomCode
                    }
                );


            if (audienceRosterError) {

                console.error(
                    audienceRosterError
                );

            }

            else if (
                Array.isArray(
                    fullAudienceRoster
                )
            ) {

                data.audience =
                    data.audience
                    ?? {};


                data.audience.preview =
                    fullAudienceRoster;


                data.audience.count =
                    fullAudienceRoster.length;
            }
        }


        /*
           Shop has a richer visual state than the general Broadcast
           payload: live item inventory, Skill Tree ownership, and the
           complete skill-node catalog.
        */
        if (
            data?.event?.status === "shop"
        ) {

            const {
                data:
                    shopSceneState,
                error:
                    shopSceneError
            } =
                await db.rpc(
                    "get_shop_scene_state",
                    {
                        p_code:
                            roomCode
                    }
                );


            if (shopSceneError) {

                console.error(
                    shopSceneError
                );

            }

            else if (shopSceneState) {

                data.shop =
                    shopSceneState;
            }
        }


        if (
            data?.event?.status === "army_build"
        ) {

            const {
                data:
                    armyBuildState,
                error:
                    armyBuildError
            } =
                await db.rpc(
                    "get_broadcast_army_build_state",
                    {
                        p_code:
                            roomCode
                    }
                );


            if (armyBuildError) {

                console.error(
                    armyBuildError
                );

            }

            else if (armyBuildState) {

                data.army_build =
                    armyBuildState;
            }
        }


        /*
           The Audience-enhanced get_broadcast_state() replacement
           does not include draft_units. During Draft, load the legal
           opening unit market separately so the existing Draft scene
           can continue using state.draft_units exactly as before.
        */
        if (
            data?.event?.status === "draft"
        ) {

            const {
                data:
                    draftUnits,
                error:
                    draftUnitsError
            } =
                await db.rpc(
                    "get_broadcast_draft_units"
                );


            if (draftUnitsError) {

                console.error(
                    draftUnitsError
                );

            }

            else if (
                Array.isArray(
                    draftUnits
                )
            ) {

                data.draft_units =
                    draftUnits;
            }
        }


        if (
            data?.latest_settlement
            ?.match_id
        ) {

            const {
                data:
                    matchConsumables,
                error:
                    matchConsumablesError
            } =
                await db.rpc(
                    "get_broadcast_match_consumables",
                    {
                        p_code:
                            roomCode,

                        p_match_id:
                            data.latest_settlement
                            .match_id
                    }
                );


            if (matchConsumablesError) {

                console.error(
                    matchConsumablesError
                );

            }

            else {

                data.latest_settlement
                    .consumables =
                        Array.isArray(
                            matchConsumables
                        )
                        ? matchConsumables
                        : [];
            }
        }


        const oldState =
            state;


        /*
           Do the same for the Shop skill-unlock sequence.

           The old behavior rebuilt the entire Shop scene every ~900ms,
           which destroyed the animated circle/node halfway through:
           beam -> circle -> DOM replacement -> ownership marker suddenly
           present in the new markup.

           Keep the current Shop DOM intact until the animation completes.
           We deliberately DO NOT assign state = data here. If another
           skill is purchased during the lock, the next normal refresh
           will still see that change and animate it rather than swallowing
           it inside a suppressed render.
        */
        if (
            oldState?.event?.status === "shop"
            &&
            data?.event?.status === "shop"
            &&
            performance.now() <
                shopUnlockAnimationUntil
        ) {
            return;
        }


        // While the Draft Order shuffle/reveal is actively animating,
        // do not let the normal ~900ms poll re-render the same scene.
        // A mid-animation re-render recreates the hidden target strips
        // and causes a brief blank flash when the flyer copies disappear.
        //
        // If the Host advances out of draft_order, allow that new phase
        // through immediately.
        if (
            draftOrderRevealRunning
            &&
            oldState?.event?.status === "draft_order"
            &&
            data?.event?.status === "draft_order"
        ) {

            state =
                data;

            return;
        }


        if (
            oldState?.event?.status === "army_build"
            &&
            data?.event?.status === "army_build"
            &&
            performance.now() <
                armyBuildAnimationUntil
        ) {
            return;
        }


        newlyJoinedPlayerIds = [];
        newlyJoinedAudienceKeys = [];


        if (
            !initial
            &&
            oldState?.event?.status === "lobby"
            &&
            data?.event?.status === "lobby"
        ) {

            const existingIds =
                new Set(
                    (oldState.players ?? [])
                    .map(
                        player =>
                            player.id
                    )
                );


            newlyJoinedPlayerIds =
                (data.players ?? [])
                .filter(
                    player =>
                        !existingIds.has(
                            player.id
                        )
                )
                .map(
                    player =>
                        player.id
                );


            const priorAudienceKeys =
                new Set(
                    (oldState?.audience?.preview ?? [])
                    .map(
                        viewer =>
                            String(
                                viewer.id
                                ?? viewer.audience_id
                                ?? viewer.user_id
                                ?? viewer.display_name
                            )
                    )
                );


            newlyJoinedAudienceKeys =
                (data?.audience?.preview ?? [])
                .filter(
                    viewer =>
                        !priorAudienceKeys.has(
                            String(
                                viewer.id
                                ?? viewer.audience_id
                                ?? viewer.user_id
                                ?? viewer.display_name
                            )
                        )
                )
                .map(
                    viewer =>
                        String(
                            viewer.id
                            ?? viewer.audience_id
                            ?? viewer.user_id
                            ?? viewer.display_name
                        )
                );
        }


        const enteringDraftOrder =
            !initial
            &&
            data?.event?.status ===
                "draft_order"
            &&
            (
                oldState?.event?.status ===
                    "lobby"
                ||
                oldState?.event?.status ===
                    "locked"
                ||
                (
                    oldState?.event?.status ===
                        "draft_order"
                    &&
                    draftPositionsChanged(
                        oldState,
                        data
                    )
                )
            );


        if (enteringDraftOrder) {

            draftOrderRevealSourceRects =
                captureDraftOrderSourceRects();

            draftOrderRevealPending =
                true;
        }


        const finalDraftTransition =
            !initial
            &&
            oldState?.event?.status === "draft"
            &&
            data?.event?.status === "draft_complete";


        const draftPick =
            !initial
            &&
            oldState?.event?.status === "draft"
            &&
            (
                data?.event?.status === "draft"
                ||
                data?.event?.status === "draft_complete"
            )
            ? newestDraftPickBetween(
                oldState,
                data
              )
            : null;


        if (draftPick) {

            const oldDrafter =
                draftPlayerForSnapshot(
                    oldState
                );

            const newDrafter =
                draftPlayerForSnapshot(
                    data
                );


            pendingDraftGliderStart =
                captureDraftGliderStart();


            await animateDraftPickFlight(
                draftPick,
                oldState
            );


            // Give viewers a beat to read the completed pick
            // before advancing the Broadcast to the next drafter.
            // This also applies at snake-draft endpoints where the
            // same player immediately receives another pick.
            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        900
                    )
            );


            /*
               The final Draft pick used to jump immediately into
               Draft Complete because the event status changes on the
               same poll that contains the last pick.

               For the final pick, render a completed Draft snapshot
               for a few seconds before transitioning.
            */
            if (
                finalDraftTransition
            ) {

                previousState =
                    oldState;


                state = {
                    ...data,

                    event: {
                        ...data.event,

                        status:
                            "draft",

                        draft_pick_number:
                            oldState.event
                            ?.draft_pick_number,

                        broadcast_final_draft_hold:
                            true
                    },

                    draft_units:
                        oldState.draft_units
                        ??
                        data.draft_units
                        ??
                        []
                };


                draftPlayerJustChanged =
                    false;


                renderBroadcast();
                runDraftPostRenderAnimations();


                // Hold the fully completed Draft board on screen.
                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            2800
                        )
                );


                const scene =
                    document.getElementById(
                        "scene"
                    );


                if (scene) {

                    const fadeOut =
                        scene.animate(
                            [
                                {
                                    opacity: 1,
                                    transform:
                                        "translateY(0) scale(1)"
                                },
                                {
                                    opacity: 0,
                                    transform:
                                        "translateY(-8px) scale(.995)"
                                }
                            ],
                            {
                                duration: 260,
                                easing: "ease",
                                fill: "forwards"
                            }
                        );


                    try {
                        await fadeOut.finished;
                    }
                    catch {
                        // Harmless if interrupted.
                    }
                }


                previousState =
                    oldState;

                state =
                    data;


                renderBroadcast();


                if (scene) {

                    scene.getAnimations()
                        .forEach(
                            animation =>
                                animation.cancel()
                        );


                    scene.animate(
                        [
                            {
                                opacity: 0,
                                transform:
                                    "translateY(10px) scale(.995)"
                            },
                            {
                                opacity: 1,
                                transform:
                                    "translateY(0) scale(1)"
                            }
                        ],
                        {
                            duration: 340,
                            easing:
                                "cubic-bezier(.16,.82,.24,1)"
                        }
                    );
                }


                maybeShowWinner();
                maybeShowPayout();

                return;
            }


            draftPlayerJustChanged =
                oldDrafter?.id
                !==
                newDrafter?.id;


            if (draftPlayerJustChanged) {

                await fadeOutCurrentDrafter();
            }
        }


        armyBuildPendingAnimations =
            !initial
            && data?.event?.status ===
                "army_build"
            ? collectArmyBuildAnimations(
                oldState,
                data
              )
            : [];


        previousState =
            oldState;

        state =
            data;


        if (initial || firstState) {

            lastSettlementId =
                state.latest_settlement
                ?.match_id
                ?? null;

            firstState = false;
        }


        renderBroadcast();

        runDraftPostRenderAnimations();
        runShopPostRenderAnimations();
        runArmyBuildPostRenderAnimations();

        if (draftOrderRevealPending) {
            runDraftOrderReveal();
        }


        maybeShowWinner();
        maybeShowPayout();
    }

    catch (error) {

        console.error(error);

        document
            .getElementById(
                "footer-status"
            )
            .textContent =
                `Broadcast data error: ${error.message}`;
    }

    finally {

        pollBusy = false;
    }
}


function phaseLabel() {

    const event =
        state.event;

    const round =
        event.current_round
        ? `ROUND ${event.current_round}`
        : "";


    switch (event.status) {

        case "lobby":
            return "LOBBY";

        case "locked":
            return "LOCKING FIELD";

        case "draft_order":
            return "DRAFT ORDER";

        case "draft":
            return "DRAFT";

        case "draft_complete":
            return "DRAFT COMPLETE";

        case "shop":
            return `${round} SHOP`;

        case "army_build":
            return `${round} ARMY BUILD`;

        case "betting_open":
            return `${round} BETTING`;

        case "betting_locked":
            return `${round} POOLS LOCKED`;

        case "fight":
            return `${round} • FIGHT ${event.current_match_number}`;

        case "regular_complete":
            return "REGULAR SEASON COMPLETE";

        case "final_war_build":
            return `FINAL WAR • STAGE ${event.final_war_current_stage}`;

        case "final_war_ready":
            return `FINAL WAR • STAGE ${event.final_war_current_stage}`;

        case "final_war_fight":
            return `FINAL WAR • STAGE ${event.final_war_current_stage}`;

        case "final_war_complete":
            return "FINAL WAR COMPLETE";

        default:
            return String(event.status)
                .replaceAll("_"," ")
                .toUpperCase();
    }
}

function audienceLobbyGridLayout(
    count
) {

    let cols = 5;
    let density = "audience-density-normal";


    if (count > 10) {
        cols = 6;
    }


    if (count > 18) {
        cols = 7;
        density =
            "audience-density-compact";
    }


    if (count > 28) {
        cols = 8;
    }


    if (count > 40) {
        cols = 9;
        density =
            "audience-density-dense";
    }


    if (count > 54) {
        cols = 10;
    }


    if (count > 70) {
        cols = 11;
        density =
            "audience-density-ultra";
    }


    if (count > 88) {
        cols = 12;
    }


    return {
        cols,
        rows:
            Math.max(
                1,
                Math.ceil(
                    count / cols
                )
            ),
        density
    };
}


function renderAudiencePreviewPanel(
    title = "Audience Lobby",
    subtitle = "Viewers can join as pure gamblers and chase their own leaderboard.",
    limit = 18,
    animateJoins = false
) {

    const preview =
        audiencePreview(limit);

    /*
       The Broadcast audience feed is newest-first.
       In the Lobby, show it oldest-to-newest so new cards always
       append to the right, then wrap naturally to the next row.
    */
    const audience =
        animateJoins
        ? [...preview].reverse()
        : preview;

    const count =
        audienceCount();

    const hidden =
        Math.max(
            0,
            count - audience.length
        );


    const lobbyLayout =
        audienceLobbyGridLayout(
            audience.length
        );


    return `
        <section
            class="
                audience-panel
                ${
                    animateJoins
                    ? `audience-lobby-roster ${lobbyLayout.density}`
                    : ""
                }
            "
        >

            <div class="audience-panel-head">

                <div>
                    <div class="audience-panel-title">
                        ${title}
                    </div>

                    ${
                        subtitle
                        ? `
                            <div class="audience-panel-copy">
                                ${subtitle}
                            </div>
                          `
                        : ""
                    }
                </div>

                <div class="audience-count-pill">
                    ${count}
                    <span>Audience</span>
                </div>

            </div>

            ${
                audience.length
                ? `
                    <div
                        class="
                            audience-preview-grid
                            ${
                                animateJoins
                                ? "lobby-audience-grid"
                                : ""
                            }
                        "
                        ${
                            animateJoins
                            ? `
                                style="
                                    --audience-cols:${lobbyLayout.cols};
                                    --audience-rows:${lobbyLayout.rows};
                                "
                              `
                            : ""
                        }
                    >
                        ${
                            audience.map(
                                (viewer, index) => {

                                    const viewerKey =
                                        String(
                                            viewer.id
                                            ?? viewer.audience_id
                                            ?? viewer.user_id
                                            ?? viewer.display_name
                                        );

                                    const justJoined =
                                        animateJoins
                                        &&
                                        newlyJoinedAudienceKeys.includes(
                                            viewerKey
                                        );

                                    /*
                                       newlyJoinedAudienceKeys arrives newest-first.
                                       Reverse it for animation timing so multiple
                                       simultaneous joins animate left-to-right.
                                    */
                                    const chronologicalNewKeys =
                                        [...newlyJoinedAudienceKeys]
                                        .reverse();

                                    const joinIndex =
                                        Math.max(
                                            0,
                                            chronologicalNewKeys.indexOf(
                                                viewerKey
                                            )
                                        );

                                    return `
                                        <div
                                            class="audience-mini-card ${justJoined ? "audience-join-card" : ""}"
                                            style="--audience-join-delay:${joinIndex * 100}ms;"
                                        >
                                            <div class="audience-mini-name">
                                                ${escapeHtml(viewer.display_name)}
                                            </div>

                                            <div class="audience-mini-meta">
                                                ${
                                                    viewer.rank
                                                    ? `#${viewer.rank} • `
                                                    : ""
                                                }
                                                ${money(viewer.bankroll ?? 10000)}
                                            </div>
                                        </div>
                                    `;
                                }
                            ).join("")
                        }
                    </div>

                    ${
                        hidden > 0
                        ? `
                            <div class="audience-more">
                                +${hidden} more viewers in the audience pool
                            </div>
                          `
                        : ""
                    }
                  `
                : `
                    <div class="audience-empty">
                        No Audience Gamblers yet. Scan in and become the first.
                    </div>
                  `
            }

        </section>
    `;
}

function renderScene() {

    const status =
        state.event.status;


    if (status === "lobby") {
        return renderLobby();
    }


    if (status === "locked") {
        return renderCastIntro();
    }


    if (status === "draft_order") {
        return renderDraftOrderRevealScene();
    }


    if (status === "draft") {
        return renderDraft();
    }


    if (
        status === "shop"
    ) {
        return renderShopScene();
    }


    if (status === "army_build") {
        return renderArmyBuildScene();
    }


    if (
        status === "draft_complete"
        ||
        status === "regular_complete"
    ) {
        return renderStandingsPrep();
    }


    if (status === "betting_open") {
        return renderBettingOpen();
    }


    if (status === "betting_locked") {
        return renderPools();
    }


    if (status === "fight") {

        const match =
            currentMatch();

        if (match?.winner_player_id) {
            return renderFightResult();
        }

        return renderArmyReveal(
            match,
            state.current_armies,
            false
        );
    }


    if (
        status === "final_war_build"
        ||
        status === "final_war_ready"
    ) {
        return renderFinalBracket();
    }


    if (status === "final_war_fight") {

        return renderArmyReveal(
            currentFinalMatch(),
            state.final_war_armies,
            true
        );
    }


    if (status === "final_war_complete") {
        return renderChampion();
    }


    return renderStandings();
}

function draftPlayerForSnapshot(
    snapshot
) {

    const event =
        snapshot?.event;

    const players =
        snapshot?.players ?? [];


    if (
        !event
        ||
        !players.length
        ||
        !event.draft_pick_number
    ) {
        return null;
    }


    const count =
        players.length;

    const pick =
        event.draft_pick_number;

    const round =
        Math.floor(
            (pick - 1) / count
        ) + 1;

    const index =
        (pick - 1) % count;

    const position =
        round % 2 === 1
        ? index + 1
        : count - index;


    return (
        players.find(
            player =>
                player.draft_position ===
                position
        )
        ?? null
    );
}


function newestDraftPickBetween(
    oldSnapshot,
    newSnapshot
) {

    const oldPicks =
        oldSnapshot?.draft_picks
        ?? [];

    const newPicks =
        newSnapshot?.draft_picks
        ?? [];


    if (
        newPicks.length <=
        oldPicks.length
    ) {
        return null;
    }


    const oldMax =
        oldPicks.reduce(
            (max,pick) =>
                Math.max(
                    max,
                    Number(
                        pick.pick_number
                        ?? 0
                    )
                ),
            0
        );


    return (
        newPicks.find(
            pick =>
                Number(
                    pick.pick_number
                ) > oldMax
        )
        ?? null
    );
}

async function animateDraftPickFlight(
    pick,
    oldSnapshot
) {

    if (!pick) {
        return;
    }


    const source =
        document.querySelector(
            `[data-market-unit-id="${pick.unit_id}"]`
        );


    const target =
        draftFlightTargetSlot(
            pick.player_id,
            oldSnapshot
        );


    if (!source || !target) {
        return;
    }


    const sourceRect =
        source.getBoundingClientRect();

    const targetRect =
        target.getBoundingClientRect();


    source.classList.add(
        "draft-source-lifting"
    );


    const clone =
        source.cloneNode(true);


    clone.classList.add(
        "draft-flight-card"
    );


    clone.style.setProperty(
        "--flight-player",
        playerColor(
            pick.player_id
        )
    );


    Object.assign(
        clone.style,
        {
            left:
                `${sourceRect.left}px`,

            top:
                `${sourceRect.top}px`,

            width:
                `${sourceRect.width}px`,

            height:
                `${sourceRect.height}px`
        }
    );


    document.body.appendChild(
        clone
    );


    const flight =
        clone.animate(
            [
                {
                    left:
                        `${sourceRect.left}px`,

                    top:
                        `${sourceRect.top}px`,

                    width:
                        `${sourceRect.width}px`,

                    height:
                        `${sourceRect.height}px`,

                    borderRadius:
                        "8px",

                    transform:
                        "translateY(0) scale(1)"
                },

                {
                    offset: .52,

                    transform:
                        "translateY(-24px) scale(1.08)"
                },

                {
                    left:
                        `${targetRect.left}px`,

                    top:
                        `${targetRect.top}px`,

                    width:
                        `${targetRect.width}px`,

                    height:
                        `${targetRect.height}px`,

                    borderRadius:
                        "11px",

                    transform:
                        "translateY(0) scale(1)"
                }
            ],
            {
                duration: 620,
                easing:
                    "cubic-bezier(.18,.78,.22,1)",
                fill: "forwards"
            }
        );


    try {
        await flight.finished;
    }
    catch {
        // Animation cancellation is harmless.
    }


    clone.remove();


    source.classList.remove(
        "draft-source-lifting"
    );


    target.classList.remove(
        "empty"
    );


    target.style.setProperty(
        "--draft-land-color",
        playerColor(
            pick.player_id
        )
    );


    target.innerHTML = `
        <div class="draft-roster-tier">
            ${escapeHtml(pick.tier)}
        </div>

        <div class="draft-roster-name">
            ${escapeHtml(pick.unit_name)}
        </div>

        <div class="draft-roster-meta">
            ${escapeHtml(pick.faction)}
            •
            ${Number(pick.cost).toLocaleString()}
        </div>
    `;


    target.classList.add(
        "draft-slot-land"
    );


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                170
            )
    );
}

function animateDraftGlider() {

    const from =
        pendingDraftGliderStart;


    pendingDraftGliderStart =
        null;


    if (!from) {
        return;
    }


    const strip =
        document.querySelector(
            ".draft-order-strip"
        );

    const current =
        document.querySelector(
            ".draft-order-card.current"
        );

    const glider =
        document.querySelector(
            ".draft-order-glider"
        );


    if (
        !strip
        ||
        !current
        ||
        !glider
    ) {
        return;
    }


    glider.style.setProperty(
        "--glider-color",
        getComputedStyle(
            current
        ).getPropertyValue(
            "--player"
        )
        || "#ffffff"
    );


    // The glider is a newly-rendered element, so its CSS default
    // position is 0,0. Place it on the PREVIOUS player's card
    // instantly before enabling movement transitions. Otherwise
    // the browser visibly animates from the strip's top-left corner.
    glider.style.transition =
        "none";


    Object.assign(
        glider.style,
        {
            left:
                `${from.left}px`,

            top:
                `${from.top}px`,

            width:
                `${from.width}px`,

            height:
                `${from.height}px`,

            opacity: "1"
        }
    );


    // Force the browser to commit the starting geometry while
    // transitions are disabled.
    void glider.offsetWidth;


    glider.style.transition = `
        left 480ms cubic-bezier(.2,.82,.2,1),
        top 480ms cubic-bezier(.2,.82,.2,1),
        width 480ms cubic-bezier(.2,.82,.2,1),
        height 480ms cubic-bezier(.2,.82,.2,1),
        opacity 160ms ease
    `;


    const targetLeft =
        current.offsetLeft;


    const pulseClass =
        targetLeft > from.left
        ? "pulse-from-left"
        : targetLeft < from.left
        ? "pulse-from-right"
        : null;


    requestAnimationFrame(
        () => {

            glider.style.left =
                `${targetLeft}px`;

            glider.style.top =
                `${current.offsetTop}px`;

            glider.style.width =
                `${current.offsetWidth}px`;

            glider.style.height =
                `${current.offsetHeight}px`;

        }
    );


    if (pulseClass) {

        setTimeout(
            () => {

                current.classList.remove(
                    "pulse-from-left",
                    "pulse-from-right",
                    "direction-pulse"
                );


                // Force a style flush so repeated left/right pulses
                // can restart cleanly on the next draft change.
                void current.offsetWidth;


                current.classList.add(
                    "direction-pulse",
                    pulseClass
                );


                setTimeout(
                    () => {
                        current.classList.remove(
                            "pulse-from-left",
                            "pulse-from-right",
                            "direction-pulse"
                        );
                    },
                    760
                );

            },
            310
        );
    }


    setTimeout(
        () => {
            glider.style.opacity = "0";
        },
        560
    );
}

function nextDraftPlayers(
    count = 2
) {

    const ordered =
        draftOrderPlayers();

    const countPlayers =
        ordered.length;

    if (!countPlayers) {
        return [];
    }

    const pick =
        state.event.draft_pick_number ?? 1;

    const round =
        Math.floor(
            (pick - 1) / countPlayers
        ) + 1;

    const index =
        (pick - 1) % countPlayers;

    const direction =
        round % 2 === 1 ? 1 : -1;

    const currentPos =
        direction === 1
        ? index
        : (countPlayers - 1 - index);

    const sequence = [];

    for (let offset = 1; offset <= count; offset++) {

        let posIndex = currentPos;
        let currentRound = round;
        let currentDirection = direction;

        for (let step = 0; step < offset; step++) {

            if (
                currentDirection === 1
                && posIndex === countPlayers - 1
            ) {
                currentRound += 1;
                currentDirection = -1;
            }
            else if (
                currentDirection === -1
                && posIndex === 0
            ) {
                currentRound += 1;
                currentDirection = 1;
            }
            else {
                posIndex += currentDirection;
            }
        }

        sequence.push(
            ordered[posIndex]
        );
    }

    return sequence.filter(Boolean);
}

function shopData() {

    return (
        state?.shop
        ?? {
            players: [],
            skill_nodes: [],
            skills: [],
            items: []
        }
    );
}


function shopPlayersForSnapshot(
    snapshot
) {

    return (
        snapshot?.shop?.players
        ??
        snapshot?.players
        ??
        []
    );
}


function sortShopPlayers(
    players
) {

    return [...(players ?? [])]
        .sort(
            (a,b) =>
                Number(b.war_chest ?? 0)
                -
                Number(a.war_chest ?? 0)
                ||
                Number(b.wins ?? 0)
                -
                Number(a.wins ?? 0)
                ||
                String(a.display_name ?? "")
                .localeCompare(
                    String(b.display_name ?? "")
                )
        );
}


function shopStandings() {

    const players =
        shopData().players?.length
        ? shopData().players
        : state.players;

    return sortShopPlayers(
        players
    );
}


function shopPlayerById(
    playerId
) {

    return (
        shopData().players
        ?.find(
            player =>
                player.id ===
                playerId
        )
        ??
        state.players
        ?.find(
            player =>
                player.id ===
                playerId
        )
        ??
        null
    );
}


function shopPlayerColor(
    playerId
) {

    const player =
        shopPlayerById(
            playerId
        );

    const rawColor =
        player?.color_code;

    return (
        PLAYER_COLORS[
            rawColor
        ]
        ??
        rawColor
        ??
        playerColor(
            playerId
        )
    );
}


function shopItemCount(
    snapshot,
    playerId,
    itemCode
) {

    return Number(
        snapshot?.shop?.items
        ?.find(
            item =>
                item.player_id ===
                    playerId
                &&
                item.item_code ===
                    itemCode
        )
        ?.quantity
        ?? 0
    );
}


function shopSkillRows(
    snapshot = state
) {

    return (
        snapshot?.shop?.skills
        ?? []
    );
}


function shopSkillOwned(
    snapshot,
    playerId,
    nodeCode
) {

    return shopSkillRows(
        snapshot
    ).some(
        row =>
            row.player_id ===
                playerId
            &&
            row.node_code ===
                nodeCode
    );
}


function shopHasPriorLiveSnapshot() {

    return (
        previousState?.event?.status ===
        "shop"
        &&
        previousState?.shop
    );
}


function shopSkillIsNew(
    playerId,
    nodeCode
) {

    if (!shopHasPriorLiveSnapshot()) {
        return false;
    }


    return (
        shopSkillOwned(
            state,
            playerId,
            nodeCode
        )
        &&
        !shopSkillOwned(
            previousState,
            playerId,
            nodeCode
        )
    );
}


function shopNewUnlocks() {

    if (!shopHasPriorLiveSnapshot()) {
        return [];
    }


    return shopSkillRows(
        state
    )
    .filter(
        row =>
            !shopSkillOwned(
                previousState,
                row.player_id,
                row.node_code
            )
    )
    .map(
        row => ({
            playerId:
                row.player_id,
            nodeCode:
                row.node_code
        })
    );
}


function shopPlayerChanged(
    playerId
) {

    if (!shopHasPriorLiveSnapshot()) {
        return false;
    }


    const current =
        shopPlayersForSnapshot(
            state
        ).find(
            player =>
                player.id ===
                playerId
        );


    const prior =
        shopPlayersForSnapshot(
            previousState
        ).find(
            player =>
                player.id ===
                playerId
        );


    if (
        !current
        ||
        !prior
    ) {
        return false;
    }


    if (
        Number(current.war_chest ?? 0)
        !==
        Number(prior.war_chest ?? 0)
        ||
        Number(current.skill_points ?? 0)
        !==
        Number(prior.skill_points ?? 0)
    ) {
        return true;
    }


    for (
        const itemCode
        of [
            "reinforcements",
            "mercenary",
            "war-bond",
            "rainy-day"
        ]
    ) {

        if (
            shopItemCount(
                state,
                playerId,
                itemCode
            )
            !==
            shopItemCount(
                previousState,
                playerId,
                itemCode
            )
        ) {
            return true;
        }
    }


    const currentSkillCount =
        shopSkillRows(
            state
        )
        .filter(
            row =>
                row.player_id ===
                playerId
        )
        .length;


    const priorSkillCount =
        shopSkillRows(
            previousState
        )
        .filter(
            row =>
                row.player_id ===
                playerId
        )
        .length;


    return (
        currentSkillCount
        !==
        priorSkillCount
    );
}


function renderShopItemSlots(
    playerId
) {

    const currentItems = [];

    const codes = [
        "reinforcements",
        "mercenary",
        "war-bond",
        "rainy-day"
    ];


    for (
        const code
        of codes
    ) {

        const currentCount =
            shopItemCount(
                state,
                playerId,
                code
            );


        const priorCount =
            shopHasPriorLiveSnapshot()
            ? shopItemCount(
                previousState,
                playerId,
                code
              )
            : currentCount;


        for (
            let index = 0;
            index < currentCount;
            index++
        ) {

            currentItems.push({
                code,
                isNew:
                    index >=
                    priorCount
            });
        }
    }


    const visible =
        currentItems.slice(
            0,
            2
        );


    while (
        visible.length < 2
    ) {

        visible.push({
            code: null,
            isNew: false
        });
    }


    return `
        <div class="shop-item-slots">

            ${
                visible.map(
                    item => {

                        if (!item.code) {

                            return `
                                <div class="shop-item-slot empty">
                                    —
                                </div>
                            `;
                        }


                        const label =
                            item.code ===
                                "reinforcements"
                            ? "+750"
                            : item.code ===
                                "mercenary"
                            ? "MERC"
                            : item.code ===
                                "war-bond"
                            ? "BOND"
                            : "RAIN";


                        return `
                            <div
                                class="
                                    shop-item-slot
                                    filled
                                    ${
                                        item.isNew
                                        ? "shop-item-new"
                                        : ""
                                    }
                                "
                            >
                                ${label}
                            </div>
                        `;
                    }
                ).join("")
            }

        </div>
    `;
}

function launchShopSkillStreak(
    sourceEl,
    targetEl,
    color
) {

    if (
        !sourceEl
        ||
        !targetEl
    ) {
        return;
    }


    const sourceRect =
        sourceEl.getBoundingClientRect();

    const targetRect =
        targetEl.getBoundingClientRect();


    const x1 =
        sourceRect.right - 18;

    const y1 =
        sourceRect.top
        +
        sourceRect.height / 2;

    const x2 =
        targetRect.left
        +
        targetRect.width / 2;

    const y2 =
        targetRect.top
        +
        targetRect.height / 2;


    const dx = x2 - x1;
    const dy = y2 - y1;

    const length =
        Math.max(
            24,
            Math.hypot(dx, dy)
        );

    const angle =
        Math.atan2(dy, dx)
        *
        180
        /
        Math.PI;


    const streak =
        document.createElement(
            "div"
        );

    streak.className =
        "shop-skill-streak";

    streak.style.left =
        `${x1}px`;

    streak.style.top =
        `${y1}px`;

    streak.style.width =
        `${length}px`;

    streak.style.setProperty(
        "--streak",
        color
    );

    streak.style.transform =
        `translateY(-50%) rotate(${angle}deg)`;


    document.body.appendChild(
        streak
    );


    const animation =
        streak.animate(
            [
                {
                    opacity: 0,
                    transform:
                        `translateY(-50%) rotate(${angle}deg) scaleX(.02)`,
                    filter:
                        "blur(1.6px)"
                },
                {
                    opacity: .72,
                    offset: .18,
                    transform:
                        `translateY(-50%) rotate(${angle}deg) scaleX(.28)`,
                    filter:
                        "blur(.9px)"
                },
                {
                    opacity: 1,
                    offset: .62,
                    transform:
                        `translateY(-50%) rotate(${angle}deg) scaleX(.94)`,
                    filter:
                        "blur(0px)"
                },
                {
                    opacity: .84,
                    offset: .82,
                    transform:
                        `translateY(-50%) rotate(${angle}deg) scaleX(1)`,
                    filter:
                        "blur(.15px)"
                },
                {
                    opacity: 0,
                    transform:
                        `translateY(-50%) rotate(${angle}deg) scaleX(1.015)`,
                    filter:
                        "blur(1px)"
                }
            ],
            {
                duration: 540,
                easing:
                    "cubic-bezier(.22,.61,.28,1)",
                fill: "forwards"
            }
        );


    animation.finished
        .catch(() => {})
        .finally(
            () => streak.remove()
        );
}


function animateShopSkillUnlock(
    unlock,
    sequenceIndex = 0
) {

    /*
       Cohesive overlapping sequence:
       - streak begins immediately
       - anchor starts reacting before streak fully ends
       - ownership fades in during anchor's tail
       - node pulse overlaps ownership fade

       This reads as one continuous transfer instead of four isolated beats.
    */
    const delay =
        sequenceIndex * 220;


    window.setTimeout(
        () => {

            const playerId =
                unlock.playerId;

            const nodeCode =
                unlock.nodeCode;

            const color =
                shopPlayerColor(
                    playerId
                );


            const playerBar =
                document.querySelector(
                    `.shop-player-bar[data-shop-player-id="${playerId}"]`
                );

            const skillNode =
                document.querySelector(
                    `.shop-skill-node[data-shop-node="${nodeCode}"]`
                );

            const skillAnchor =
                skillNode?.querySelector(
                    ".shop-skill-anchor"
                );

            const pendingDot =
                skillNode?.querySelector(
                    `.shop-owner-dot.shop-owner-pending[data-shop-owner-id="${playerId}"]`
                );


            if (
                !playerBar
                ||
                !skillNode
                ||
                !skillAnchor
            ) {
                return;
            }


            skillAnchor.style.setProperty(
                "--unlock-color",
                color
            );

            skillNode.style.setProperty(
                "--unlock-color",
                color
            );


            // 0ms: launch the streak.
            launchShopSkillStreak(
                playerBar,
                skillAnchor,
                color
            );


            // 300ms: circle starts reacting while the streak is still arriving.
            window.setTimeout(
                () => {

                    skillAnchor.classList.remove(
                        "shop-anchor-activate"
                    );

                    void skillAnchor.offsetWidth;

                    skillAnchor.classList.add(
                        "shop-anchor-activate"
                    );
                },
                270
            );


            // 760ms: ownership begins fading in during the circle's tail.
            window.setTimeout(
                () => {

                    if (pendingDot) {

                        pendingDot.style.opacity =
                            "0";

                        pendingDot.style.transform =
                            "scale(.74)";

                        pendingDot.style.boxShadow =
                            "none";


                        pendingDot.classList.remove(
                            "shop-owner-pending"
                        );

                        pendingDot.classList.remove(
                            "shop-owner-new"
                        );


                        window.requestAnimationFrame(
                            () => {

                                pendingDot.classList.add(
                                    "shop-owner-new"
                                );


                                window.setTimeout(
                                    () => {

                                        pendingDot.style.opacity = "";
                                        pendingDot.style.transform = "";
                                        pendingDot.style.boxShadow = "";

                                    },
                                    470
                                );
                            }
                        );
                    }
                },
                720
            );


            // 900ms: card pulse begins while ownership fade is still resolving.
            window.setTimeout(
                () => {

                    skillNode.classList.remove(
                        "shop-node-unlock"
                    );

                    void skillNode.offsetWidth;

                    skillNode.classList.add(
                        "shop-node-unlock"
                    );
                },
                900
            );


            // Cleanup well after the overlapping sequence has visually ended.
            window.setTimeout(
                () => {

                    skillAnchor.classList.remove(
                        "shop-anchor-activate"
                    );

                    skillNode.classList.remove(
                        "shop-node-unlock"
                    );
                },
                1900
            );

        },
        delay
    );
}



function runShopPostRenderAnimations() {

    if (
        state?.event?.status !==
        "shop"
    ) {
        return;
    }


    if (
        previousState?.event?.status !==
        "shop"
    ) {
        return;
    }


    const currentPlayers =
        sortShopPlayers(
            shopPlayersForSnapshot(
                state
            )
        );


    const priorPlayers =
        sortShopPlayers(
            shopPlayersForSnapshot(
                previousState
            )
        );


    const priorIndex =
        new Map(
            priorPlayers.map(
                (player,index) =>
                    [
                        player.id,
                        index
                    ]
            )
        );


    const bars =
        Array.from(
            document.querySelectorAll(
                ".shop-player-bar"
            )
        );


    if (bars.length) {

        const rect =
            bars[0]
            .getBoundingClientRect();


        const list =
            bars[0]
            .parentElement;


        const styles =
            list
            ? getComputedStyle(
                list
              )
            : null;


        const gap =
            Number.parseFloat(
                styles?.rowGap
                ??
                styles?.gap
                ??
                "0"
            )
            || 0;


        const step =
            rect.height
            +
            gap;


        bars.forEach(
            bar => {

                const playerId =
                    bar.dataset
                    .shopPlayerId;


                const newIndex =
                    currentPlayers
                    .findIndex(
                        player =>
                            player.id ===
                            playerId
                    );


                const oldIndex =
                    priorIndex.has(
                        playerId
                    )
                    ? priorIndex.get(
                        playerId
                      )
                    : newIndex;


                const delta =
                    oldIndex
                    -
                    newIndex;


                if (!delta) {
                    return;
                }


                bar.animate(
                    [
                        {
                            transform:
                                `translateY(${delta * step}px)`,
                            zIndex: 8
                        },
                        {
                            transform:
                                "translateY(0)",
                            zIndex: 1
                        }
                    ],
                    {
                        duration: 650,
                        easing:
                            "cubic-bezier(.16,.86,.25,1)"
                    }
                );
            }
        );
    }


    const unlocks =
        shopNewUnlocks();


    if (unlocks.length) {

        /*
           Current visual sequence:
             streak        ~700ms
             anchor starts 560ms
             owner starts  1540ms
             node starts   2240ms
             cleanup       3600ms

           Give the final queued unlock a little safety margin so the
           next 900ms poll cannot land on the tail of the animation.
        */
        const unlockSequenceDuration =
            2250
            +
            Math.max(
                0,
                unlocks.length - 1
            )
            *
            220;


        shopUnlockAnimationUntil =
            performance.now()
            +
            unlockSequenceDuration;
    }


    unlocks.forEach(
        (unlock, index) =>
            animateShopSkillUnlock(
                unlock,
                index
            )
    );


    document
        .querySelectorAll(
            "[data-shop-money-player]"
        )
        .forEach(
            node => {

                const playerId =
                    node.dataset
                    .shopMoneyPlayer;


                const current =
                    currentPlayers.find(
                        player =>
                            player.id ===
                            playerId
                    );


                const prior =
                    priorPlayers.find(
                        player =>
                            player.id ===
                            playerId
                    );


                if (
                    !current
                    ||
                    !prior
                ) {
                    return;
                }


                const from =
                    Number(
                        prior.war_chest
                        ?? 0
                    );


                const to =
                    Number(
                        current.war_chest
                        ?? 0
                    );


                if (
                    from ===
                    to
                ) {
                    return;
                }


                const started =
                    performance.now();


                const duration =
                    720;


                const tick =
                    now => {

                        const progress =
                            Math.min(
                                1,
                                (
                                    now
                                    -
                                    started
                                )
                                /
                                duration
                            );


                        const eased =
                            1
                            -
                            Math.pow(
                                1 - progress,
                                3
                            );


                        const value =
                            Math.round(
                                from
                                +
                                (
                                    to
                                    -
                                    from
                                )
                                *
                                eased
                            );


                        node.textContent =
                            money(
                                value
                            );


                        if (
                            progress < 1
                        ) {

                            requestAnimationFrame(
                                tick
                            );
                        }
                    };


                requestAnimationFrame(
                    tick
                );
            }
        );
}

function armyBuildEntriesForSnapshot(
    snapshot
) {

    return (
        snapshot?.army_build?.entries
        ?? []
