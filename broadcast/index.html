function maybeShowWinner() {

    if (
        state.event.status !== "fight"
    ) {
        return;
    }


    const match =
        currentMatch();


    if (!match?.winner_player_id) {
        return;
    }


    const key =
        `${match.id}:${match.winner_player_id}`;


    if (key === lastWinnerKey) {
        return;
    }


    lastWinnerKey = key;


    const banner =
        document.getElementById(
            "winner-banner"
        );


    banner.innerHTML = `
        <div
            class="winner-banner-inner"
            style="
                --player:
                ${playerColor(match.winner_player_id)};
            "
        >
            <small>VICTORY</small>
            <strong>
                ${escapeHtml(
                    playerName(
                        match.winner_player_id
                    )
                )}
            </strong>
        </div>
    `;


    banner.classList.remove("hidden");


    clearTimeout(
        winnerTimer
    );


    winnerTimer =
        setTimeout(
            () =>
                banner.classList.add("hidden"),
            2600
        );
}


function settlementResults(
    settlement
) {

    const result =
        new Map();


    const add = (
        playerId,
        value,
        label
    ) => {

        if (!playerId) {
            return;
        }


        const current =
            result.get(playerId)
            ?? {
                value: 0,
                labels: []
            };


        current.value +=
            Number(value ?? 0);


        if (
            label
            &&
            Number(value ?? 0) !== 0
        ) {
            current.labels.push(label);
        }


        result.set(
            playerId,
            current
        );
    };


    // Winner's $500 battle purse.
    add(
        settlement.winner_player_id,
        500,
        "Battle purse"
    );


    for (
        const bet of
        settlement.standard_bets ?? []
    ) {

        add(
            bet.player_id,
            Number(bet.payout ?? 0)
            -
            Number(bet.amount ?? 0),
            "Winner bet"
        );
    }


    for (
        const hedge of
        settlement.hedges ?? []
    ) {

        add(
            hedge.player_id,
            Number(hedge.payout ?? 0)
            -
            Number(hedge.stake ?? 0),
            "Hedge"
        );
    }


    for (
        const prop of
        settlement.props ?? []
    ) {

        add(
            prop.player_id,
            Number(prop.payout ?? 0)
            -
            Number(prop.amount ?? 0),
            "Prop"
        );
    }


    for (
        const parlay of
        settlement.parlays ?? []
    ) {

        add(
            parlay.player_id,
            Number(parlay.payout ?? 0)
            -
            Number(parlay.starting_amount ?? 0),
            parlay.leg_count === 3
            ? "Moonshot"
            : "Parlay"
        );
    }


    return result;
}


function maybeShowPayout() {

    const settlement =
        state.latest_settlement;


    if (!settlement?.match_id) {
        return;
    }


    if (
        settlement.match_id ===
        lastSettlementId
    ) {
        return;
    }


    lastSettlementId =
        settlement.match_id;


    const overlay =
        document.getElementById(
            "payout-overlay"
        );


    const results =
        settlementResults(
            settlement
        );


    const rows =
        standings()
        .map(
            player => {

                const result =
                    results.get(
                        player.id
                    )
                    ?? {
                        value: 0,
                        labels: []
                    };


                const cssClass =
                    result.value > 0
                    ? "positive"
                    : result.value < 0
                    ? "negative"
                    : "";


                return `
                    <div
                        class="
                            payout-player
                            ${cssClass}
                        "
                        style="
                            --player:
                            ${playerColor(player.id)};
                        "
                    >

                        <div class="p-name">
                            ${escapeHtml(player.display_name)}
                        </div>

                        <div class="p-delta">
                            ${signedMoney(result.value)}
                        </div>

                        <div class="p-total">
                            War Chest:
                            ${money(player.war_chest)}
                        </div>

                        ${
                            result.labels.length
                            ? `
                                <div
                                    style="
                                        margin-top:5px;
                                        color:var(--muted);
                                        font-size:.7rem;
                                    "
                                >
                                    ${escapeHtml(
                                        result.labels.join(" • ")
                                    )}
                                </div>
                              `
                            : ""
                        }

                    </div>
                `;
            }
        )
        .join("");


    overlay.innerHTML = `
        <div class="payout-board">

            <div class="payout-heading">

                <h2>
                    Settling Fight ${settlement.match_number}
                </h2>

                <p>
                    Bet results, completed advanced wagers, and the $500 battle purse.
                </p>

            </div>

            <div class="payout-grid">
                ${rows}
            </div>

        </div>
    `;


    overlay.classList.add(
        "active"
    );


    clearTimeout(
        payoutTimer
    );


    payoutTimer =
        setTimeout(
            () => {

                overlay.classList.remove(
                    "active"
                );

            },
            6200
        );
}


async function initialize() {

    const fromUrl =
        roomFromUrl();


    if (fromUrl) {

        document
            .getElementById(
                "room-code"
            )
            .value =
                fromUrl;


        await connectBroadcast();

        return;
    }


    document
        .getElementById(
            "room-code"
        )
        .focus();
}


document
    .getElementById(
        "room-code"
    )
    .addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                connectBroadcast();
            }
        }
    );


initialize();
</script>
