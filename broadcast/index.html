<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Broadcast | TABS War Chest Betting Special
</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #090c13;
    --panel: rgba(27,32,45,.92);
    --panel-soft: rgba(255,255,255,.055);
    --line: rgba(255,255,255,.12);
    --text: #f7f8fb;
    --muted: rgba(247,248,251,.62);
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    background:
        radial-gradient(
            circle at 50% -15%,
            rgba(86,105,150,.26),
            transparent 38%
        ),
        linear-gradient(
            180deg,
            #111724,
            #080b11 72%
        );
}

button,
input {
    font: inherit;
}

.hidden {
    display: none !important;
}

#app {
    position: relative;
    width: 100%;
    height: 100%;
}

.setup-screen {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 40px;
    background: #0b0f18;
}

.setup-card {
    width: min(620px, 92vw);
    padding: 34px;
    border-radius: 22px;
    background: #1b2130;
    border: 1px solid var(--line);
    text-align: center;
}

.setup-card h1 {
    margin: 0 0 8px;
    font-size: 3rem;
}

.setup-card p {
    color: var(--muted);
}

.setup-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    margin-top: 24px;
}

.setup-row input {
    min-width: 0;
    padding: 15px 16px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #101521;
    color: white;
    text-transform: uppercase;
    letter-spacing: .12em;
}

.setup-row button {
    padding: 15px 20px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.25);
    background: #f3f4f7;
    color: #11151e;
    font-weight: 800;
    cursor: pointer;
}

.setup-message {
    min-height: 1.4em;
    margin-top: 12px;
    color: #ffb8b8;
}

.broadcast-shell {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: 86px minmax(0,1fr) 60px;
}

.show-header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 20px;
    padding: 16px 30px;
    border-bottom: 1px solid var(--line);
    background: rgba(8,11,17,.76);
}

.brand {
    display: flex;
    align-items: baseline;
    gap: 16px;
    min-width: 0;
}

.brand strong {
    font-size: 1.22rem;
    letter-spacing: .12em;
}

.brand span {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .13em;
    font-size: .72rem;
}

.phase-chip {
    padding: 9px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.055);
    text-transform: uppercase;
    letter-spacing: .1em;
    font-weight: 800;
    font-size: .75rem;
}

.stage {
    position: relative;
    min-height: 0;
    overflow: hidden;
    padding: 26px 30px;
}

.scene {
    position: absolute;
    inset: 26px 30px;
    opacity: 0;
    transform: translateY(18px) scale(.99);
    pointer-events: none;
    transition:
        opacity 360ms ease,
        transform 360ms ease;
}

.scene.active {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
}

.show-footer {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 18px;
    padding: 0 30px;
    border-top: 1px solid var(--line);
    background: rgba(8,11,17,.82);
    color: var(--muted);
    font-size: .78rem;
}

.show-footer strong {
    color: white;
}

.footer-status {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.scene-title {
    margin: 0;
    font-size: clamp(2.4rem, 4vw, 4.8rem);
    line-height: .98;
    letter-spacing: -.045em;
}

.scene-kicker {
    margin-bottom: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .15em;
    font-weight: 800;
    font-size: .76rem;
}

.scene-subtitle {
    margin-top: 14px;
    color: var(--muted);
    font-size: 1.1rem;
}

.cast-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 14px;
    margin-top: 24px;
}

.player-card {
    --player: #7c8aa6;
    position: relative;
    min-width: 0;
    padding: 18px;
    border-radius: 16px;
    background:
        linear-gradient(
            145deg,
            color-mix(in srgb, var(--player) 11%, transparent),
            rgba(255,255,255,.045) 48%
        );
    border: 1px solid rgba(255,255,255,.11);
    overflow: hidden;
}

.player-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 5px;
    background: var(--player);
}

.player-card .rank {
    color: var(--muted);
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .1em;
}

.player-card .name {
    margin-top: 5px;
    font-size: 1.25rem;
    font-weight: 850;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-card .money {
    margin-top: 10px;
    font-size: 1.75rem;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
}

.player-card .meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: .8rem;
}

.player-card.ready {
    border-color:
        color-mix(
            in srgb,
            var(--player) 65%,
            white 8%
        );
}

.player-card.ready::after {
    content: "READY";
    position: absolute;
    right: 10px;
    top: 10px;
    color: var(--player);
    font-size: .66rem;
    letter-spacing: .1em;
    font-weight: 900;
}

.hero-split {
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0,1fr) 130px minmax(0,1fr);
    align-items: stretch;
    gap: 18px;
}

.fighter-panel {
    --player: #7c8aa6;
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 24px;
    border-radius: 20px;
    background:
        linear-gradient(
            155deg,
            color-mix(in srgb, var(--player) 14%, transparent),
            rgba(255,255,255,.045)
        );
    border: 1px solid rgba(255,255,255,.12);
    box-shadow:
        inset 0 4px 0
        color-mix(in srgb, var(--player) 80%, transparent);
}

.fighter-panel .fighter-name {
    font-size: clamp(2rem, 3.3vw, 4.1rem);
    font-weight: 950;
    line-height: 1;
}

.fighter-panel .fighter-money {
    margin-top: 10px;
    color: var(--muted);
    font-size: 1rem;
}

.vs {
    display: grid;
    place-items: center;
    font-size: 2.2rem;
    font-weight: 1000;
    color: rgba(255,255,255,.35);
}

.army-zones {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 9px;
    margin-top: 18px;
    min-height: 0;
}

.army-zone {
    min-width: 0;
    padding: 12px;
    border-radius: 12px;
    background: rgba(0,0,0,.16);
    border: 1px solid rgba(255,255,255,.08);
}

.army-zone h4 {
    margin: 0 0 8px;
    color: var(--muted);
    font-size: .66rem;
    letter-spacing: .12em;
}

.army-unit {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 4px 0;
    font-size: .78rem;
}

.army-unit span:first-child {
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.army-total {
    margin-top: auto;
    padding-top: 14px;
    font-size: 1.25rem;
    font-weight: 900;
}

.pool-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 14px;
    margin-top: 20px;
}

.pool-card {
    --p1: #7c8aa6;
    --p2: #7c8aa6;
    padding: 18px;
    border-radius: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
}

.pool-card.current {
    outline: 2px solid rgba(255,255,255,.26);
}

.pool-title {
    color: var(--muted);
    font-size: .72rem;
    letter-spacing: .1em;
    text-transform: uppercase;
}

.pool-sides {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 10px;
}

.pool-side {
    padding: 12px;
    border-radius: 10px;
    background: rgba(255,255,255,.045);
}

.pool-side.one {
    border-top: 4px solid var(--p1);
}

.pool-side.two {
    border-top: 4px solid var(--p2);
}

.pool-side .pool-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 800;
}

.pool-side .pool-money {
    margin-top: 5px;
    font-size: 1.4rem;
    font-weight: 900;
}

.draft-scene {
    height: 100%;
    display: grid;
    grid-template-rows: minmax(0,1fr) 112px;
    gap: 16px;
}

.draft-layout {
    display: grid;
    grid-template-columns: 1.05fr 1.7fr;
    gap: 18px;
    min-height: 0;
}

.draft-left {
    display: grid;
    grid-template-rows: auto minmax(0,1fr) auto;
    gap: 14px;
    min-height: 0;
}

.draft-hero {
    --player: #7c8aa6;
    padding: 24px;
    border-radius: 20px;
    background:
        linear-gradient(
            155deg,
            color-mix(in srgb, var(--player) 17%, transparent),
            rgba(255,255,255,.045)
        );
    border: 1px solid var(--line);
    box-shadow:
        inset 0 4px 0
        color-mix(in srgb, var(--player) 85%, transparent);
}

.draft-hero .pick-num {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .16em;
    font-size: .72rem;
    font-weight: 900;
}

.draft-hero .on-clock {
    margin-top: 12px;
    font-size: clamp(2.7rem, 4.3vw, 4.9rem);
    line-height: .95;
    font-weight: 980;
}

.draft-hero .clock-sub {
    margin-top: 10px;
    color: rgba(255,255,255,.82);
    font-size: 1rem;
}

.draft-roster-panel {
    min-height: 0;
    padding: 16px;
    border-radius: 18px;
    background: rgba(11,16,25,.7);
    border: 1px solid rgba(255,255,255,.08);
}

.draft-panel-label {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .12em;
    font-size: .69rem;
    font-weight: 900;
    margin-bottom: 10px;
}

.draft-current-roster {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    grid-template-rows: repeat(2, minmax(0,1fr));
    gap: 8px;
    min-height: 0;
}

.draft-roster-card {
    min-width: 0;
    min-height: 0;
    padding: 9px 9px 8px;
    border-radius: 11px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.072),
            rgba(255,255,255,.032)
        );
    border: 1px solid rgba(255,255,255,.08);
    overflow: hidden;
}

.draft-roster-card.empty {
    display: grid;
    place-items: center;
    color: rgba(255,255,255,.20);
    border-style: dashed;
    background: rgba(255,255,255,.018);
    font-size: 1.15rem;
    font-weight: 900;
}

.draft-roster-tier {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 5px;
    border-radius: 999px;
    background: rgba(255,255,255,.08);
    color: var(--muted);
    font-size: .58rem;
    letter-spacing: .07em;
    font-weight: 850;
}

.draft-roster-name {
    margin-top: 6px;
    font-weight: 900;
    line-height: 1.05;
    font-size: .82rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.draft-roster-meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: .64rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.draft-aux-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.last-pick,
.next-up {
    padding: 14px 16px;
    border-radius: 14px;
    background: rgba(0,0,0,.16);
    border: 1px solid rgba(255,255,255,.07);
}

.last-pick strong,
.next-up strong {
    display: block;
    margin-top: 5px;
    font-size: 1.02rem;
}

.next-up-list {
    margin-top: 8px;
    display: grid;
    gap: 6px;
}

.next-up-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    color: rgba(255,255,255,.9);
    font-size: .85rem;
}

.draft-market {
    min-height: 0;
    display: grid;
    grid-template-rows: auto minmax(0,1fr);
    gap: 12px;
    padding: 18px;
    border-radius: 20px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.09);
    overflow: hidden;
}

.draft-market-head {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: baseline;
}

.draft-market-head h3 {
    margin: 0;
    font-size: 1.4rem;
}

.draft-market-head div {
    color: var(--muted);
    font-size: .85rem;
}

.market-board {
    --market-tile: clamp(44px, 2.72vw, 53px);
    min-height: 0;
    display: grid;
    align-content: start;
    gap: 8px;
    padding-top: 13px;
    overflow: hidden;
}

.market-band {
    --tier-color: #8b97ae;
    --cols: 18;
    position: relative;
    width: max-content;
    max-width: 100%;
    min-height: 0;
    padding: 8px;
    border: 3px solid var(--tier-color);
    border-radius: 13px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.012)
        );
    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.035);
}

.market-band-tab {
    position: absolute;
    z-index: 2;
    top: -3px;
    right: 10px;
    transform: translateY(-50%);
    min-width: 74px;
    padding: 5px 13px;
    border-radius: 8px;
    background: var(--tier-color);
    color: #0d1119;
    font-size: .72rem;
    line-height: 1;
    text-align: center;
    font-weight: 1000;
    letter-spacing: .08em;
    text-transform: uppercase;
    white-space: nowrap;
    box-shadow: 0 7px 16px rgba(0,0,0,.24);
}

.market-band-grid {
    min-height: 0;
    display: grid;
    grid-template-columns:
        repeat(
            var(--cols),
            var(--market-tile)
        );
    grid-auto-rows: var(--market-tile);
    gap: 5px;
}

.market-tile {
    min-width: 0;
    min-height: 0;
    aspect-ratio: 1 / 1;
    padding: 5px 4px 4px;
    border-radius: 7px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.105),
            rgba(255,255,255,.050)
        );
    border: 1px solid rgba(255,255,255,.085);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 3px;
    overflow: hidden;
}

.market-tile-name {
    font-size: .53rem;
    line-height: 1.02;
    font-weight: 900;
    color: rgba(255,255,255,.97);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-wrap: balance;
}

.market-tile-cost {
    align-self: flex-end;
    font-size: .50rem;
    color: rgba(255,255,255,.7);
    font-weight: 850;
    font-variant-numeric: tabular-nums;
}

.market-band-S { --tier-color: #FF4D5A; }
.market-band-A { --tier-color: #F2C94C; }
.market-band-B { --tier-color: #FF8A3D; }
.market-band-C { --tier-color: #3B82F6; }
.market-band-D { --tier-color: #8B5CF6; }

.draft-order-strip {
    display: grid;
    grid-template-columns: repeat(8, minmax(0,1fr));
    gap: 10px;
    align-items: stretch;
}

.draft-order-card {
    --player: #7c8aa6;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    border-top: 4px solid var(--player);
    transition:
        transform 220ms ease,
        box-shadow 220ms ease,
        background 220ms ease;
}

.draft-order-card.current {
    background:
        linear-gradient(
            155deg,
            color-mix(in srgb, var(--player) 20%, transparent),
            rgba(255,255,255,.07)
        );
    box-shadow:
        0 0 0 1px color-mix(in srgb, var(--player) 42%, transparent),
        0 10px 26px rgba(0,0,0,.24);
    transform: translateY(-4px);
}

.draft-order-card .order-label {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .12em;
    font-size: .62rem;
    font-weight: 900;
}

.draft-order-card .order-name {
    margin-top: 5px;
    font-size: .92rem;
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.draft-order-card .order-meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: .74rem;
}

@media (max-aspect-ratio: 16/10) {
    .draft-layout {
        grid-template-columns: 1fr 1.35fr;
    }
    .market-board {
        --market-tile: clamp(40px, 2.45vw, 48px);
    }
    .draft-order-strip {
        grid-template-columns: repeat(4, minmax(0,1fr));
    }
}

.leaderboard {
    display: grid;
    gap: 9px;
    margin-top: 20px;
}

.leader-row {
    --player: #7c8aa6;
    display: grid;
    grid-template-columns: 60px minmax(0,1fr) 140px 120px;
    align-items: center;
    gap: 14px;
    min-height: 58px;
    padding: 9px 16px;
    border-radius: 12px;
    background: rgba(255,255,255,.045);
    border-left: 5px solid var(--player);
    transition:
        transform 500ms ease,
        background 300ms ease;
}

.leader-rank {
    font-size: 1.45rem;
    font-weight: 950;
}

.leader-name {
    font-size: 1.05rem;
    font-weight: 850;
}

.leader-money {
    text-align: right;
    font-size: 1.45rem;
    font-weight: 950;
    font-variant-numeric: tabular-nums;
}

.leader-record {
    text-align: right;
    color: var(--muted);
}

.final-seeds {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 12px;
    margin-top: 20px;
}

.final-seed {
    --player: #7c8aa6;
    padding: 18px;
    border-radius: 16px;
    background:
        linear-gradient(
            155deg,
            color-mix(in srgb, var(--player) 14%, transparent),
            rgba(255,255,255,.045)
        );
    border-top: 5px solid var(--player);
}

.final-seed .seed-num {
    color: var(--muted);
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .1em;
}

.final-seed .seed-name {
    margin-top: 5px;
    font-size: 1.2rem;
    font-weight: 900;
}

.final-seed .seed-budget {
    margin-top: 8px;
    font-size: 1.5rem;
    font-weight: 950;
}

.bracket-history {
    display: grid;
    gap: 8px;
    margin-top: 18px;
}

.bracket-row {
    display: grid;
    grid-template-columns: 90px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 12px 14px;
    border-radius: 10px;
    background: rgba(255,255,255,.045);
}

.bracket-row .winner {
    font-weight: 900;
}

.champion-scene {
    height: 100%;
    display: grid;
    place-items: center;
    text-align: center;
}

.champion-card {
    --player: #7c8aa6;
    width: min(900px, 86%);
    padding: 48px;
    border-radius: 26px;
    background:
        radial-gradient(
            circle at top,
            color-mix(in srgb, var(--player) 30%, transparent),
            transparent 55%
        ),
        rgba(255,255,255,.055);
    border: 2px solid
        color-mix(
            in srgb,
            var(--player) 70%,
            white 12%
        );
    animation: championPulse 2.6s ease-in-out infinite;
}

.champion-card .crown {
    font-size: 4rem;
}

.champion-card .champ-name {
    margin-top: 12px;
    font-size: clamp(3rem, 7vw, 7rem);
    font-weight: 1000;
    line-height: .9;
}

.champion-card .champ-label {
    margin-top: 16px;
    letter-spacing: .16em;
    color: var(--muted);
    text-transform: uppercase;
    font-weight: 900;
}

@keyframes championPulse {
    50% {
        box-shadow:
            0 0 70px
            color-mix(
                in srgb,
                var(--player) 28%,
                transparent
            );
    }
}

/* Payout overlay */
.payout-overlay {
    position: absolute;
    inset: 0;
    z-index: 70;
    display: grid;
    place-items: center;
    padding: 34px;
    opacity: 0;
    pointer-events: none;
    background:
        radial-gradient(
            circle at center,
            rgba(47,64,100,.36),
            rgba(7,9,14,.96) 62%
        );
    transition: opacity 250ms ease;
}

.payout-overlay.active {
    opacity: 1;
}

.payout-board {
    width: min(1320px, 96%);
}

.payout-heading {
    text-align: center;
}

.payout-heading h2 {
    margin: 0;
    font-size: 3.4rem;
}

.payout-heading p {
    margin: 6px 0 0;
    color: var(--muted);
}

.payout-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 12px;
    margin-top: 20px;
}

.payout-player {
    --player: #7c8aa6;
    position: relative;
    min-height: 142px;
    padding: 16px;
    border-radius: 14px;
    background: rgba(255,255,255,.055);
    border-top: 5px solid var(--player);
    overflow: hidden;
}

.payout-player .p-name {
    font-weight: 900;
}

.payout-player .p-delta {
    margin-top: 8px;
    font-size: 1.8rem;
    font-weight: 1000;
}

.payout-player .p-total {
    margin-top: 3px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
}

.payout-player.positive {
    animation: payoutWin .8s ease both;
}

.payout-player.negative {
    animation: payoutLoss .8s ease both;
}

.payout-player.positive::after {
    content: "";
    position: absolute;
    left: 12%;
    right: 12%;
    bottom: -16px;
    height: 30px;
    border-radius: 50%;
    background: var(--player);
    opacity: .3;
    filter: blur(13px);
    animation: energySurge 1.2s ease infinite;
}

@keyframes payoutWin {
    from {
        transform: scale(.92);
        opacity: .4;
    }
    55% {
        transform: scale(1.035);
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

@keyframes payoutLoss {
    from {
        transform: translateY(-4px);
    }
    50% {
        transform: translateY(2px);
        opacity: .64;
    }
    to {
        transform: translateY(0);
    }
}

@keyframes energySurge {
    50% {
        opacity: .75;
        transform: scaleX(1.15);
    }
}

.winner-banner {
    position: absolute;
    inset: 0;
    z-index: 40;
    display: grid;
    place-items: center;
    pointer-events: none;
}

.winner-banner-inner {
    --player: #7c8aa6;
    padding: 28px 54px;
    border-radius: 20px;
    text-align: center;
    background:
        linear-gradient(
            150deg,
            color-mix(in srgb, var(--player) 26%, #111722),
            #111722
        );
    border: 2px solid
        color-mix(
            in srgb,
            var(--player) 70%,
            white 8%
        );
    box-shadow:
        0 20px 90px rgba(0,0,0,.6);
    animation: winnerIn 420ms cubic-bezier(.2,.9,.2,1);
}

.winner-banner-inner small {
    display: block;
    color: var(--muted);
    letter-spacing: .18em;
    font-weight: 900;
}

.winner-banner-inner strong {
    display: block;
    margin-top: 5px;
    font-size: 4rem;
}

@keyframes winnerIn {
    from {
        transform: scale(.65);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

@media (max-aspect-ratio: 4/3) {
    .cast-grid,
    .payout-grid {
        grid-template-columns: repeat(2, minmax(0,1fr));
    }

    .final-seeds {
        grid-template-columns: repeat(2, minmax(0,1fr));
    }
}

/* =========================================================
   DRAFT MICRO-ANIMATIONS
   ========================================================= */

.draft-hero.draft-switch-out {
    animation:
        draftSpotOut 180ms
        cubic-bezier(.4,0,1,1)
        both;
}

.draft-hero.draft-switch-in {
    animation:
        draftSpotIn 340ms
        cubic-bezier(.16,.84,.28,1)
        both;
}

@keyframes draftSpotOut {
    from {
        opacity: 1;
        transform: translateX(0) scale(1);
    }

    to {
        opacity: 0;
        transform: translateX(-16px) scale(.985);
    }
}

@keyframes draftSpotIn {
    from {
        opacity: 0;
        transform: translateX(18px) scale(.985);
    }

    to {
        opacity: 1;
        transform: translateX(0) scale(1);
    }
}

.draft-roster-card.draft-slot-land {
    animation:
        draftSlotLand 300ms
        cubic-bezier(.18,.88,.3,1)
        both;
}

@keyframes draftSlotLand {
    0% {
        transform: scale(.88);
        opacity: .55;
    }

    55% {
        transform: scale(1.055);
        opacity: 1;
        box-shadow:
            0 0 24px
            color-mix(
                in srgb,
                var(--draft-land-color, white) 38%,
                transparent
            );
    }

    100% {
        transform: scale(1);
        opacity: 1;
        box-shadow: none;
    }
}

.draft-flight-card {
    position: fixed !important;
    z-index: 5000 !important;
    margin: 0 !important;
    pointer-events: none !important;
    transform-origin: center center;
    overflow: hidden;
    opacity: 1 !important;
    background:
        linear-gradient(
            145deg,
            color-mix(
                in srgb,
                var(--flight-player, white) 12%,
                #303746
            ),
            #202633 72%
        ) !important;
    box-shadow:
        0 18px 46px rgba(0,0,0,.66),
        0 0 0 1px rgba(255,255,255,.11),
        0 0 30px
        color-mix(
            in srgb,
            var(--flight-player, white) 42%,
            transparent
        );
    border:
        2px solid
        color-mix(
            in srgb,
            var(--flight-player, white) 68%,
            rgba(255,255,255,.16)
        ) !important;
}

.draft-flight-card .market-tile-name,
.draft-flight-card .market-tile-cost {
    color: #fff !important;
    opacity: 1 !important;
    text-shadow:
        0 1px 2px rgba(0,0,0,.9);
}

.market-tile.draft-source-lifting {
    opacity: .48;
    transform: scale(.94);
    transition:
        opacity 140ms ease,
        transform 140ms ease;
}

.draft-order-strip {
    position: relative;
}

.draft-order-glider {
    position: absolute;
    z-index: 0;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    opacity: 0;
    border-radius: 14px;
    pointer-events: none;
    background:
        linear-gradient(
            155deg,
            color-mix(
                in srgb,
                var(--glider-color, white) 22%,
                transparent
            ),
            rgba(255,255,255,.035)
        );
    border:
        2px solid
        color-mix(
            in srgb,
            var(--glider-color, white) 64%,
            white 4%
        );
    box-shadow:
        0 0 30px
        color-mix(
            in srgb,
            var(--glider-color, white) 30%,
            transparent
        );
    transition:
        left 480ms cubic-bezier(.2,.82,.2,1),
        top 480ms cubic-bezier(.2,.82,.2,1),
        width 480ms cubic-bezier(.2,.82,.2,1),
        height 480ms cubic-bezier(.2,.82,.2,1),
        opacity 160ms ease;
}

.draft-order-card {
    position: relative;
    z-index: 1;
}

.draft-order-card.current {
    transition:
        background 280ms ease,
        border-color 280ms ease,
        box-shadow 280ms ease,
        transform 280ms ease;
}

.draft-order-card.current.just-activated {
    transform: translateY(-4px);
}

.draft-order-card.current.direction-pulse {
    overflow: hidden;
}

.draft-order-card.current.direction-pulse::after {
    content: "";
    position: absolute;
    z-index: 0;
    top: -30%;
    bottom: -30%;
    width: 78%;
    opacity: 0;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse at center,
            color-mix(
                in srgb,
                var(--player) 55%,
                transparent
            ) 0%,
            color-mix(
                in srgb,
                var(--player) 22%,
                transparent
            ) 42%,
            transparent 72%
        );
    filter: blur(2px);
}

.draft-order-card.current.pulse-from-left::after {
    left: -42%;
    animation:
        draftPulseFromLeft 720ms
        cubic-bezier(.16,.82,.22,1)
        both;
}

.draft-order-card.current.pulse-from-right::after {
    right: -42%;
    animation:
        draftPulseFromRight 720ms
        cubic-bezier(.16,.82,.22,1)
        both;
}

.draft-order-card.current.direction-pulse > * {
    position: relative;
    z-index: 1;
}

@keyframes draftPulseFromLeft {
    0% {
        opacity: 0;
        transform: translateX(-10%) scaleX(.55);
    }

    28% {
        opacity: .95;
    }

    72% {
        opacity: .48;
    }

    100% {
        opacity: 0;
        transform: translateX(115%) scaleX(1.2);
    }
}

@keyframes draftPulseFromRight {
    0% {
        opacity: 0;
        transform: translateX(10%) scaleX(.55);
    }

    28% {
        opacity: .95;
    }

    72% {
        opacity: .48;
    }

    100% {
        opacity: 0;
        transform: translateX(-115%) scaleX(1.2);
    }
}


/* =========================================================
   LOBBY PLAYER JOIN REVEAL
   ========================================================= */

.player-card.lobby-join-card {
    --join-delay: 0ms;
    animation:
        lobbyCardArrive 820ms
        cubic-bezier(.16,.86,.25,1)
        var(--join-delay)
        both;
}

.player-card.lobby-join-card::before {
    animation:
        lobbyColorBarPop 760ms
        cubic-bezier(.18,.86,.28,1)
        var(--join-delay)
        both;
}

.player-card.lobby-join-card::after {
    content: "";
    position: absolute;
    z-index: 0;
    top: -60%;
    bottom: -60%;
    left: -35%;
    width: 42%;
    opacity: 0;
    pointer-events: none;
    transform: rotate(12deg);
    background:
        linear-gradient(
            90deg,
            transparent,
            color-mix(
                in srgb,
                var(--player) 58%,
                rgba(255,255,255,.34)
            ),
            transparent
        );
    filter: blur(3px);
    animation:
        lobbyJoinSweep 780ms
        cubic-bezier(.18,.82,.28,1)
        calc(var(--join-delay) + 70ms)
        both;
}

.player-card.lobby-join-card > * {
    position: relative;
    z-index: 1;
}

.join-badge {
    position: absolute !important;
    z-index: 3 !important;
    right: 12px;
    top: 10px;
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--player);
    color: #0a0d13;
    font-size: .62rem;
    line-height: 1;
    letter-spacing: .11em;
    font-weight: 1000;
    opacity: 0;
    transform: translateY(-6px) scale(.88);
    animation:
        lobbyJoinBadge 1300ms
        cubic-bezier(.16,.84,.24,1)
        calc(var(--join-delay) + 180ms)
        both;
}

@keyframes lobbyCardArrive {
    0% {
        opacity: 0;
        transform:
            translateY(22px)
            scale(.90);
        box-shadow:
            0 0 0
            rgba(0,0,0,0);
    }

    48% {
        opacity: 1;
        transform:
            translateY(-4px)
            scale(1.025);
        box-shadow:
            0 0 38px
            color-mix(
                in srgb,
                var(--player) 34%,
                transparent
            );
    }

    72% {
        transform:
            translateY(1px)
            scale(.995);
    }

    100% {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
        box-shadow:
            0 0 0
            rgba(0,0,0,0);
    }
}

@keyframes lobbyColorBarPop {
    0% {
        transform: scaleY(.05);
        transform-origin: center;
        filter: brightness(1.8);
    }

    58% {
        transform: scaleY(1.08);
        filter: brightness(1.7);
    }

    100% {
        transform: scaleY(1);
        filter: brightness(1);
    }
}

@keyframes lobbyJoinSweep {
    0% {
        opacity: 0;
        transform:
            translateX(0)
            rotate(12deg);
    }

    22% {
        opacity: .8;
    }

    100% {
        opacity: 0;
        transform:
            translateX(360%)
            rotate(12deg);
    }
}

@keyframes lobbyJoinBadge {
    0% {
        opacity: 0;
        transform:
            translateY(-6px)
            scale(.88);
    }

    18% {
        opacity: 1;
        transform:
            translateY(0)
            scale(1.08);
    }

    32% {
        transform:
            translateY(0)
            scale(1);
    }

    72% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform:
            translateY(-3px)
            scale(.96);
    }
}

.order-reveal-strip {

.order-reveal-type {

.order-reveal-strip.order-locked {

.draft-order-flyer .order-reveal-rank {

.order-reveal-locked-label {

        border-color:
            rgba(255,255,255,.20);
        box-shadow:
            0 8px 22px

    100% {

        transform:
            translateY(0)
            scale(1);
        border-color:
            rgba(255,255,255,.08);
        box-shadow:
            none;

   while keeping the same card styling used elsewhere.
*/
.draft-complete-audience .audience-mini-leaders {
    gap: 7px;
}

.draft-complete-audience .audience-leader-row {
    padding-top: 9px;
    padding-bottom: 9px;
}

@media (max-width: 1320px) {
    .draft-complete-scene {
        grid-template-columns:
            minmax(0, 1.6fr)
            minmax(280px, .9fr);
        column-gap: 16px;
    }
}


/* =========================================================
   DRAFT COMPLETE — FULL-WIDTH PLAYERS + BOTTOM AUDIENCE BAND
   ========================================================= */

.draft-complete-scene.draft-complete-bottom-layout {
    height: 100%;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows:
        auto
        minmax(0,1fr)
        auto;
    gap: 14px;
}

.draft-complete-bottom-layout .draft-complete-heading {
    grid-column: 1;
    grid-row: 1;
    min-width: 0;
}

.draft-complete-bottom-layout .draft-complete-standings {
    grid-column: 1;
    grid-row: 2;
    min-width: 0;
    min-height: 0;
}

/* Full-width standings, slightly tightened so the lower band has
   a reliable home directly above the footer. */
.draft-complete-bottom-layout
.draft-complete-standings
.leaderboard {
    margin-top: 8px;
    gap: 6px;
}

.draft-complete-bottom-layout
.draft-complete-standings
.leader-row {
    min-height: 44px;
    padding: 6px 14px;
    grid-template-columns:
        60px
        minmax(0,1fr)
        150px
        110px;
}

.draft-complete-bottom-layout
.draft-complete-standings
.leader-rank {
    font-size: 1.25rem;
}

.draft-complete-bottom-layout
.draft-complete-standings
.leader-name {
    font-size: 1rem;
}

.draft-complete-bottom-layout
.draft-complete-standings
.leader-money {
    font-size: 1.25rem;
}

/* Entire Audience section is the final scene row, so it always lives
   immediately above the Broadcast footer. */
.draft-complete-bottom-band {
    grid-column: 1;
    grid-row: 3;
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-columns:
        minmax(0,1fr)
        300px;
    gap: 18px;
    align-items: stretch;
}

.draft-complete-audience-panel {
    position: relative;
    min-width: 0;
    min-height: 0;
    padding: 14px 16px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.11);
    background: rgba(20,25,36,.90);
    box-shadow: 0 18px 40px rgba(0,0,0,.18);
    overflow: hidden;
}

.draft-complete-audience-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
}

.draft-complete-audience-row {
    display: grid;
    grid-template-columns:
        repeat(8, minmax(0,1fr));
    gap: 7px;
    margin-top: 10px;
}

.draft-complete-audience-card {
    min-width: 0;
    padding: 9px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.08);
}

.draft-complete-audience-rank {
    color: #f2c94c;
    font-size: .73rem;
    font-weight: 950;
}

.draft-complete-audience-name {
    margin-top: 4px;
    min-width: 0;
    font-size: .80rem;
    font-weight: 850;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.draft-complete-audience-money {
    margin-top: 4px;
    color: #fff;
    font-size: .76rem;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
}

.draft-complete-audience-foot {
    margin-top: 8px;
    color: var(--muted);
    font-size: .68rem;
    text-align: right;
}

/* Reuse the Lobby QR card exactly, now as the right-hand block
   in the lower-third band. */
.draft-complete-bottom-band .lobby-qr-panel {
    width: 300px;
    max-width: 300px;
    justify-self: end;
    align-self: stretch;
}

@media (max-width: 1500px) {
    .draft-complete-audience-row {
        grid-template-columns:
            repeat(4, minmax(0,1fr));
    }

    .draft-complete-audience-card {
        padding: 7px 9px;
    }

    .draft-complete-bottom-band {
        grid-template-columns:
            minmax(0,1fr)
            280px;
    }

    .draft-complete-bottom-band .lobby-qr-panel {
        width: 280px;
        max-width: 280px;
    }
}


/* =========================================================
   SHOP — LIVE WAR CHESTS + SHARED SKILL TREE
   ========================================================= */

.shop-scene {
    height: 100%;
    min-height: 0;
    display: grid;
    grid-template-columns:
        minmax(330px, 26%)
        minmax(0,1fr);
    gap: 18px;
}

.shop-player-rail,
.shop-tree-stage {
    min-height: 0;
}

.shop-player-rail {
    display: grid;
    grid-template-rows:
        auto
        minmax(0,1fr);
    gap: 12px;
}

.shop-player-rail-head {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 12px;
}

.shop-player-rail-head .scene-kicker {
    margin: 0;
}

.shop-rail-title {
    font-size: 1.05rem;
    font-weight: 950;
    letter-spacing: .04em;
    text-transform: uppercase;
}

.shop-player-list {
    min-height: 0;
    display: grid;
    grid-template-rows:
        repeat(
            8,
            minmax(0,1fr)
        );
    gap: 8px;
}

.shop-player-bar {
    --player: #7c8aa6;
    position: relative;
    z-index: 1;
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-columns:
        42px
        minmax(0,1fr)
        auto;
    gap: 10px;
    align-items: center;
    padding: 9px 11px 9px 13px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.10);
    background:
        linear-gradient(
            110deg,
            color-mix(
                in srgb,
                var(--player) 9%,
                transparent
            ),
            rgba(255,255,255,.035) 48%
        );
    overflow: hidden;
}

.shop-player-bar::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 4px;
    background: var(--player);
}

.shop-player-bar.shop-player-purchase {
    animation:
        shopPlayerPurchaseGlow
        1050ms
        cubic-bezier(.16,.82,.24,1)
        both;
}

@keyframes shopPlayerPurchaseGlow {
    0% {
        border-color:
            rgba(255,255,255,.10);
        box-shadow:
            0 0 0
            rgba(0,0,0,0);
    }

    35% {
        border-color:
            color-mix(
                in srgb,
                var(--player) 78%,
                white 12%
            );
        box-shadow:
            0 0 25px
            color-mix(
                in srgb,
                var(--player) 32%,
                transparent
            );
    }

    100% {
        border-color:
            rgba(255,255,255,.10);
        box-shadow:
            0 0 0
            rgba(0,0,0,0);
    }
}

.shop-rank {
    font-size: 1.08rem;
    font-weight: 1000;
    font-variant-numeric: tabular-nums;
}

.shop-player-main {
    min-width: 0;
}

.shop-player-name {
    font-size: .92rem;
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.shop-player-meta {
    min-width: 0;
    margin-top: 5px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: .67rem;
    font-weight: 750;
}

.shop-item-slots {
    display: flex;
    align-items: center;
    gap: 4px;
}

.shop-item-slot {
    width: 36px;
    height: 20px;
    display: grid;
    place-items: center;
    border-radius: 6px;
    border: 1px dashed rgba(255,255,255,.15);
    color: rgba(255,255,255,.24);
    font-size: .51rem;
    font-weight: 950;
    line-height: 1;
}

.shop-item-slot.filled {
    border-style: solid;
    border-color:
        color-mix(
            in srgb,
            var(--player) 48%,
            rgba(255,255,255,.18)
        );
    background:
        color-mix(
            in srgb,
            var(--player) 16%,
            rgba(255,255,255,.04)
        );
    color: #fff;
}

.shop-item-slot.shop-item-new {
    animation:
        shopItemPop
        680ms
        cubic-bezier(.16,.84,.24,1)
        both;
}

@keyframes shopItemPop {
    0% {
        opacity: 0;
        transform:
            scale(.65)
            translateY(4px);
    }

    55% {
        opacity: 1;
        transform:
            scale(1.15)
            translateY(-1px);
        box-shadow:
            0 0 14px
            color-mix(
                in srgb,
                var(--player) 45%,
                transparent
            );
    }

    100% {
        opacity: 1;
        transform:
            scale(1)
            translateY(0);
        box-shadow:
            none;
    }
}

.shop-money-value {
    color: #fff;
    font-size: 1.02rem;
    font-weight: 1000;
    font-variant-numeric: tabular-nums;
    text-align: right;
}

.shop-tree-stage {
    display: grid;
    grid-template-rows:
        auto
        minmax(0,1fr)
        auto;
    gap: 12px;
}

.shop-tree-header {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 20px;
}

.shop-tree-header .scene-kicker {
    margin-bottom: 4px;
}

.shop-tree-title {
    margin: 0;
    font-size: 2.1rem;
    line-height: .95;
    letter-spacing: -.035em;
}

.shop-tree-legend {
    max-width: 360px;
    padding: 9px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.09);
    background: rgba(255,255,255,.035);
    text-align: right;
}

.shop-tree-legend strong {
    display: block;
    font-size: .78rem;
    letter-spacing: .04em;
}

.shop-tree-legend span {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: .65rem;
}

.shop-skill-tree {
    min-height: 0;
    display: grid;
    grid-template-columns:
        repeat(
            5,
            minmax(0,1fr)
        );
    gap: 10px;
}

.shop-skill-branch {
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-rows:
        auto
        minmax(0,1fr);
    padding: 10px;
    border-radius: 17px;
    border: 1px solid rgba(255,255,255,.09);
    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.04),
            rgba(255,255,255,.018)
        );
}

.shop-branch-head {
    min-height: 48px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 2px 8px;
    border-bottom: 1px solid rgba(255,255,255,.07);
}

.shop-branch-icon {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.11);
    background: rgba(255,255,255,.045);
    font-size: 1.05rem;
    font-weight: 1000;
}

.shop-branch-name {
    font-size: .84rem;
    font-weight: 950;
    letter-spacing: .02em;
}

.shop-branch-note {
    margin-top: 2px;
    color: #f2c94c;
    font-size: .53rem;
    font-weight: 900;
    letter-spacing: .10em;
}

.shop-branch-path {
    position: relative;
    min-height: 0;
    display: grid;
    grid-template-rows:
        repeat(
            4,
            minmax(0,1fr)
        );
    gap: 7px;
    padding-top: 8px;
}

.shop-branch-path::before {
    content: none;
}

.shop-skill-node {
    position: relative;
    will-change:
        transform,
        box-shadow;
    z-index: 1;
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-rows:
        auto
        minmax(0,1fr)
        auto;
    gap: 5px;
    padding: 8px 8px 7px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.085);
    background: rgba(11,15,23,.90);
    overflow: hidden;
}

.shop-skill-node::before {
    content: none;
}

.shop-skill-anchor {
    --unlock-color: rgba(255,255,255,.7);
    will-change:
        transform,
        opacity,
        filter,
        box-shadow;
    position: absolute;
    left: 10px;
    top: 50%;
    width: 10px;
    height: 10px;
    transform: translate(-50%,-50%);
    border-radius: 999px;
    border: 2px solid rgba(255,255,255,.24);
    background: #111722;
    box-shadow: 0 0 0 rgba(0,0,0,0);
}

.shop-skill-node.owned .shop-skill-anchor {
    border-color: rgba(255,255,255,.34);
}

.shop-skill-anchor.shop-anchor-activate {
    animation:
        shopAnchorActivate
        720ms
        cubic-bezier(.33,.02,.24,1)
        both;
}

@keyframes shopAnchorActivate {
    0% {
        transform:
            translate(-50%,-50%)
            scale(.96);
        background: #111722;
        border-color:
            rgba(255,255,255,.24);
        box-shadow:
            0 0 0
            rgba(0,0,0,0);
        opacity: .92;
        filter: brightness(1);
    }

    18% {
        transform:
            translate(-50%,-50%)
            scale(1.08);
        background:
            color-mix(
                in srgb,
                var(--unlock-color) 34%,
                #111722
            );
        border-color:
            color-mix(
                in srgb,
                var(--unlock-color) 45%,
                rgba(255,255,255,.30)
            );
        box-shadow:
            0 0 8px
            color-mix(
                in srgb,
                var(--unlock-color) 22%,
                transparent
            );
        opacity: 1;
        filter: brightness(1.08);
    }

    46% {
        transform:
            translate(-50%,-50%)
            scale(1.48);
        background:
            color-mix(
                in srgb,
                var(--unlock-color) 96%,
                white 2%
            );
        border-color:
            color-mix(
                in srgb,
                var(--unlock-color) 86%,
                white 10%
            );
        box-shadow:
            0 0 0 5px
            color-mix(
                in srgb,
                var(--unlock-color) 20%,
                transparent
            ),
            0 0 19px
            color-mix(
                in srgb,
                var(--unlock-color) 54%,
                transparent
            );
        opacity: 1;
        filter: brightness(1.18);
    }

    72% {
        transform:
            translate(-50%,-50%)
            scale(1.16);
        background:
            color-mix(
                in srgb,
                var(--unlock-color) 42%,
                #111722
            );
        border-color:
            color-mix(
                in srgb,
                var(--unlock-color) 38%,
                rgba(255,255,255,.28)
            );
        box-shadow:
            0 0 10px
            color-mix(
                in srgb,
                var(--unlock-color) 22%,
                transparent
            );
        opacity: .9;
        filter: brightness(1.08);
    }

    100% {
        transform:
            translate(-50%,-50%)
            scale(1);
        background: #111722;
        border-color:
            rgba(255,255,255,.28);
        box-shadow:
            0 0 0
            rgba(0,0,0,0);
        opacity: 1;
        filter: brightness(1);
    }
}

.shop-skill-node.shop-node-unlock {
    animation:
        shopNodeUnlock
        760ms
        cubic-bezier(.32,.02,.26,1)
        both;
}

@keyframes shopNodeUnlock {
    0% {
        transform: scale(1);
        border-color:
            rgba(255,255,255,.15);
        box-shadow:
            0 0 0
            rgba(0,0,0,0);
    }

    45% {
        transform: scale(1.012);
        border-color:
            color-mix(
                in srgb,
                var(--unlock-color) 82%,
                white 8%
            );
        box-shadow:
            0 0 0 1px
            color-mix(
                in srgb,
                var(--unlock-color) 15%,
                transparent
            ),
            0 0 24px
            color-mix(
                in srgb,
                var(--unlock-color) 31%,
                transparent
            );
    }

    100% {
        transform: scale(1);
        border-color:
            rgba(255,255,255,.15);
        box-shadow:
            0 0 0
            rgba(0,0,0,0);
    }
}

.shop-skill-node::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    border-radius: inherit;
    background:
        color-mix(
            in srgb,
            var(--unlock-color, transparent) 24%,
            transparent
        );
    opacity: 0;
    will-change:
        opacity,
        filter;
}

.shop-skill-node.shop-node-unlock::after {
    animation:
        shopNodeColorWash
        760ms
        cubic-bezier(.32,.02,.26,1)
        both;
}

@keyframes shopNodeColorWash {
    0% {
        opacity: 0;
        filter:
            saturate(.9)
            brightness(1);
    }

    42% {
        opacity: .82;
        filter:
            saturate(1.12)
            brightness(1.08);
    }

    100% {
        opacity: 0;
        filter:
            saturate(1)
            brightness(1);
    }
}

.shop-skill-node-head,
.shop-skill-copy,
.shop-owner-rail {
    position: relative;
    z-index: 1;
}

.shop-skill-anchor {
    z-index: 2;
}

.shop-skill-streak {
    --streak: #ffffff;
    will-change:
        transform,
        opacity,
        filter;
    position: fixed;
    z-index: 120;
    height: 4px;
    pointer-events: none;
    border-radius: 999px;
    transform-origin: left center;
    background:
        linear-gradient(
            90deg,
            color-mix(
                in srgb,
                var(--streak) 0%,
                transparent
            ) 0%,
            color-mix(
                in srgb,
                var(--streak) 88%,
                white 8%
            ) 35%,
            color-mix(
                in srgb,
                var(--streak) 0%,
                transparent
            ) 100%
        );
    box-shadow:
        0 0 12px
        color-mix(
            in srgb,
            var(--streak) 48%,
            transparent
        );
}

.shop-skill-streak::after {
    content: "";
    position: absolute;
    right: -2px;
    top: 50%;
    width: 10px;
    height: 10px;
    transform: translateY(-50%);
    border-radius: 999px;
    background:
        color-mix(
            in srgb,
            var(--streak) 85%,
            white 10%
        );
    box-shadow:
        0 0 12px
        color-mix(
            in srgb,
            var(--streak) 60%,
            transparent
        );
}

.shop-skill-node.owned {
    border-color: rgba(255,255,255,.15);
    background:
        linear-gradient(
            130deg,
            rgba(255,255,255,.06),
            rgba(11,15,23,.90) 48%
        );
}

.shop-skill-node.capstone {
    border-width: 2px;
}

.shop-skill-node.mastery {
    background:
        linear-gradient(
            130deg,
            rgba(242,201,76,.075),
            rgba(11,15,23,.90) 55%
        );
}

.shop-skill-node.shop-skill-new {
    animation:
        shopSkillNodePulse
        800ms
        cubic-bezier(.16,.84,.24,1)
        both;
}

@keyframes shopSkillNodePulse {
    0% {
        transform: scale(.97);
        box-shadow:
            0 0 0
            rgba(255,255,255,0);
    }

    45% {
        transform: scale(1.025);
        border-color:
            rgba(255,255,255,.32);
        box-shadow:
            0 0 20px
            rgba(255,255,255,.11);
    }

    100% {
        transform: scale(1);
    }
}

.shop-skill-node-head {
    min-width: 0;
    display: flex;
    align-items: start;
    justify-content: space-between;
    gap: 6px;
    padding-left: 8px;
}

.shop-skill-name {
    min-width: 0;
    font-size: .72rem;
    font-weight: 950;
    line-height: 1.1;
}

.shop-skill-cost {
    flex: 0 0 auto;
    padding: 3px 5px;
    border-radius: 999px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);
    color: #fff;
    font-size: .52rem;
    font-weight: 950;
    line-height: 1;
}

.shop-skill-node.capstone
.shop-skill-cost {
    color: #f2c94c;
}

.shop-skill-node.mastery
.shop-skill-cost {
    background: rgba(242,201,76,.10);
    border-color: rgba(242,201,76,.20);
    color: #f7dd76;
}

.shop-skill-copy {
    min-width: 0;
    padding-left: 8px;
    color: var(--muted);
    font-size: .57rem;
    line-height: 1.22;
    overflow: hidden;
}

.shop-owner-rail {
    min-height: 14px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding-left: 8px;
}

.shop-owner-dot {
    --owner: #7c8aa6;
    will-change:
        transform,
        opacity,
        filter;
    width: 9px;
    height: 9px;
    flex: 0 0 auto;
    border-radius: 999px;
    background: var(--owner);
    border: 1px solid rgba(255,255,255,.40);
    box-shadow:
        0 0 7px
        color-mix(
            in srgb,
            var(--owner) 55%,
            transparent
        );
}

.shop-owner-dot.shop-owner-pending {
    opacity: 0;
    transform: scale(.18);
    box-shadow: none;
}

.shop-owner-dot.shop-owner-new {
    animation:
        shopOwnerFadeIn
        460ms
        cubic-bezier(.25,.04,.24,1)
        both;
}

@keyframes shopOwnerFadeIn {
    0% {
        opacity: 0;
        transform: scale(.72);
        box-shadow:
            0 0 0
            rgba(0,0,0,0);
        filter:
            saturate(.82)
            brightness(.92);
    }

    34% {
        opacity: .36;
        transform: scale(.84);
        box-shadow:
            0 0 3px
            color-mix(
                in srgb,
                var(--owner) 16%,
                transparent
            );
        filter:
            saturate(.9)
            brightness(.96);
    }

/* =========================================================

@keyframes armyBuildTierOuterPulse {

/* =========================================================
   ARMY BUILD — AUTHORITATIVE PERSISTENT COLOR
   ========================================================= */

/*
   The inline opacity written by renderArmyBuildRow() is the source of
   truth after every 900ms Broadcast redraw.

   0% capacity  -> opacity 0
   100% capacity -> opacity 1

   Because the layer itself is the player's actual color, 100% capacity
   is literally the full player color.
*/
.army-build-tier-fill {
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    background: var(--player) !important;
    transition:
        opacity 680ms
        cubic-bezier(.20,.72,.24,1);
}

/*
   Keep the persistent inset tint deliberately subtle. The large visible
   capacity signal should come from the full player-color layer above,
   not from a washed-out glow.
*/
.army-build-tier-card::after {
    opacity:
        calc(
            var(--build-glow)
            * .48
        );
}
