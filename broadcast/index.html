<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Broadcast | TABS War Chest Betting Special
</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #090c13;
    --panel: rgba(27,32,45,.92);
    --panel-soft: rgba(255,255,255,.055);
    --line: rgba(255,255,255,.12);
    --text: #f7f8fb;
    --muted: rgba(247,248,251,.62);
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    background:
        radial-gradient(
            circle at 50% -15%,
            rgba(86,105,150,.26),
            transparent 38%
        ),
        linear-gradient(
            180deg,
            #111724,
            #080b11 72%
        );
}

button,
input {
    font: inherit;
}

.hidden {
    display: none !important;
}

#app {
    position: relative;
    width: 100%;
    height: 100%;
}

.setup-screen {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 40px;
    background: #0b0f18;
}

.setup-card {
    width: min(620px, 92vw);
    padding: 34px;
    border-radius: 22px;
    background: #1b2130;
    border: 1px solid var(--line);
    text-align: center;
}

.setup-card h1 {
    margin: 0 0 8px;
    font-size: 3rem;
}

.setup-card p {
    color: var(--muted);
}

.setup-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    margin-top: 24px;
}

.setup-row input {
    min-width: 0;
    padding: 15px 16px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #101521;
    color: white;
    text-transform: uppercase;
    letter-spacing: .12em;
}

.setup-row button {
    padding: 15px 20px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.25);
    background: #f3f4f7;
    color: #11151e;
    font-weight: 800;
    cursor: pointer;
}

.setup-message {
    min-height: 1.4em;
    margin-top: 12px;
    color: #ffb8b8;
}

.broadcast-shell {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: 86px minmax(0,1fr) 60px;
}

.show-header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 20px;
    padding: 16px 30px;
    border-bottom: 1px solid var(--line);
    background: rgba(8,11,17,.76);
}

.brand {
    display: flex;
    align-items: baseline;
    gap: 16px;
    min-width: 0;
}

.brand strong {
    font-size: 1.22rem;
    letter-spacing: .12em;
}

.brand span {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .13em;
    font-size: .72rem;
}

.phase-chip {
    padding: 9px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.055);
    text-transform: uppercase;
    letter-spacing: .1em;
    font-weight: 800;
    font-size: .75rem;
}

.stage {
    position: relative;
    min-height: 0;
    overflow: hidden;
    padding: 26px 30px;
}

.scene {
    position: absolute;
    inset: 26px 30px;
    opacity: 0;
    transform: translateY(18px) scale(.99);
    pointer-events: none;
    transition:
        opacity 360ms ease,
        transform 360ms ease;
}

.scene.active {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
}

.show-footer {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 18px;
    padding: 0 30px;
    border-top: 1px solid var(--line);
    background: rgba(8,11,17,.82);
    color: var(--muted);
    font-size: .78rem;
}

.show-footer strong {
    color: white;
}

.footer-status {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.scene-title {
    margin: 0;
    font-size: clamp(2.4rem, 4vw, 4.8rem);
    line-height: .98;
    letter-spacing: -.045em;
}

.scene-kicker {
    margin-bottom: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .15em;
    font-weight: 800;
    font-size: .76rem;
}

.scene-subtitle {
    margin-top: 14px;
    color: var(--muted);
    font-size: 1.1rem;
}

.cast-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 14px;
    margin-top: 24px;
}

.player-card {
    --player: #7c8aa6;
    position: relative;
    min-width: 0;
    padding: 18px;
    border-radius: 16px;
    background:
        linear-gradient(
            145deg,
            color-mix(in srgb, var(--player) 11%, transparent),
            rgba(255,255,255,.045) 48%
        );
    border: 1px solid rgba(255,255,255,.11);
    overflow: hidden;
}

.player-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 5px;
    background: var(--player);
}

.player-card .rank {
    color: var(--muted);
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .1em;
}

.player-card .name {
    margin-top: 5px;
    font-size: 1.25rem;
    font-weight: 850;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-card .money {
    margin-top: 10px;
    font-size: 1.75rem;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
}

.player-card .meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: .8rem;
}

.player-card.ready {
    border-color:
        color-mix(
            in srgb,
            var(--player) 65%,
            white 8%
        );
}

.player-card.ready::after {
    content: "READY";
    position: absolute;
    right: 10px;
    top: 10px;
    color: var(--player);
    font-size: .66rem;
    letter-spacing: .1em;
    font-weight: 900;
}

.hero-split {
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0,1fr) 130px minmax(0,1fr);
    align-items: stretch;
    gap: 18px;
}

.fighter-panel {
    --player: #7c8aa6;
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 24px;
    border-radius: 20px;
    background:
        linear-gradient(
            155deg,
            color-mix(in srgb, var(--player) 14%, transparent),
            rgba(255,255,255,.045)
        );
    border: 1px solid rgba(255,255,255,.12);
    box-shadow:
        inset 0 4px 0
        color-mix(in srgb, var(--player) 80%, transparent);
}

.fighter-panel .fighter-name {
    font-size: clamp(2rem, 3.3vw, 4.1rem);
    font-weight: 950;
    line-height: 1;
}

.fighter-panel .fighter-money {
    margin-top: 10px;
    color: var(--muted);
    font-size: 1rem;
}

.vs {
    display: grid;
    place-items: center;
    font-size: 2.2rem;
    font-weight: 1000;
    color: rgba(255,255,255,.35);
}

.army-zones {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 9px;
    margin-top: 18px;
    min-height: 0;
}

.army-zone {
    min-width: 0;
    padding: 12px;
    border-radius: 12px;
    background: rgba(0,0,0,.16);
    border: 1px solid rgba(255,255,255,.08);
}

.army-zone h4 {
    margin: 0 0 8px;
    color: var(--muted);
    font-size: .66rem;
    letter-spacing: .12em;
}

.army-unit {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 4px 0;
    font-size: .78rem;
}

.army-unit span:first-child {
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.army-total {
    margin-top: auto;
    padding-top: 14px;
    font-size: 1.25rem;
    font-weight: 900;
}

.pool-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 14px;
    margin-top: 20px;
}

.pool-card {
    --p1: #7c8aa6;
    --p2: #7c8aa6;
    padding: 18px;
    border-radius: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
}

.pool-card.current {
    outline: 2px solid rgba(255,255,255,.26);
}

.pool-title {
    color: var(--muted);
    font-size: .72rem;
    letter-spacing: .1em;
    text-transform: uppercase;
}

.pool-sides {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 10px;
}

.pool-side {
    padding: 12px;
    border-radius: 10px;
    background: rgba(255,255,255,.045);
}

.pool-side.one {
    border-top: 4px solid var(--p1);
}

.pool-side.two {
    border-top: 4px solid var(--p2);
}

.pool-side .pool-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 800;
}

.pool-side .pool-money {
    margin-top: 5px;
    font-size: 1.4rem;
    font-weight: 900;
}

.draft-scene {
    height: 100%;
    display: grid;
    grid-template-rows: minmax(0,1fr) 112px;
    gap: 16px;
}

.draft-layout {
    display: grid;
    grid-template-columns: 1.05fr 1.7fr;
    gap: 18px;
    min-height: 0;
}

.draft-left {
    display: grid;
    grid-template-rows: auto minmax(0,1fr) auto;
    gap: 14px;
    min-height: 0;
}

.draft-hero {
    --player: #7c8aa6;
    padding: 24px;
    border-radius: 20px;
    background:
        linear-gradient(
            155deg,
            color-mix(in srgb, var(--player) 17%, transparent),
            rgba(255,255,255,.045)
        );
    border: 1px solid var(--line);
    box-shadow:
        inset 0 4px 0
        color-mix(in srgb, var(--player) 85%, transparent);
}

.draft-hero .pick-num {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .16em;
    font-size: .72rem;
    font-weight: 900;
}

.draft-hero .on-clock {
    margin-top: 12px;
    font-size: clamp(2.7rem, 4.3vw, 4.9rem);
    line-height: .95;
    font-weight: 980;
}

.draft-hero .clock-sub {
    margin-top: 10px;
    color: rgba(255,255,255,.82);
    font-size: 1rem;
}

.draft-roster-panel {
    min-height: 0;
    padding: 16px;
    border-radius: 18px;
    background: rgba(11,16,25,.7);
    border: 1px solid rgba(255,255,255,.08);
}

.draft-panel-label {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .12em;
    font-size: .69rem;
    font-weight: 900;
    margin-bottom: 10px;
}

.draft-current-roster {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    grid-template-rows: repeat(2, minmax(0,1fr));
    gap: 8px;
    min-height: 0;
}

.draft-roster-card {
    min-width: 0;
    min-height: 0;
    padding: 9px 9px 8px;
    border-radius: 11px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.072),
            rgba(255,255,255,.032)
        );
    border: 1px solid rgba(255,255,255,.08);
    overflow: hidden;
}

.draft-roster-card.empty {
    display: grid;
    place-items: center;
    color: rgba(255,255,255,.20);
    border-style: dashed;
    background: rgba(255,255,255,.018);
    font-size: 1.15rem;
    font-weight: 900;
}

.draft-roster-tier {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 5px;
    border-radius: 999px;
    background: rgba(255,255,255,.08);
    color: var(--muted);
    font-size: .58rem;
    letter-spacing: .07em;
    font-weight: 850;
}

.draft-roster-name {
    margin-top: 6px;
    font-weight: 900;
    line-height: 1.05;
    font-size: .82rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.draft-roster-meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: .64rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.draft-aux-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.last-pick,
.next-up {
    padding: 14px 16px;
    border-radius: 14px;
    background: rgba(0,0,0,.16);
    border: 1px solid rgba(255,255,255,.07);
}

.last-pick strong,
.next-up strong {
    display: block;
    margin-top: 5px;
    font-size: 1.02rem;
}

.next-up-list {
    margin-top: 8px;
    display: grid;
    gap: 6px;
}

.next-up-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    color: rgba(255,255,255,.9);
    font-size: .85rem;
}

.draft-market {
    min-height: 0;
    display: grid;
    grid-template-rows: auto minmax(0,1fr);
    gap: 12px;
    padding: 18px;
    border-radius: 20px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.09);
    overflow: hidden;
}

.draft-market-head {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: baseline;
}

.draft-market-head h3 {
    margin: 0;
    font-size: 1.4rem;
}

.draft-market-head div {
    color: var(--muted);
    font-size: .85rem;
}

.market-board {
    --market-tile: clamp(44px, 2.72vw, 53px);
    min-height: 0;
    display: grid;
    align-content: start;
    gap: 8px;
    padding-top: 13px;
    overflow: hidden;
}

.market-band {
    --tier-color: #8b97ae;
    --cols: 18;
    position: relative;
    width: max-content;
    max-width: 100%;
    min-height: 0;
    padding: 8px;
    border: 3px solid var(--tier-color);
    border-radius: 13px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.012)
        );
    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.035);
}

.market-band-tab {
    position: absolute;
    z-index: 2;
    top: -3px;
    right: 10px;
    transform: translateY(-50%);
    min-width: 74px;
    padding: 5px 13px;
    border-radius: 8px;
    background: var(--tier-color);
    color: #0d1119;
    font-size: .72rem;
    line-height: 1;
    text-align: center;
    font-weight: 1000;
    letter-spacing: .08em;
    text-transform: uppercase;
    white-space: nowrap;
    box-shadow: 0 7px 16px rgba(0,0,0,.24);
}

.market-band-grid {
    min-height: 0;
    display: grid;
    grid-template-columns:
        repeat(
            var(--cols),
            var(--market-tile)
        );
    grid-auto-rows: var(--market-tile);
    gap: 5px;
}

.market-tile {
    min-width: 0;
    min-height: 0;
    aspect-ratio: 1 / 1;
    padding: 5px 4px 4px;
    border-radius: 7px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.105),
            rgba(255,255,255,.050)
        );
    border: 1px solid rgba(255,255,255,.085);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 3px;
    overflow: hidden;
}

.market-tile-name {
    font-size: .53rem;
    line-height: 1.02;
    font-weight: 900;
    color: rgba(255,255,255,.97);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-wrap: balance;
}

.market-tile-cost {
    align-self: flex-end;
    font-size: .50rem;
    color: rgba(255,255,255,.7);
    font-weight: 850;
    font-variant-numeric: tabular-nums;
}

.market-band-S { --tier-color: #FF4D5A; }
.market-band-A { --tier-color: #F2C94C; }
.market-band-B { --tier-color: #FF8A3D; }
.market-band-C { --tier-color: #3B82F6; }
.market-band-D { --tier-color: #8B5CF6; }

.draft-order-strip {
    display: grid;
    grid-template-columns: repeat(8, minmax(0,1fr));
    gap: 10px;
    align-items: stretch;
}

.draft-order-card {
    --player: #7c8aa6;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    border-top: 4px solid var(--player);
    transition:
        transform 220ms ease,
        box-shadow 220ms ease,
        background 220ms ease;
}

.draft-order-card.current {
    background:
        linear-gradient(
            155deg,
            color-mix(in srgb, var(--player) 20%, transparent),
            rgba(255,255,255,.07)
        );
    box-shadow:
        0 0 0 1px color-mix(in srgb, var(--player) 42%, transparent),
        0 10px 26px rgba(0,0,0,.24);
    transform: translateY(-4px);
}

.draft-order-card .order-label {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .12em;
    font-size: .62rem;
    font-weight: 900;
}

.draft-order-card .order-name {
    margin-top: 5px;
    font-size: .92rem;
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.draft-order-card .order-meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: .74rem;
}

@media (max-aspect-ratio: 16/10) {
    .draft-layout {
        grid-template-columns: 1fr 1.35fr;
    }
    .market-board {
        --market-tile: clamp(40px, 2.45vw, 48px);
    }
    .draft-order-strip {
        grid-template-columns: repeat(4, minmax(0,1fr));
    }
}

.leaderboard {
    display: grid;
    gap: 9px;
    margin-top: 20px;
}

.leader-row {
    --player: #7c8aa6;
    display: grid;
    grid-template-columns: 60px minmax(0,1fr) 140px 120px;
    align-items: center;
    gap: 14px;
    min-height: 58px;
    padding: 9px 16px;
    border-radius: 12px;
    background: rgba(255,255,255,.045);
    border-left: 5px solid var(--player);
    transition:
        transform 500ms ease,
        background 300ms ease;
}

.leader-rank {
    font-size: 1.45rem;
    font-weight: 950;
}

.leader-name {
    font-size: 1.05rem;
    font-weight: 850;
}

.leader-money {
    text-align: right;
    font-size: 1.45rem;
    font-weight: 950;
    font-variant-numeric: tabular-nums;
}

.leader-record {
    text-align: right;
    color: var(--muted);
}

.final-seeds {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 12px;
    margin-top: 20px;
}

.final-seed {
    --player: #7c8aa6;
    padding: 18px;
    border-radius: 16px;
    background:
        linear-gradient(
            155deg,
            color-mix(in srgb, var(--player) 14%, transparent),
            rgba(255,255,255,.045)
        );
    border-top: 5px solid var(--player);
}

.final-seed .seed-num {
    color: var(--muted);
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .1em;
}

.final-seed .seed-name {
    margin-top: 5px;
    font-size: 1.2rem;
    font-weight: 900;
}

.final-seed .seed-budget {
    margin-top: 8px;
    font-size: 1.5rem;
    font-weight: 950;
}

.bracket-history {
    display: grid;
    gap: 8px;
    margin-top: 18px;
}

.bracket-row {
    display: grid;
    grid-template-columns: 90px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 12px 14px;
    border-radius: 10px;
    background: rgba(255,255,255,.045);
}

.bracket-row .winner {
    font-weight: 900;
}

.champion-scene {
    height: 100%;
    display: grid;
    place-items: center;
    text-align: center;
}

.champion-card {
    --player: #7c8aa6;
    width: min(900px, 86%);
    padding: 48px;
    border-radius: 26px;
    background:
        radial-gradient(
            circle at top,
            color-mix(in srgb, var(--player) 30%, transparent),
            transparent 55%
        ),
        rgba(255,255,255,.055);
    border: 2px solid
        color-mix(
            in srgb,
            var(--player) 70%,
            white 12%
        );
    animation: championPulse 2.6s ease-in-out infinite;
}

.champion-card .crown {
    font-size: 4rem;
}

.champion-card .champ-name {
    margin-top: 12px;
    font-size: clamp(3rem, 7vw, 7rem);
    font-weight: 1000;
    line-height: .9;
}

.champion-card .champ-label {
    margin-top: 16px;
    letter-spacing: .16em;
    color: var(--muted);
    text-transform: uppercase;
    font-weight: 900;
}

@keyframes championPulse {
    50% {
        box-shadow:
            0 0 70px
            color-mix(
                in srgb,
                var(--player) 28%,
                transparent
            );
    }
}

/* Payout overlay */
.payout-overlay {
    position: absolute;
    inset: 0;
    z-index: 70;
    display: grid;
    place-items: center;
    padding: 34px;
    opacity: 0;
    pointer-events: none;
    background:
        radial-gradient(
            circle at center,
            rgba(47,64,100,.36),
            rgba(7,9,14,.96) 62%
        );
    transition: opacity 250ms ease;
}

.payout-overlay.active {
    opacity: 1;
}

.payout-board {
    width: min(1320px, 96%);
}

.payout-heading {
    text-align: center;
}

.payout-heading h2 {
    margin: 0;
    font-size: 3.4rem;
}

.payout-heading p {
    margin: 6px 0 0;
    color: var(--muted);
}

.payout-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 12px;
    margin-top: 20px;
}

.payout-player {
    --player: #7c8aa6;
    position: relative;
    min-height: 142px;
    padding: 16px;
    border-radius: 14px;
    background: rgba(255,255,255,.055);
    border-top: 5px solid var(--player);
    overflow: hidden;
}

.payout-player .p-name {
    font-weight: 900;
}

.payout-player .p-delta {
    margin-top: 8px;
    font-size: 1.8rem;
    font-weight: 1000;
}

.payout-player .p-total {
    margin-top: 3px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
}

.payout-player.positive {
    animation: payoutWin .8s ease both;
}

.payout-player.negative {
    animation: payoutLoss .8s ease both;
}

.payout-player.positive::after {
    content: "";
    position: absolute;
    left: 12%;
    right: 12%;
    bottom: -16px;
    height: 30px;
    border-radius: 50%;
    background: var(--player);
    opacity: .3;
    filter: blur(13px);
    animation: energySurge 1.2s ease infinite;
}

@keyframes payoutWin {
    from {
        transform: scale(.92);
        opacity: .4;
    }
    55% {
        transform: scale(1.035);
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

@keyframes payoutLoss {
    from {
        transform: translateY(-4px);
    }
    50% {
        transform: translateY(2px);
        opacity: .64;
    }
    to {
        transform: translateY(0);
    }
}

@keyframes energySurge {
    50% {
        opacity: .75;
        transform: scaleX(1.15);
    }
}

.winner-banner {
    position: absolute;
    inset: 0;
    z-index: 40;
    display: grid;
    place-items: center;
    pointer-events: none;
}

.winner-banner-inner {
    --player: #7c8aa6;
    padding: 28px 54px;
    border-radius: 20px;
    text-align: center;
    background:
        linear-gradient(
            150deg,
            color-mix(in srgb, var(--player) 26%, #111722),
            #111722
        );
    border: 2px solid
        color-mix(
            in srgb,
            var(--player) 70%,
            white 8%
        );
    box-shadow:
        0 20px 90px rgba(0,0,0,.6);
    animation: winnerIn 420ms cubic-bezier(.2,.9,.2,1);
}

.winner-banner-inner small {
    display: block;
    color: var(--muted);
    letter-spacing: .18em;
    font-weight: 900;
}

.winner-banner-inner strong {
    display: block;
    margin-top: 5px;
    font-size: 4rem;
}

@keyframes winnerIn {
    from {
        transform: scale(.65);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

@media (max-aspect-ratio: 4/3) {
    .cast-grid,
    .payout-grid {
        grid-template-columns: repeat(2, minmax(0,1fr));
    }

    .final-seeds {
        grid-template-columns: repeat(2, minmax(0,1fr));
    }
}

/* =========================================================
   DRAFT MICRO-ANIMATIONS
   ========================================================= */

.draft-hero.draft-switch-out {
    animation:
        draftSpotOut 180ms
        cubic-bezier(.4,0,1,1)
        both;
}

.draft-hero.draft-switch-in {
    animation:
        draftSpotIn 340ms
        cubic-bezier(.16,.84,.28,1)
        both;
}

@keyframes draftSpotOut {
    from {
        opacity: 1;
        transform: translateX(0) scale(1);
    }

    to {
        opacity: 0;
        transform: translateX(-16px) scale(.985);
    }
}

@keyframes draftSpotIn {
    from {
        opacity: 0;
        transform: translateX(18px) scale(.985);
    }

    to {
        opacity: 1;
        transform: translateX(0) scale(1);
    }
}

.draft-roster-card.draft-slot-land {
    animation:
        draftSlotLand 300ms
        cubic-bezier(.18,.88,.3,1)
        both;
}

@keyframes draftSlotLand {
    0% {
        transform: scale(.88);
        opacity: .55;
    }

    55% {
        transform: scale(1.055);
        opacity: 1;
        box-shadow:
            0 0 24px
            color-mix(
                in srgb,
                var(--draft-land-color, white) 38%,
                transparent
            );
    }

    100% {
        transform: scale(1);
        opacity: 1;
        box-shadow: none;
    }
}

.draft-flight-card {
    position: fixed !important;
    z-index: 5000 !important;
    margin: 0 !important;
    pointer-events: none !important;
    transform-origin: center center;
    overflow: hidden;
    opacity: 1 !important;
    background:
        linear-gradient(
            145deg,
            color-mix(
                in srgb,
                var(--flight-player, white) 12%,
                #303746
            ),
            #202633 72%
        ) !important;
    box-shadow:
        0 18px 46px rgba(0,0,0,.66),
        0 0 0 1px rgba(255,255,255,.11),
        0 0 30px
        color-mix(
            in srgb,
            var(--flight-player, white) 42%,
            transparent
        );
    border:
        2px solid
        color-mix(
            in srgb,
            var(--flight-player, white) 68%,
            rgba(255,255,255,.16)
        ) !important;
}

.draft-flight-card .market-tile-name,
.draft-flight-card .market-tile-cost {
    color: #fff !important;
    opacity: 1 !important;
    text-shadow:
        0 1px 2px rgba(0,0,0,.9);
}

.market-tile.draft-source-lifting {
    opacity: .48;
    transform: scale(.94);
    transition:
        opacity 140ms ease,
        transform 140ms ease;
}

.draft-order-strip {
    position: relative;
}

.draft-order-glider {
    position: absolute;
    z-index: 0;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    opacity: 0;
    border-radius: 14px;
    pointer-events: none;
    background:
        linear-gradient(
            155deg,
            color-mix(
                in srgb,
                var(--glider-color, white) 22%,
                transparent
            ),
            rgba(255,255,255,.035)
        );
    border:
        2px solid
        color-mix(
            in srgb,
            var(--glider-color, white) 64%,
            white 4%
        );
    box-shadow:
        0 0 30px
        color-mix(
            in srgb,
            var(--glider-color, white) 30%,
            transparent
        );
    transition:
        left 480ms cubic-bezier(.2,.82,.2,1),
        top 480ms cubic-bezier(.2,.82,.2,1),
        width 480ms cubic-bezier(.2,.82,.2,1),
        height 480ms cubic-bezier(.2,.82,.2,1),
        opacity 160ms ease;
}

.draft-order-card {
    position: relative;
    z-index: 1;
}

.draft-order-card.current {
    transition:
        background 280ms ease,
        border-color 280ms ease,
        box-shadow 280ms ease,
        transform 280ms ease;
}

.draft-order-card.current.just-activated {
    transform: translateY(-4px);
}

.draft-order-card.current.direction-pulse {
    overflow: hidden;
}

.draft-order-card.current.direction-pulse::after {
    content: "";
    position: absolute;
    z-index: 0;
    top: -30%;
    bottom: -30%;
    width: 78%;
    opacity: 0;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse at center,
            color-mix(
                in srgb,
                var(--player) 55%,
                transparent
            ) 0%,
            color-mix(
                in srgb,
                var(--player) 22%,
                transparent
            ) 42%,
            transparent 72%
        );
    filter: blur(2px);
}

.draft-order-card.current.pulse-from-left::after {
    left: -42%;
    animation:
        draftPulseFromLeft 720ms
        cubic-bezier(.16,.82,.22,1)
        both;
}

.draft-order-card.current.pulse-from-right::after {
    right: -42%;
    animation:
        draftPulseFromRight 720ms
        cubic-bezier(.16,.82,.22,1)
        both;
}

.draft-order-card.current.direction-pulse > * {
    position: relative;
    z-index: 1;
}

@keyframes draftPulseFromLeft {
    0% {
        opacity: 0;
        transform: translateX(-10%) scaleX(.55);
    }

    28% {
        opacity: .95;
    }

    72% {
        opacity: .48;
    }

    100% {
        opacity: 0;
        transform: translateX(115%) scaleX(1.2);
    }
}

@keyframes draftPulseFromRight {
    0% {
        opacity: 0;
        transform: translateX(10%) scaleX(.55);
    }

    28% {
        opacity: .95;
    }

    72% {
        opacity: .48;
    }

    100% {
        opacity: 0;
        transform: translateX(-115%) scaleX(1.2);
    }
}


/* =========================================================
   LOBBY PLAYER JOIN REVEAL
   ========================================================= */

.player-card.lobby-join-card {
    --join-delay: 0ms;
    animation:
        lobbyCardArrive 820ms
        cubic-bezier(.16,.86,.25,1)
        var(--join-delay)
        both;
}

.player-card.lobby-join-card::before {
    animation:
        lobbyColorBarPop 760ms
        cubic-bezier(.18,.86,.28,1)
        var(--join-delay)
        both;
}

.player-card.lobby-join-card::after {
    content: "";
    position: absolute;
    z-index: 0;
    top: -60%;
    bottom: -60%;
    left: -35%;
    width: 42%;
    opacity: 0;
    pointer-events: none;
    transform: rotate(12deg);
    background:
        linear-gradient(
            90deg,
            transparent,
            color-mix(
                in srgb,
                var(--player) 58%,
                rgba(255,255,255,.34)
            ),
            transparent
        );
    filter: blur(3px);
    animation:
        lobbyJoinSweep 780ms
        cubic-bezier(.18,.82,.28,1)
        calc(var(--join-delay) + 70ms)
        both;
}

.player-card.lobby-join-card > * {
    position: relative;
    z-index: 1;
}

.join-badge {
    position: absolute !important;
    z-index: 3 !important;
    right: 12px;
    top: 10px;
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--player);
    color: #0a0d13;
    font-size: .62rem;
    line-height: 1;
    letter-spacing: .11em;
    font-weight: 1000;
    opacity: 0;
    transform: translateY(-6px) scale(.88);
    animation:
        lobbyJoinBadge 1300ms
        cubic-bezier(.16,.84,.24,1)
        calc(var(--join-delay) + 180ms)
        both;
}

@keyframes lobbyCardArrive {
    0% {
        opacity: 0;
        transform:
            translateY(22px)
            scale(.90);
        box-shadow:
            0 0 0
            rgba(0,0,0,0);
    }

    48% {
        opacity: 1;
        transform:
            translateY(-4px)
            scale(1.025);
        box-shadow:
            0 0 38px
            color-mix(
                in srgb,
                var(--player) 34%,
                transparent
            );
    }

    72% {
        transform:
            translateY(1px)
            scale(.995);
    }

    100% {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
        box-shadow:
            0 0 0
            rgba(0,0,0,0);
    }
}

@keyframes lobbyColorBarPop {
    0% {
        transform: scaleY(.05);
        transform-origin: center;
        filter: brightness(1.8);
    }

    58% {
        transform: scaleY(1.08);
        filter: brightness(1.7);
    }

    100% {
        transform: scaleY(1);
        filter: brightness(1);
    }
}

@keyframes lobbyJoinSweep {
    0% {
        opacity: 0;
        transform:
            translateX(0)
            rotate(12deg);
    }

    22% {
        opacity: .8;
    }

    100% {
        opacity: 0;
        transform:
            translateX(360%)
            rotate(12deg);
    }
}

@keyframes lobbyJoinBadge {
    0% {
        opacity: 0;
        transform:
            translateY(-6px)
            scale(.88);
    }

    18% {
        opacity: 1;
        transform:
            translateY(0)
            scale(1.08);
    }

    32% {
        transform:
            translateY(0)
            scale(1);
    }

    72% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform:
            translateY(-3px)
            scale(.96);
    }
}

.order-reveal-strip {

.order-reveal-type {

.order-reveal-strip.order-locked {

.draft-order-flyer .order-reveal-rank {

.order-reveal-locked-label {

                Waiting for event state…
            </div>

            <span>
                Benefiting Extra Life
            </span>

        </footer>

    </section>


    <section
        id="payout-overlay"
        class="payout-overlay"
    ></section>

</div>


<script>
const PLAYER_COLORS = {
    scarlet: "#FF4D5A",
    tangerine: "#FF8A3D",
    gold: "#F2C94C",
    emerald: "#32D583",
    cyan: "#22D3EE",
    blue: "#3B82F6",
    violet: "#8B5CF6",
    pink: "#FF7AB8"
};


let roomCode = null;
let state = null;
let previousState = null;
let pollTimer = null;
let pollBusy = false;

let firstState = true;
let lastSettlementId = null;
let payoutTimer = null;

let lastWinnerKey = null;
let winnerTimer = null;

let draftPlayerJustChanged = false;
let pendingDraftGliderStart = null;

let newlyJoinedPlayerIds = [];
let newlyJoinedAudienceKeys = [];

let draftOrderRevealPending = false;
let draftOrderRevealSourceRects = {};
let draftOrderRevealRunning = false;


function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;
}



function draftPositionsChanged(
    oldSnapshot,
    newSnapshot
) {

    if (
        !oldSnapshot
        ||
        !newSnapshot
    ) {
        return false;
    }


    const oldMap =
        new Map(
            (oldSnapshot.players ?? [])
            .map(
                player => [
                    player.id,
                    player.draft_position
                    ?? null
                ]
            )
        );


    return (
        (newSnapshot.players ?? [])
        .some(
            player =>
                oldMap.get(
                    player.id
                )
                !==
                (
                    player.draft_position
                    ?? null
                )
        )
    );
}


function captureDraftOrderSourceRects() {

    const elements =
        document.querySelectorAll(
            "[data-order-player-id]"
        );


    const result = {};


    for (const element of elements) {

        const id =
            element.dataset
                .orderPlayerId;


        if (!id) {
            continue;
        }


        const rect =
            element
                .getBoundingClientRect();


        result[id] = {
            left: rect.left,
            top: rect.top,
            width: rect.width,
            height: rect.height
        };
    }


    return result;
}


function shuffleArray(values) {

    const result =
        [...values];


    for (
        let index =
            result.length - 1;

        index > 0;

        index--
    ) {

        const target =
            Math.floor(
                Math.random()
                *
                (index + 1)
            );


        [
            result[index],
            result[target]
        ] = [
            result[target],
            result[index]
        ];
    }


    return result;
}


function draftOrderTargetRects() {

    const targets =
        Array.from(
            document.querySelectorAll(
                ".order-reveal-strip"
            )
        );


    return new Map(
        targets.map(
            element => {

                const rect =
                    element
                    .getBoundingClientRect();


                return [
                    element.dataset
                        .orderPlayerId,

                    {
                        element,
                        left: rect.left,
                        top: rect.top,
                        width: rect.width,
                        height: rect.height
                    }
                ];
            }
        )
    );
}


function makeDraftOrderFlyer(
    player,
    sourceRect
) {

    const flyer =
        document.createElement(
            "div"
        );


    flyer.className =
        "draft-order-flyer";


    flyer.style.setProperty(
        "--player",
        playerColor(
            player.id
        )
    );


    flyer.dataset.playerId =
        player.id;


    flyer.innerHTML = `
        <div class="order-reveal-rank">
            ?
        </div>

        <div class="order-reveal-name">
            ${escapeHtml(player.display_name)}
        </div>

        <div class="order-reveal-type">
            ${
                player.is_bot
                ? "Chaos Gambler"
                : "Player"
            }
        </div>
    `;


    Object.assign(
        flyer.style,
        {
            left:
                `${sourceRect.left}px`,

            top:
                `${sourceRect.top}px`,

            width:
                `${sourceRect.width}px`,

            height:
                `${sourceRect.height}px`
        }
    );


    document.body.appendChild(
        flyer
    );


    return flyer;
}


async function animateFlyerRect(
    flyer,
    fromRect,
    toRect,
    duration = 420,
    easing =
        "cubic-bezier(.2,.8,.2,1)"
) {

    const animation =
        flyer.animate(
            [
                {
                    left:
                        `${fromRect.left}px`,
                    top:
                        `${fromRect.top}px`,
                    width:
                        `${fromRect.width}px`,
                    height:
                        `${fromRect.height}px`
                },

                {
                    left:
                        `${toRect.left}px`,
                    top:
                        `${toRect.top}px`,
                    width:
                        `${toRect.width}px`,
                    height:
                        `${toRect.height}px`
                }
            ],
            {
                duration,
                easing,
                fill: "forwards"
            }
        );


    try {
        await animation.finished;
    }
    catch {
        // Harmless if a render interrupts.
    }


    Object.assign(
        flyer.style,
        {
            left:
                `${toRect.left}px`,
            top:
                `${toRect.top}px`,
            width:
                `${toRect.width}px`,
            height:
                `${toRect.height}px`
        }
    );
}


async function runDraftOrderReveal() {

    if (
        !draftOrderRevealPending
        ||
        draftOrderRevealRunning
        ||
        state?.event?.status !==
            "draft_order"
    ) {
        return;
    }


    const targets =
        draftOrderTargetRects();


    if (!targets.size) {
        return;
    }


    draftOrderRevealRunning = true;


    const players =
        [...state.players];


    const targetRows =
        [...targets.values()]
        .sort(
            (a,b) =>
                a.top - b.top
        );


    const flyers = [];


    for (
        let index = 0;
        index < players.length;
        index++
    ) {

        const player =
            players[index];


        const fallback =
            targetRows[
                Math.min(
                    index,
                    targetRows.length - 1
                )
            ];


        const source =
            draftOrderRevealSourceRects[
                player.id
            ]
            ?? {
                left:
                    fallback.left,

                top:
                    fallback.top,

                width:
                    fallback.width,

                height:
                    fallback.height
            };


        flyers.push({
            player,
            flyer:
                makeDraftOrderFlyer(
                    player,
                    source
                ),
            rect:
                source
        });
    }


    const subtitle =
        document.getElementById(
            "draft-order-subtitle"
        );


    // First: collapse the original Lobby cards into randomized
    // one-per-row strips.
    let permutation =
        shuffleArray(
            targetRows
        );


    await Promise.all(
        flyers.map(
            async (
                item,
                index
            ) => {

                const target =
                    permutation[index];


                await animateFlyerRect(
                    item.flyer,
                    item.rect,
                    target,
                    650,
                    "cubic-bezier(.16,.82,.22,1)"
                );


                item.rect =
                    target;
            }
        )
    );


    // Then visibly scramble the strips several times.
    for (
        let pass = 0;
        pass < 4;
        pass++
    ) {

        permutation =
            shuffleArray(
                targetRows
            );


        await Promise.all(
            flyers.map(
                async (
                    item,
                    index
                ) => {

                    const target =
                        permutation[index];


                    await animateFlyerRect(
                        item.flyer,
                        item.rect,
                        target,
                        340,
                        "cubic-bezier(.35,.02,.2,1)"
                    );


                    item.rect =
                        target;
                }
            )
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    90
                )
        );
    }


    // Final settle: every player flies into their real draft
    // position.
    if (subtitle) {
        subtitle.textContent =
            "Locking final draft positions…";
    }


    await Promise.all(
        flyers.map(
            async item => {

                const target =
                    targets.get(
                        item.player.id
                    );


                if (!target) {
                    return;
                }


                const rank =
                    item.flyer
                    .querySelector(
                        ".order-reveal-rank"
                    );


                if (rank) {

                    rank.textContent =
                        `#${item.player.draft_position}`;
                }


                await animateFlyerRect(
                    item.flyer,
                    item.rect,
                    target,
                    620,
                    "cubic-bezier(.16,.88,.24,1)"
                );


                item.rect =
                    target;
            }
        )
    );


    // Reveal the real DOM strips beneath the flyers and pulse
    // them into their final locked state.
    const finalStrips =
        Array.from(
            document.querySelectorAll(
                ".order-reveal-strip"
            )
        );


    // Reveal every real strip first so there is always a visible
    // layer underneath the flyer copies during the handoff.
    finalStrips.forEach(
        (
            strip,
            index
        ) => {

            strip.style.opacity =
                "1";

            strip.classList.remove(
                "pending-target"
            );


            setTimeout(
                () => {
                    strip.classList.add(
                        "order-locked"
                    );
                },
                index * 55
            );
        }
    );


    // Give the browser a full paint opportunity with the final strips
    // visible before fading the animated flyer copies away.
    await new Promise(
        resolve =>
            requestAnimationFrame(
                () =>
                    requestAnimationFrame(
                        resolve
                    )
            )
    );


    const flyerFades =
        flyers.map(
            item =>
                item.flyer.animate(
                    [
                        { opacity: 1 },
                        { opacity: 0 }
                    ],
                    {
                        duration: 170,
                        fill: "forwards"
                    }
                )
        );


    await Promise.all(
        flyerFades.map(
            async fade => {

                try {
                    await fade.finished;
                }
                catch {
                    // Harmless.
                }
            }
        )
    );


    for (const item of flyers) {
        item.flyer.remove();
    }


    if (subtitle) {

        subtitle.innerHTML = `
            Draft order locked.
            <span class="order-reveal-locked-label">
                Ready to Draft
            </span>
        `;
    }


    draftOrderRevealPending = false;
    draftOrderRevealSourceRects = {};
    draftOrderRevealRunning = false;
}


function playerById(id) {

    return (
        state?.players?.find(
            player =>
                player.id === id
        )
        ?? null
    );
}


function playerName(id) {

    return (
        playerById(id)
        ?.display_name
        ?? "Player"
    );
}


function playerColor(id) {

    const code =
        playerById(id)
        ?.color_code;

    return (
        PLAYER_COLORS[code]
        ?? "#8B97AE"
    );
}


function money(value) {

    const number =
        Number(value ?? 0);

    return (
        "$"
        +
        Math.round(number)
        .toLocaleString()
    );
}


function signedMoney(value) {

    const number =
        Math.round(
            Number(value ?? 0)
        );

    if (number === 0) {
        return "$0";
    }

    return (
        number > 0
        ? `+${money(number)}`
        : `-${money(Math.abs(number))}`
    );
}


function standings() {

    return [...(state?.players ?? [])]
        .sort(
            (a,b) =>
                b.war_chest - a.war_chest
                ||
                b.wins - a.wins
                ||
                a.display_name.localeCompare(
                    b.display_name
                )
        );
}


function currentMatch() {

    const event =
        state?.event;

    if (!event) {
        return null;
    }

    return (
        state.matches?.find(
            match =>
                match.round_number ===
                    event.current_round
                &&
                match.match_number ===
                    event.current_match_number
        )
        ?? null
    );
}


function currentFinalMatch() {

    const stage =
        state?.event
        ?.final_war_current_stage;

    return (
        state?.final_war_matches
        ?.find(
            match =>
                match.stage_number ===
                stage
        )
        ?? null
    );
}


function armyFor(playerId) {

    return (
        state?.current_armies
        ?.find(
            army =>
                army.player_id ===
                playerId
        )
        ?? null
    );
}


function finalArmyFor(playerId) {

    return (
        state?.final_war_armies
        ?.find(
            army =>
                army.player_id ===
                playerId
        )
        ?? null
    );
}


async function ensureBroadcastSession() {

    const sessionResult =
        await db.auth.getSession();

    if (
        sessionResult.data
        ?.session
    ) {
        return;
    }


    const { error } =
        await db.auth
            .signInAnonymously();


    if (error) {
        throw error;
    }
}


function roomFromUrl() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("room")
        ?.trim()
        .toUpperCase()
        ?? ""
    );
}


async function connectBroadcast() {

    const input =
        document.getElementById(
            "room-code"
        );

    const message =
        document.getElementById(
            "setup-message"
        );


    const code =
        input.value
            .trim()
            .toUpperCase();


    if (code.length !== 6) {

        message.textContent =
            "Enter the 6-character room code.";

        return;
    }


    message.textContent =
        "Connecting…";


    try {

        await ensureBroadcastSession();


        roomCode = code;


        const url =
            new URL(
                window.location.href
            );

        url.searchParams.set(
            "room",
            roomCode
        );

        history.replaceState(
            null,
            "",
            url
        );


        await refreshState(true);


        document
            .getElementById(
                "setup-screen"
            )
            .classList.add("hidden");


        document
            .getElementById(
                "broadcast-shell"
            )
            .classList.remove("hidden");


        startPolling();
    }

    catch (error) {

        console.error(error);

        message.textContent =
            error.message;
    }
}


function startPolling() {

    clearInterval(
        pollTimer
    );


    pollTimer =
        setInterval(
            () =>
                refreshState(false),
            900
        );
}


async function refreshState(
    initial = false
) {

    if (
        pollBusy
        ||
        !roomCode
    ) {
        return;
    }


    pollBusy = true;


    try {

        const { data, error } =
            await db.rpc(
                "get_broadcast_state",
                {
                    p_code:
                        roomCode
                }
            );


        if (error) {
            throw error;
        }


        if (
            data?.event?.status === "lobby"
        ) {

            const {
                data:
                    fullAudienceRoster,
                error:
                    audienceRosterError
            } =
                await db.rpc(
                    "get_broadcast_audience_roster",
                    {
                        p_code:
                            roomCode
                    }
                );


            if (audienceRosterError) {

                console.error(
                    audienceRosterError
                );

            }

            else if (
                Array.isArray(
                    fullAudienceRoster
                )
            ) {

                data.audience =
                    data.audience
                    ?? {};


                data.audience.preview =
                    fullAudienceRoster;


                data.audience.count =
                    fullAudienceRoster.length;
            }
        }


        /*
           The Audience-enhanced get_broadcast_state() replacement
           does not include draft_units. During Draft, load the legal
           opening unit market separately so the existing Draft scene
           can continue using state.draft_units exactly as before.
        */
        if (
            data?.event?.status === "draft"
        ) {

            const {
                data:
                    draftUnits,
                error:
                    draftUnitsError
            } =
                await db.rpc(
                    "get_broadcast_draft_units"
                );


            if (draftUnitsError) {

                console.error(
                    draftUnitsError
                );

            }

            else if (
                Array.isArray(
                    draftUnits
                )
            ) {

                data.draft_units =
                    draftUnits;
            }
        }


        const oldState =
            state;


        // While the Draft Order shuffle/reveal is actively animating,
        // do not let the normal ~900ms poll re-render the same scene.
        // A mid-animation re-render recreates the hidden target strips
        // and causes a brief blank flash when the flyer copies disappear.
        //
        // If the Host advances out of draft_order, allow that new phase
        // through immediately.
        if (
            draftOrderRevealRunning
            &&
            oldState?.event?.status === "draft_order"
            &&
            data?.event?.status === "draft_order"
        ) {

            state =
                data;

            return;
        }


        newlyJoinedPlayerIds = [];
        newlyJoinedAudienceKeys = [];


        if (
            !initial
            &&
            oldState?.event?.status === "lobby"
            &&
            data?.event?.status === "lobby"
        ) {

            const existingIds =
                new Set(
                    (oldState.players ?? [])
                    .map(
                        player =>
                            player.id
                    )
                );


            newlyJoinedPlayerIds =
                (data.players ?? [])
                .filter(
                    player =>
                        !existingIds.has(
                            player.id
                        )
                )
                .map(
                    player =>
                        player.id
                );


            const priorAudienceKeys =
                new Set(
                    (oldState?.audience?.preview ?? [])
                    .map(
                        viewer =>
                            String(
                                viewer.id
                                ?? viewer.audience_id
                                ?? viewer.user_id
                                ?? viewer.display_name
                            )
                    )
                );


            newlyJoinedAudienceKeys =
                (data?.audience?.preview ?? [])
                .filter(
                    viewer =>
                        !priorAudienceKeys.has(
                            String(
                                viewer.id
                                ?? viewer.audience_id
                                ?? viewer.user_id
                                ?? viewer.display_name
                            )
                        )
                )
                .map(
                    viewer =>
                        String(
                            viewer.id
                            ?? viewer.audience_id
                            ?? viewer.user_id
                            ?? viewer.display_name
                        )
                );
        }


        const enteringDraftOrder =
            !initial
            &&
            data?.event?.status ===
                "draft_order"
            &&
            (
                oldState?.event?.status ===
                    "lobby"
                ||
                oldState?.event?.status ===
                    "locked"
                ||
                (
                    oldState?.event?.status ===
                        "draft_order"
                    &&
                    draftPositionsChanged(
                        oldState,
                        data
                    )
                )
            );


        if (enteringDraftOrder) {

            draftOrderRevealSourceRects =
                captureDraftOrderSourceRects();

            draftOrderRevealPending =
                true;
        }


        const draftPick =
            !initial
            &&
            oldState?.event?.status === "draft"
            &&
            data?.event?.status === "draft"
            ? newestDraftPickBetween(
                oldState,
                data
              )
            : null;


        if (draftPick) {

            const oldDrafter =
                draftPlayerForSnapshot(
                    oldState
                );

            const newDrafter =
                draftPlayerForSnapshot(
                    data
                );


            pendingDraftGliderStart =
                captureDraftGliderStart();


            await animateDraftPickFlight(
                draftPick,
                oldState
            );


            // Give viewers a beat to read the completed pick
            // before advancing the Broadcast to the next drafter.
            // This also applies at snake-draft endpoints where the
            // same player immediately receives another pick.
            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        900
                    )
            );


            draftPlayerJustChanged =
                oldDrafter?.id
                !==
                newDrafter?.id;


            if (draftPlayerJustChanged) {

                await fadeOutCurrentDrafter();
            }
        }


        previousState =
            oldState;

        state =
            data;


        if (initial || firstState) {

            lastSettlementId =
                state.latest_settlement
                ?.match_id
                ?? null;

            firstState = false;
        }


        renderBroadcast();

        runDraftPostRenderAnimations();

        if (draftOrderRevealPending) {
            runDraftOrderReveal();
        }


        maybeShowWinner();
        maybeShowPayout();
    }

    catch (error) {

        console.error(error);

        document
            .getElementById(
                "footer-status"
            )
            .textContent =
                `Broadcast data error: ${error.message}`;
    }

    finally {

        pollBusy = false;
    }
}


function phaseLabel() {

    const event =
        state.event;

    const round =
        event.current_round
        ? `ROUND ${event.current_round}`
        : "";


    switch (event.status) {

        case "lobby":
            return "LOBBY";

        case "locked":
            return "LOCKING FIELD";

        case "draft_order":
            return "DRAFT ORDER";

        case "draft":
            return "DRAFT";

        case "draft_complete":
            return "DRAFT COMPLETE";

        case "shop":
            return `${round} SHOP`;

        case "army_build":
            return `${round} ARMY BUILD`;

        case "betting_open":
            return `${round} BETTING`;

        case "betting_locked":
            return `${round} POOLS LOCKED`;

        case "fight":
            return `${round} • FIGHT ${event.current_match_number}`;

        case "regular_complete":
            return "REGULAR SEASON COMPLETE";

        case "final_war_build":
            return `FINAL WAR • STAGE ${event.final_war_current_stage}`;

        case "final_war_ready":
            return `FINAL WAR • STAGE ${event.final_war_current_stage}`;

        case "final_war_fight":
            return `FINAL WAR • STAGE ${event.final_war_current_stage}`;

        case "final_war_complete":
            return "FINAL WAR COMPLETE";

        default:
            return String(event.status)
                .replaceAll("_"," ")
                .toUpperCase();
    }
}




function audienceCount() {

    return Number(
        state?.audience?.count
        ?? 0
    );
}


function audiencePreview(
    limit = 12
) {

    return (
        state?.audience?.preview
        ?? []
    ).slice(0, limit);
}


function audienceLeaders(
    limit = 8
) {

    return (
        state?.audience?.leaderboard
        ?? []
    ).slice(0, limit);
}


function audienceRegularPoolForMatch(
    matchId
) {

        state?.audience?.regular_pools
        ?? []
    ).find(
        pool =>
            pool.match_id ===
            matchId
    ) ?? null;
}


function audienceFinalPool() {

    return (
        state?.audience?.final_pool
        ?? null
    );
}


function gambleJoinUrl() {

    try {

        const url =
            new URL(
                "../gamble/",
                window.location.href
            );

        if (roomCode) {
            url.searchParams.set(
                "room",
                roomCode
            );
        }

        return url.toString();
    }

    catch (error) {

        console.error(error);

        return roomCode
            ? `../gamble/?room=${roomCode}`
            : "../gamble/";
    }
}


function audienceLobbyGridLayout(
    count
) {

    let cols = 5;
    let density = "audience-density-normal";


    if (count > 10) {
        cols = 6;
    }


    if (count > 18) {
        cols = 7;
        density =
            "audience-density-compact";
    }


    if (count > 28) {
        cols = 8;
    }


    if (count > 40) {
        cols = 9;
        density =
            "audience-density-dense";
    }


    if (count > 54) {
        cols = 10;
    }


    if (count > 70) {
        cols = 11;
        density =
            "audience-density-ultra";
    }


    if (count > 88) {
        cols = 12;
    }


    return {
        cols,
        rows:
            Math.max(
                1,
                Math.ceil(
                    count / cols
                )
            ),
        density
    };
}

) {

    const audience =
        animateJoins

        state.event;


    switch (event.status) {

        case "lobby":
            return `${state.players.length} / 8 players connected • ${audienceCount()} audience joined`;

        case "locked":
            return `Lobby locked • ${audienceCount()} audience joined`; 

        case "draft_order":
            return (
                draftOrderRevealPending
                ? "Randomizing draft order"
                : "Draft order locked • ready to begin"
            );

        case "draft":
            return `Pick ${event.draft_pick_number}`;

        case "shop":
            return `Players are shopping • ${audienceCount()} audience on deck`; 

        case "army_build":
            return `${state.army_submission_players.length} / ${state.players.length} armies submitted`;

        case "betting_open": {
            const ready =
                state.players.filter(
                    player =>
                        player.betting_ready_round ===
                        event.current_round
                ).length;

            return `${ready} / ${state.players.length} players ready`;
        }

        case "betting_locked":
            return "Betting locked • current matchup awaiting army reveal";

        case "fight": {
            const match =
                currentMatch();

            return match?.winner_player_id
                ? `${playerName(match.winner_player_id)} recorded as winner`
                : "Armies revealed • battle live";
        }

        case "regular_complete":
            return `Final Skill Allocation • ${audienceCount()} audience gamblers`; 

        case "final_war_build":
            return `${state.final_submission_players.length} / 2 Final War armies submitted`;

        case "final_war_ready":
            return "Final War armies ready for reveal";

        case "final_war_fight":
            return "Final War battle live";

        case "final_war_complete":
            return `Champion crowned • Audience leaderboard final`; 

        default:
            return "TABS War Chest Betting Special";
    }
}


function renderScene() {

    const status =
        state.event.status;


    if (status === "lobby") {
        return renderLobby();
    }


    if (status === "locked") {
        return renderCastIntro();
    }


    if (status === "draft_order") {
        return renderDraftOrderRevealScene();
    }


    if (status === "draft") {
        return renderDraft();
    }


    if (
        status === "draft_complete"
        ||
        status === "shop"
        ||
        status === "army_build"
        ||
        status === "regular_complete"
    ) {
        return renderStandingsPrep();
    }


    if (status === "betting_open") {
        return renderBettingOpen();
    }


    if (status === "betting_locked") {
        return renderPools();
    }


    if (status === "fight") {

        const match =
            currentMatch();

        if (match?.winner_player_id) {
            return renderFightResult();
        }

        return renderArmyReveal(
            match,
            state.current_armies,
            false
        );
    }


    if (
        status === "final_war_build"
        ||
        status === "final_war_ready"
    ) {
        return renderFinalBracket();
    }


    if (status === "final_war_fight") {

        return renderArmyReveal(
            currentFinalMatch(),
            state.final_war_armies,
            true
        );
    }


    if (status === "final_war_complete") {
        return renderChampion();
    }


    return renderStandings();
}

function draftPlayerForSnapshot(
    snapshot
) {

    const event =
        snapshot?.event;

    const players =
        snapshot?.players ?? [];


    if (
        !event
        ||
        !players.length
        ||
        !event.draft_pick_number
    ) {
        return null;
    }


    const count =
        players.length;

    const pick =
        event.draft_pick_number;

    const round =
        Math.floor(
            (pick - 1) / count
        ) + 1;

    const index =
        (pick - 1) % count;

    const position =
        round % 2 === 1
        ? index + 1
        : count - index;


    return (
        players.find(
            player =>
                player.draft_position ===
                position
        )
        ?? null
    );
}


function newestDraftPickBetween(
    oldSnapshot,
    newSnapshot
) {

    const oldPicks =
        oldSnapshot?.draft_picks
        ?? [];

    const newPicks =
        newSnapshot?.draft_picks
        ?? [];


    if (
        newPicks.length <=
        oldPicks.length
    ) {
        return null;
    }


    const oldMax =
        oldPicks.reduce(
            (max,pick) =>
                Math.max(
                    max,
                    Number(
                        pick.pick_number
                        ?? 0
                    )
                ),
            0
        );


    return (
        newPicks.find(
            pick =>
                Number(
                    pick.pick_number
                ) > oldMax
        )
        ?? null
    );
}

async function animateDraftPickFlight(
    pick,
    oldSnapshot
) {

    if (!pick) {
        return;
    }


    const source =
        document.querySelector(
            `[data-market-unit-id="${pick.unit_id}"]`
        );


    const target =
        draftFlightTargetSlot(
            pick.player_id,
            oldSnapshot
        );


    if (!source || !target) {
        return;
    }


    const sourceRect =
        source.getBoundingClientRect();

    const targetRect =
        target.getBoundingClientRect();


    source.classList.add(
        "draft-source-lifting"
    );


    const clone =
        source.cloneNode(true);


    clone.classList.add(
        "draft-flight-card"
    );


    clone.style.setProperty(
        "--flight-player",
        playerColor(
            pick.player_id
        )
    );


    Object.assign(
        clone.style,
        {
            left:
                `${sourceRect.left}px`,

            top:
                `${sourceRect.top}px`,

            width:
                `${sourceRect.width}px`,

            height:
                `${sourceRect.height}px`
        }
    );


    document.body.appendChild(
        clone
    );


    const flight =
        clone.animate(
            [
                {
                    left:
                        `${sourceRect.left}px`,

                    top:
                        `${sourceRect.top}px`,

                    width:
                        `${sourceRect.width}px`,

                    height:
                        `${sourceRect.height}px`,

                    borderRadius:
                        "8px",

                    transform:
                        "translateY(0) scale(1)"
                },

                {
                    offset: .52,

                    transform:
                        "translateY(-24px) scale(1.08)"
                },

                {
                    left:
                        `${targetRect.left}px`,

                    top:
                        `${targetRect.top}px`,

                    width:
                        `${targetRect.width}px`,

                    height:
                        `${targetRect.height}px`,

                    borderRadius:
                        "11px",

                    transform:
                        "translateY(0) scale(1)"
                }
            ],
            {
                duration: 620,
                easing:
                    "cubic-bezier(.18,.78,.22,1)",
                fill: "forwards"
            }
        );


    try {
        await flight.finished;
    }
    catch {
        // Animation cancellation is harmless.
    }


    clone.remove();


    source.classList.remove(
        "draft-source-lifting"
    );


    target.classList.remove(
        "empty"
    );


    target.style.setProperty(
        "--draft-land-color",
        playerColor(
            pick.player_id

    );


    target.innerHTML = `

            ${escapeHtml(pick.tier)}

            ${escapeHtml(pick.unit_name)}

    target.classList.add(
        "draft-slot-land"
    );


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                170
            )
    );
}

function animateDraftGlider() {

    const from =
        pendingDraftGliderStart;


    pendingDraftGliderStart =
        null;


    if (!from) {
        return;
    }


    const strip =
        document.querySelector(
            ".draft-order-strip"
        );

    const current =
        document.querySelector(
            ".draft-order-card.current"
        );

    const glider =
        document.querySelector(
            ".draft-order-glider"
        );


    if (
        !strip
        ||
        !current
        ||
        !glider
    ) {
        return;
    }


    glider.style.setProperty(
        "--glider-color",
        getComputedStyle(
            current
        ).getPropertyValue(
            "--player"
        )
        || "#ffffff"
    );


    // The glider is a newly-rendered element, so its CSS default
    // position is 0,0. Place it on the PREVIOUS player's card
    // instantly before enabling movement transitions. Otherwise
    // the browser visibly animates from the strip's top-left corner.
    glider.style.transition =
        "none";


    Object.assign(
        glider.style,
        {
            left:
                `${from.left}px`,

            top:
                `${from.top}px`,

            width:
                `${from.width}px`,

            height:
                `${from.height}px`,

            opacity: "1"
        }
    );


    // Force the browser to commit the starting geometry while
    // transitions are disabled.
    void glider.offsetWidth;


    glider.style.transition = `
        left 480ms cubic-bezier(.2,.82,.2,1),
        top 480ms cubic-bezier(.2,.82,.2,1),
        width 480ms cubic-bezier(.2,.82,.2,1),
        height 480ms cubic-bezier(.2,.82,.2,1),
        opacity 160ms ease
    `;


    const targetLeft =
        current.offsetLeft;


    const pulseClass =
        targetLeft > from.left
        ? "pulse-from-left"
        : targetLeft < from.left
        ? "pulse-from-right"
        : null;


    requestAnimationFrame(
        () => {

            glider.style.left =
                `${targetLeft}px`;

            glider.style.top =
                `${current.offsetTop}px`;

            glider.style.width =
                `${current.offsetWidth}px`;

            glider.style.height =
                `${current.offsetHeight}px`;

        }
    );


    if (pulseClass) {

        setTimeout(
            () => {

                current.classList.remove(
                    "pulse-from-left",
                    "pulse-from-right",
                    "direction-pulse"
                );


                // Force a style flush so repeated left/right pulses
                // can restart cleanly on the next draft change.
                void current.offsetWidth;


                current.classList.add(
                    "direction-pulse",
                    pulseClass
                );


                setTimeout(
                    () => {
                        current.classList.remove(
                            "pulse-from-left",
                            "pulse-from-right",
                            "direction-pulse"
                        );
                    },
                    760
                );

            },
            310
        );
    }


    setTimeout(
        () => {
            glider.style.opacity = "0";
        },
        560
    );
}

function draftOrderPlayers() {

    return state.players
        .slice()
        .sort(
            (a,b) =>
                (a.draft_position ?? 99)
                -
                (b.draft_position ?? 99)
        );
}


function draftUnitsRemaining() {

    const pickedIds =
        new Set(
            (state.draft_picks ?? [])
            .map(pick => pick.unit_id)
        );


    return (state.draft_units ?? [])
        .filter(unit => !pickedIds.has(unit.id));
}


function nextDraftPlayers(
    count = 2
) {

    const ordered =
        draftOrderPlayers();

    const countPlayers =
        ordered.length;

    if (!countPlayers) {
        return [];
    }

    const pick =
        state.event.draft_pick_number ?? 1;

    const round =
        Math.floor(
            (pick - 1) / countPlayers
        ) + 1;

    const index =
        (pick - 1) % countPlayers;

    const direction =
        round % 2 === 1 ? 1 : -1;

    const currentPos =
        direction === 1
        ? index
        : (countPlayers - 1 - index);

    const sequence = [];

    for (let offset = 1; offset <= count; offset++) {

        let posIndex = currentPos;
        let currentRound = round;
        let currentDirection = direction;

        for (let step = 0; step < offset; step++) {

            if (
                currentDirection === 1
                && posIndex === countPlayers - 1
            ) {
                currentRound += 1;
                currentDirection = -1;
            }
            else if (
                currentDirection === -1
                && posIndex === 0
            ) {
                currentRound += 1;
                currentDirection = 1;
            }
            else {
                posIndex += currentDirection;
            }
        }

        sequence.push(
            ordered[posIndex]
        );
    }

    return sequence.filter(Boolean);
}


function currentDraftPlayer() {

    const event =
        state.event;

    const count =
        state.players.length;


    if (
        !count
        ||
        !event.draft_pick_number
    ) {
        return null;
    }


    const pick =
        event.draft_pick_number;

    const round =
        Math.floor(
            (pick - 1) / count
        ) + 1;

    const index =
        (pick - 1) % count;

    const position =
        round % 2 === 1
        ? index + 1
        : count - index;


    return (
        state.players.find(
            player =>
                player.draft_position ===
                position
        )
        ?? null
    );
}
