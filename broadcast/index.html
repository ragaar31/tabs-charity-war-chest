}


function displayedArmyBudget(
    entry
) {

    return Number(
        entry?.submitted
        ? (
            entry.final_army_budget
            ?? entry.army_budget
            ?? entry.base_army_budget
            ?? 0
        )
        : (
            entry.army_budget
            ?? entry.base_army_budget
            ?? 0
        )
    );
}


function armyBuildProgress(
    entry
) {

    const budget =
        displayedArmyBudget(
            entry
        );


    if (!budget) {
        return 0;
    }


    return Math.max(
        0,
        Math.min(
            1,
            Number(
                entry?.total_cost ?? 0
            )
            / budget
        )
    );
}


function armyBuildAnimationSignature(
    snapshot,
    entry
) {

    const roundNumber =
        Number(
            snapshot?.event?.current_round
            ??
            snapshot?.army_build?.round_number
            ??
            0
        );


    return [
        roundNumber,
        entry.player_id,
        Number(
            entry.total_units
            ?? 0
        ),
        Number(
            entry.total_cost
            ?? 0
        ),
        Number(
            displayedArmyBudget(
                entry
            )
        ),
        entry.submitted
        ? 1
        : 0
    ].join(":");
}


function rememberArmyBuildAnimation(
    snapshot,
    entry
) {

    const roundNumber =
        Number(
            snapshot?.event?.current_round
            ??
            snapshot?.army_build?.round_number
            ??
            0
        );


    const key =
        `${roundNumber}:${entry.player_id}`;


    const signature =
        armyBuildAnimationSignature(
            snapshot,
            entry
        );


    if (
        armyBuildLastAnimationSignatures
            .get(
                key
            )
        ===
        signature
    ) {

        return false;
    }


    armyBuildLastAnimationSignatures
        .set(
            key,
            signature
        );


    return true;
}


function collectArmyBuildAnimations(
    oldSnapshot,
    newSnapshot
) {

    const nextEntries =
        armyBuildEntriesForSnapshot(
            newSnapshot
        );


    const priorMap =
        new Map(
            armyBuildEntriesForSnapshot(
                oldSnapshot
            )
            .map(
                entry => [
                    entry.player_id,
                    entry
                ]
            )
        );


    const samePhase =
        oldSnapshot?.event?.status ===
        "army_build";


    return nextEntries
        .map(
            entry => {

                const previous =
                    priorMap.get(
                        entry.player_id
                    );


                /*
                   When entering Army Build, don't treat every existing bot
                   submission as dozens of individual live edits. Give each
                   already-submitted army a short establishing burst instead.
                */
                if (
                    !samePhase
                    &&
                    entry.submitted
                ) {

                    if (
                        !rememberArmyBuildAnimation(
                            newSnapshot,
                            entry
                        )
                    ) {
                        return null;
                    }


                    return {
                        playerId:
                            entry.player_id,

                        unitDelta:
                            Math.min(
                                5,
                                Math.max(
                                    1,
                                    Number(
                                        entry.total_units
                                        ?? 1
                                    )
                                )
                            ),

                        fromProgress:
                            0,

                        toProgress:
                            armyBuildProgress(
                                entry
                            ),

                        submissionChanged:
                            true,

                        establishing:
                            true
                    };
                }


                if (!previous) {

                    const totalUnits =
                        Number(
                            entry.total_units
                            ?? 0
                        );


                    if (
                        totalUnits <= 0
                        &&
                        !entry.submitted
                    ) {
                        return null;
                    }


                    if (
                        !rememberArmyBuildAnimation(
                            newSnapshot,
                            entry
                        )
                    ) {
                        return null;
                    }


                    return {
                        playerId:
                            entry.player_id,

                        unitDelta:
                            Math.min(
                                totalUnits,
                                12
                            ),

                        fromProgress:
                            0,

                        toProgress:
                            armyBuildProgress(
                                entry
                            ),

                        submissionChanged:
                            Boolean(
                                entry.submitted
                            )
                    };
                }


                const currentUnits =
                    Number(
                        entry.total_units
                        ?? 0
                    );


                const previousUnits =
                    Number(
                        previous.total_units
                        ?? 0
                    );


                const unitDelta =
                    currentUnits
                    -
                    previousUnits;


                const fromProgress =
                    armyBuildProgress(
                        previous
                    );


                const toProgress =
                    armyBuildProgress(
                        entry
                    );


                const submissionChanged =
                    !previous.submitted
                    &&
                    Boolean(
                        entry.submitted
                    );


                const budgetChanged =
                    Number(
                        displayedArmyBudget(
                            previous
                        )
                    )
                    !==
                    Number(
                        displayedArmyBudget(
                            entry
                        )
                    );


                const progressChanged =
                    Math.abs(
                        toProgress
                        -
                        fromProgress
                    ) > .001;


                if (
                    unitDelta === 0
                    &&
                    !submissionChanged
                    &&
                    !budgetChanged
                    &&
                    !progressChanged
                ) {
                    return null;
                }


                if (
                    !rememberArmyBuildAnimation(
                        newSnapshot,
                        entry
                    )
                ) {
                    return null;
                }


                return {
                    playerId:
                        entry.player_id,

                    unitDelta,

                    fromProgress,

                    toProgress,

                    submissionChanged,

                    establishing:
                        false
                };
            }
        )
        .filter(Boolean);
}

function armyBuildFillIntensity(
    progress
) {

    const value =
        Math.max(
            0,
            Math.min(
                1,
                Number(
                    progress
                    ?? 0
                )
            )
        );


    if (value <= 0) {
        return 0;
    }


    /*
       Near-full armies should look near-full, and a capped army should
       be exactly the player's color.
    */
    if (value >= .999) {
        return 1;
    }


    return Math.min(
        1,
        Math.pow(
            value,
            .78
        )
    );
}


function armyBuildInsetGlow(
    progress
) {

    const value =
        Math.max(
            0,
            Math.min(
                1,
                Number(
                    progress
                    ?? 0
                )
            )
        );


    if (value <= 0) {
        return 0;
    }


    return Math.min(
        .34,
        .02
        +
        Math.pow(
            value,
            .92
        )
        *
        .20
    );
}

function launchArmyBuildOrb(
    color,
    startX,
    startY,
    endX,
    endY,
    delay = 0,
    reverse = false
) {

    window.setTimeout(
        () => {

            const orb =
                document.createElement(
                    "div"
                );


            orb.className =
                `
                    army-build-flight-orb
                    ${
                        reverse
                        ? "reverse"
                        : ""
                    }
                `;


            orb.style.setProperty(
                "--orb-color",
                color
            );


            orb.style.left =
                `${startX}px`;

            orb.style.top =
                `${startY}px`;


            document.body.appendChild(
                orb
            );


            const dx =
                endX
                -
                startX;


            const dy =
                endY
                -
                startY;


            const arc =
                reverse
                ? 8
                : -10;


            const animation =
                orb.animate(
                    [
                        {
                            transform:
                                "translate(0px,0px) scale(.38)",
                            opacity: 0
                        },

                        {
                            transform:
                                `translate(${dx * .28}px, ${dy * .22 + arc}px) scale(.92)`,
                            opacity:
                                reverse
                                ? .58
                                : .96,
                            offset: .36
                        },

                        {
                            transform:
                                `translate(${dx * .72}px, ${dy * .70 - arc * .35}px) scale(.82)`,
                            opacity:
                                reverse
                                ? .48
                                : .92,
                            offset: .72
                        },

                        {
                            transform:
                                `translate(${dx}px, ${dy}px) scale(.48)`,
                            opacity: 0
                        }
                    ],

                    {
                        duration:
                            reverse
                            ? 460
                            : 500,

                        easing:
                            "cubic-bezier(.22,.62,.26,1)",

                        fill:
                            "forwards"
                    }
                );


            animation.finished
                .catch(
                    () => null
                )
                .then(
                    () =>
                        orb.remove()
                );
        },
        delay
    );
}


function playArmyBuildRowAnimation(
    entry
) {

    const row =
        document.querySelector(
            `[data-army-player-id="${entry.playerId}"]`
        );


    if (!row) {
        return;
    }


    const playerCard =
        row.querySelector(
            ".army-build-player-card"
        );


    const tierCard =
        row.querySelector(
            ".army-build-tier-card"
        );


    const fill =
        row.querySelector(
            ".army-build-tier-fill"
        );


    const dot =
        row.querySelector(
            ".army-build-tier-target-dot"
        );


    const startRect =
        playerCard
        ?.getBoundingClientRect();


    const endRect =
        dot
        ?.getBoundingClientRect();


    const color =
        playerColor(
            entry.playerId
        );


    const reverse =
        Number(
            entry.unitDelta
            ?? 0
        ) < 0;


    const rawCount =
        Math.abs(
            Number(
                entry.unitDelta
                ?? 0
            )
        );


    const orbCount =
        entry.establishing
        ? Math.min(
            5,
            Math.max(
                1,
                rawCount
            )
          )
        : Math.min(
            16,
            rawCount
        );


    const fromProgress =
        Math.max(
            0,
            Math.min(
                1,
                Number(
                    entry.fromProgress
                    ?? 0
                )
            )
        );


    const toProgress =
        Math.max(
            0,
            Math.min(
                1,
                Number(
                    entry.toProgress
                    ?? 0
                )
            )
        );


    const fromIntensity =
        armyBuildFillIntensity(
            fromProgress
        );


    const toIntensity =
        armyBuildFillIntensity(
            toProgress
        );


    const fromGlow =
        armyBuildInsetGlow(
            fromProgress
        );


    const toGlow =
        armyBuildInsetGlow(
            toProgress
        );


    /*
       The new DOM was rendered with the new progress value. Before the
       browser paints, put the persistent color wash back at the OLD
       progress value so the actual army change can visibly ease from
       old -> new instead of appearing instantly.
    */
    if (fill) {

        fill.style.transition =
            "none";

        fill.style.opacity =
            `${fromIntensity}`;
    }


    if (tierCard) {

        tierCard.style.setProperty(
            "--build-glow",
            `${fromGlow}`
        );
    }


    if (fill) {
        void fill.offsetWidth;
    }


    /*
       Directional choreography:

       ADD:
         Player card pulses -> orbs travel -> Army card / target pulse.

       REMOVE:
         Army card / target pulse -> orbs travel back -> Player card pulses.
    */
    if (reverse) {

        pulseArmyTierCard(
            tierCard
        );

        pulseArmyTargetDot(
            dot
        );

    }

    else {

        pulseArmyPlayerCard(
            playerCard
        );
    }


    if (
        startRect
        &&
        endRect
        &&
        orbCount > 0
    ) {

        const playerX =
            startRect.left
            +
            startRect.width
            /
            2;


        const playerY =
            startRect.top
            +
            startRect.height
            /
            2;


        const targetX =
            endRect.left
            +
            endRect.width
            /
            2;


        const targetY =
            endRect.top
            +
            endRect.height
            /
            2;


        for (
            let index = 0;
            index < orbCount;
            index++
        ) {

            const stagger =
                Math.min(
                    360,
                    index * 54
                );


            launchArmyBuildOrb(
                color,

                reverse
                ? targetX
                : playerX,

                reverse
                ? targetY
                : playerY,

                reverse
                ? playerX
                : targetX,

                reverse
                ? playerY
                : targetY,

                stagger,

                reverse
            );
        }
    }


    /*
       Start the persistent fill transition as the first orbs are moving.
       It finishes at the REAL new capacity color and stays there.
       The temporary pulse is completely separate from this value.
    */
    window.setTimeout(
        () => {

            if (fill) {

                fill.style.transition =
                    "opacity 680ms cubic-bezier(.20,.72,.24,1)";

                fill.style.opacity =
                    `${toIntensity}`;
            }


            if (tierCard) {

                tierCard.style.setProperty(
                    "--build-glow",
                    `${toGlow}`
                );

                tierCard.dataset
                    .armyPersistentProgress =
                        `${toProgress}`;
            }
        },
        150
    );


    /*
       Arrival pulse. Reverse intentionally swaps the destination.
    */
    window.setTimeout(
        () => {

            if (reverse) {

                pulseArmyPlayerCard(
                    playerCard
                );

            }

            else {

                pulseArmyTargetDot(
                    dot
                );

                pulseArmyTierCard(
                    tierCard
                );
            }
        },
        420
    );
}


function runArmyBuildPostRenderAnimations() {

    if (
        state?.event?.status !==
            "army_build"
        ||
        !armyBuildPendingAnimations
            .length
    ) {
        return;
    }


    const queue =
        armyBuildPendingAnimations
        .slice();


    armyBuildPendingAnimations =
        [];


    armyBuildAnimationUntil =
        performance.now()
        +
        900
        +
        queue.length
        *
        90;


    queue.forEach(
        (
            entry,
            index
        ) => {

            window.setTimeout(
                () =>
                    playArmyBuildRowAnimation(
                        entry
                    ),
                index
                *
                90
            );
        }
    );
}

                    </div>

                    ${
                        topAudience
                        ? `
                            <div class="winner-name">
                                ${escapeHtml(topAudience.display_name)}
                            </div>
                            <div class="winner-money">
                                ${money(topAudience.bankroll)}
                            </div>
                            <div class="audience-panel-copy">
                                Finished #1 on the spectator leaderboard.
                            </div>
                          `
                        : `
                            <div class="audience-panel-copy">
                                No audience leaderboard entries were recorded.
                            </div>
                          `
                    }
                </section>

                ${renderAudienceLeaderboardMini(
                    "Audience Final Top Board",
                    "The crowd’s best gamblers of the show.",
                    6
                )}
            </div>

        </div>
    `;
}


function maybeShowWinner() {

    if (
        state.event.status !== "fight"
    ) {
        return;
    }


    const match =
        currentMatch();


    if (!match?.winner_player_id) {
        return;
    }


    const key =
        `${match.id}:${match.winner_player_id}`;


    if (key === lastWinnerKey) {
        return;
    }


    lastWinnerKey = key;


    const banner =
        document.getElementById(
            "winner-banner"
        );


    banner.innerHTML = `
        <div
            class="winner-banner-inner"
            style="
                --player:
                ${playerColor(match.winner_player_id)};
            "
        >
            <small>VICTORY</small>
            <strong>
                ${escapeHtml(
                    playerName(
                        match.winner_player_id
                    )
                )}
            </strong>
        </div>
    `;


    banner.classList.remove("hidden");


    clearTimeout(
        winnerTimer
    );


    winnerTimer =
        setTimeout(
            () =>
                banner.classList.add("hidden"),
            2600
        );
}


function settlementResults(
    settlement
) {

    const result =
        new Map();


    const add = (
        playerId,
        value,
        label
    ) => {

        if (!playerId) {
            return;
        }


        const current =
            result.get(playerId)
            ?? {
                value: 0,
                labels: []
            };


        current.value +=
            Number(value ?? 0);


        if (
            label
            &&
            Number(value ?? 0) !== 0
        ) {
            current.labels.push(label);
        }


        result.set(
            playerId,
            current
        );
    };


    // Winner's $500 battle purse.
    add(
        settlement.winner_player_id,
        500,
        "Battle purse"
    );


    for (
        const bet of
        settlement.standard_bets ?? []
    ) {

        add(
            bet.player_id,
            Number(bet.payout ?? 0)
            -
            Number(bet.amount ?? 0),
            "Winner bet"
        );
    }


    for (
        const hedge of
        settlement.hedges ?? []
    ) {

        add(
            hedge.player_id,
            Number(hedge.payout ?? 0)
            -
            Number(hedge.stake ?? 0),
            "Hedge"
        );
    }


    for (
        const prop of
        settlement.props ?? []
    ) {

        add(
            prop.player_id,
            Number(prop.payout ?? 0)
            -
            Number(prop.amount ?? 0),
            "Prop"
        );
    }


    for (
        const parlay of
        settlement.parlays ?? []
    ) {

        add(
            parlay.player_id,
            Number(parlay.payout ?? 0)
            -
            Number(parlay.starting_amount ?? 0),
            parlay.leg_count === 3
            ? "Moonshot"
            : "Parlay"
        );
    }


    for (
        const item of
        settlement.consumables ?? []
    ) {

        const label =
            item.item_code ===
                "war-bond"
            ? "War Bond"
            : item.item_code ===
                "rainy-day"
            ? "Rainy Day Fund"
            : "Consumable";


        add(
            item.player_id,
            Number(
                item.payout_amount
                ?? 0
            ),
            label
        );
    }


    return result;
}


function maybeShowPayout() {

    const settlement =
        state.latest_settlement;


    if (!settlement?.match_id) {
        return;
    }


    if (
        settlement.match_id ===
        lastSettlementId
    ) {
        return;
    }


    lastSettlementId =
        settlement.match_id;


    const overlay =
        document.getElementById(
            "payout-overlay"
        );


    const results =
        settlementResults(
            settlement
        );


    const rows =
        standings()
        .map(
            player => {

                const result =
                    results.get(
                        player.id
                    )
                    ?? {
                        value: 0,
                        labels: []
                    };


                const cssClass =
                    result.value > 0
                    ? "positive"
                    : result.value < 0
                    ? "negative"
                    : "";


                return `
                    <div
                        class="
                            payout-player
                            ${cssClass}
                        "
                        style="
                            --player:
                            ${playerColor(player.id)};
                        "
                    >

                        <div class="p-name">
                            ${escapeHtml(player.display_name)}
                        </div>

                        <div class="p-delta">
                            ${signedMoney(result.value)}
                        </div>

                        <div class="p-total">
                            War Chest:
                            ${money(player.war_chest)}
                        </div>

                        ${
                            result.labels.length
                            ? `
                                <div
                                    style="
                                        margin-top:5px;
                                        color:var(--muted);
                                        font-size:.7rem;
                                    "
                                >
                                    ${escapeHtml(
                                        result.labels.join(" • ")
                                    )}
                                </div>
                              `
                            : ""
                        }

                    </div>
                `;
            }
        )
        .join("");


    overlay.innerHTML = `
        <div class="payout-board">

            <div class="payout-heading">

                <h2>
                    Settling Fight ${settlement.match_number}
                </h2>

                <p>
                    Bet results, item bonuses, completed advanced wagers, and the $500 battle purse.
                </p>

            </div>

            <div class="payout-grid">
                ${rows}
            </div>

        </div>
    `;


    overlay.classList.add(
        "active"
    );


    clearTimeout(
        payoutTimer
    );


    payoutTimer =
        setTimeout(
            () => {

                overlay.classList.remove(
                    "active"
                );

            },
            6200
        );
}


async function initialize() {

    const fromUrl =
        roomFromUrl();


    if (fromUrl) {

        document
            .getElementById(
                "room-code"
            )
            .value =
                fromUrl;


        await connectBroadcast();

        return;
    }


    document
        .getElementById(
            "room-code"
        )
        .focus();
}


document
    .getElementById(
        "room-code"
    )
    .addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                connectBroadcast();
            }
        }
    );


initialize();
</script>
