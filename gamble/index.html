<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Audience Gambler | TABS War Chest
</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --accent: #F2C94C;
    --accent-rgb: 242,201,76;
    --bg: #121722;
    --panel: #1b2130;
    --soft: rgba(255,255,255,.055);
    --line: rgba(255,255,255,.12);
    --text: #f8f9fb;
    --muted: rgba(248,249,251,.64);
}

html,
body {
    min-height: 100%;
    margin: 0;
}

body {
    background:
        linear-gradient(
            180deg,
            rgba(var(--accent-rgb), .055),
            transparent 220px
        ),
        var(--bg);
    color: var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body::before {
    content: "";
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--accent);
    pointer-events: none;
}

button,
input,
select {
    font: inherit;
}

button {
    min-height: 44px;
    padding: 10px 13px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: rgba(var(--accent-rgb), .14);
    color: white;
    font-weight: 800;
    cursor: pointer;
}

button:hover:not(:disabled) {
    background:
        rgba(var(--accent-rgb), .22);
    border-color:
        rgba(var(--accent-rgb), .48);
}

button:disabled {
    opacity: .35;
    cursor: default;
}

button.secondary {
    background: rgba(255,255,255,.045);
}

.hidden {
    display: none !important;
}

main {
    width: min(720px, calc(100% - 24px));
    margin: auto;
    padding: 14px 0 45px;
}

.panel {
    margin-bottom: 12px;
    padding: 16px;
    border-radius: 14px;
    background: rgba(27,33,48,.92);
    border: 1px solid var(--line);
}

.join-panel {
    margin-top: 42px;
}

.join-panel h1 {
    margin: 0;
    font-size: 2.25rem;
}

.join-panel p {
    color: var(--muted);
}

.join-grid {
    display: grid;
    gap: 10px;
    margin-top: 18px;
}

input,
select {
    width: 100%;
    min-height: 46px;
    padding: 10px 12px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: #111722;
    color: white;
}

#room-code {
    text-transform: uppercase;
    letter-spacing: .13em;
}

.disclaimer {
    margin-top: 12px;
    color: var(--muted);
    font-size: .76rem;
}

.message {
    min-height: 1.3em;
    margin-top: 8px;
    color: #ffd3d3;
    font-size: .82rem;
}

.audience-header {
    position: sticky;
    z-index: 50;
    top: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    padding: 10px 12px;
    border-radius: 0 0 12px 12px;
    background: rgba(18,23,34,.95);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(var(--accent-rgb), .25);
    border-top: 0;
}

.audience-id {
    min-width: 0;
    flex: 1 1 auto;
}

.audience-name {
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.phase-label {
    margin-top: 2px;
    color: var(--muted);
    font-size: .68rem;
    text-transform: uppercase;
    letter-spacing: .09em;
}

.header-money {
    flex: 0 0 auto;
    text-align: right;
}

.header-money strong {
    display: block;
    font-size: 1.12rem;
    font-variant-numeric: tabular-nums;
}

.header-money span {
    display: block;
    color: var(--muted);
    font-size: .65rem;
}

.stats-strip {
    display: grid;
    grid-template-columns:
        repeat(3, minmax(0,1fr));
    gap: 7px;
    margin-bottom: 12px;
}

.stat {
    padding: 10px;
    border-radius: 10px;
    background: var(--soft);
    text-align: center;
}

.stat span {
    display: block;
    color: var(--muted);
    font-size: .68rem;
}

.stat strong {
    display: block;
    margin-top: 3px;
    font-size: 1.05rem;
}

.scene-title {
    margin: 0 0 5px;
    font-size: 1.55rem;
}

.status {
    color: var(--muted);
    font-size: .82rem;
}

.fight-nav {
    display: grid;
    grid-template-columns:
        auto 1fr auto;
    align-items: center;
    gap: 8px;
    margin: 12px 0;
}

.fight-nav .counter {
    text-align: center;
    color: var(--muted);
    font-size: .76rem;
}

.match-card {
    --p1: #8b97ae;
    --p2: #8b97ae;
    margin-top: 10px;
    padding: 14px;
    border-radius: 12px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.10);
}

.match-label {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .09em;
    font-size: .68rem;
    font-weight: 800;
}

.fighter-grid {
    display: grid;
    grid-template-columns:
        repeat(2, minmax(0,1fr));
    gap: 8px;
    margin-top: 10px;
}

.fighter {
    min-width: 0;
    min-height: 72px;
    padding: 10px;
    border-radius: 10px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.10);
    text-align: left;
}

.fighter.one {
    border-top: 4px solid var(--p1);
}

.fighter.two {
    border-top: 4px solid var(--p2);
}

.fighter.selected {
    background:
        rgba(var(--accent-rgb), .14);
    outline: 2px solid var(--accent);
}

.fighter-name {
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.fighter-pool {
    margin-top: 5px;
    font-size: 1.15rem;
    font-weight: 900;
}

.bet-controls {
    display: grid;
    grid-template-columns:
        1fr auto;
    gap: 8px;
    margin-top: 10px;
}

.current-bet {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    margin-top: 10px;
    padding: 10px;
    border-radius: 9px;
    background: rgba(var(--accent-rgb), .08);
}

.current-bet strong {
    display: block;
}

.result-banner {
    margin-bottom: 10px;
    padding: 11px 12px;
    border-radius: 10px;
    background: rgba(var(--accent-rgb), .10);
    border: 1px solid rgba(var(--accent-rgb), .28);
}

.result-banner.win {
    animation: resultPop 520ms ease both;
}

@keyframes resultPop {
    from {
        opacity: .25;
        transform: scale(.96);
    }
    60% {
        transform: scale(1.025);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.waiting {
    min-height: 260px;
    display: grid;
    place-items: center;
    text-align: center;
}

.waiting-icon {
    font-size: 2.5rem;
}

.leaderboard-button {
    width: 100%;
    margin-top: 10px;
}

.overlay {
    position: fixed;
    z-index: 200;
    inset: 0;
    display: none;
    background: rgba(6,8,12,.72);
    backdrop-filter: blur(7px);
}

.overlay.open {
    display: block;
}

.drawer {
    position: absolute;
    inset: 0 0 0 auto;
    width: min(520px,100%);
    overflow-y: auto;
    padding: 16px;
    background: #181e2a;
    border-left: 3px solid var(--accent);
}

.drawer-head {
    position: sticky;
    z-index: 2;
    top: -16px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin: -16px -16px 14px;
    padding: 14px 16px;
    background: rgba(24,30,42,.98);
    border-bottom: 1px solid var(--line);
}

.drawer-head h2 {
    flex: 1;
    margin: 0;
}

.rank-row {
    display: grid;
    grid-template-columns:
        42px minmax(0,1fr) auto;
    gap: 9px;
    align-items: center;
    padding: 10px 8px;
    border-bottom: 1px solid rgba(255,255,255,.07);
}

.rank-row.me {
    background: rgba(var(--accent-rgb), .10);
    border-radius: 9px;
}

.rank-num {
    font-weight: 900;
    color: var(--accent);
}

.rank-name {
    min-width: 0;
    font-weight: 850;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.rank-money {
    text-align: right;
    font-weight: 900;
}

.rank-meta {
    grid-column: 2 / -1;
    color: var(--muted);
    font-size: .69rem;
}

.final-title {
    text-align: center;
    padding: 10px 0 5px;
}

.final-title .trophy {
    font-size: 3rem;
}

.final-title h1 {
    margin: 4px 0;
}

@media (max-width: 520px) {
    main {
        width: calc(100% - 16px);
    }

    .stats-strip {
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

    .stat {
        padding: 8px 4px;
    }

    .fighter-grid {
        grid-template-columns: 1fr 1fr;
    }

    .bet-controls {
        grid-template-columns: 1fr;
    }
}

.leave-event-button {
    width: 100%;
    margin-top: 8px;
    background: rgba(255,255,255,.025);
    color: var(--muted);
}

.leave-event-button:hover:not(:disabled) {
    color: #fff;
    background: rgba(255,255,255,.07);
}

</style>

</head>

<body>

<main>

    <section
        id="join-panel"
        class="panel join-panel"
    >

        <h1>Audience Gambler</h1>

        <p>
            Join the TABS War Chest audience pool and bet
            against the crowd.
        </p>

        <div class="join-grid">

            <input
                id="room-code"
                maxlength="6"
                placeholder="ROOM CODE"
            >

            <input
                id="audience-name"
                maxlength="24"
                placeholder="DISPLAY NAME"
            >

            <button onclick="joinAudience()">
                Join Audience Pool
            </button>

        </div>

        <div
            id="join-message"
            class="message"
        ></div>

        <div class="disclaimer">
            Fictional War Chest only. No real money or prizes are
            wagered through this page.
        </div>

    </section>


    <section
        id="game"
        class="hidden"
    >

        <header class="audience-header">

            <div class="audience-id">

                <div
                    id="audience-name-display"
                    class="audience-name"
                >
                    Audience Gambler
                </div>

                <div
                    id="phase-label"
                    class="phase-label"
                >
                    Waiting
                </div>

            </div>

            <div class="header-money">

                <strong id="available-money">
                    $10,000
                </strong>

                <span>
                    available
                </span>

            </div>

        </header>


        <div class="stats-strip">

            <div class="stat">
                <span>Rank</span>
                <strong id="audience-rank">—</strong>
            </div>

            <div class="stat">
                <span>Total Bankroll</span>
                <strong id="bankroll-value">$10,000</strong>
            </div>

            <div class="stat">
                <span>Bet Record</span>
                <strong id="bet-record">0–0</strong>
            </div>

        </div>


        <section
            id="content"
            class="panel"
        ></section>


        <button
            class="secondary leaderboard-button"
            onclick="openLeaderboard()"
        >
            Audience Leaderboard
        </button>

        <button
            class="secondary leave-event-button"
            onclick="leaveAudienceEvent()"
        >
            Leave Event
        </button>

    </section>

</main>


<div
    id="leaderboard-overlay"
    class="overlay"
    onclick="closeLeaderboard()"
>

    <aside
        class="drawer"
        onclick="event.stopPropagation()"
    >

        <div class="drawer-head">

            <h2>
                Audience Leaderboard
            </h2>

            <button
                class="secondary"
                onclick="closeLeaderboard()"
            >
                Close
            </button>

        </div>

        <div id="leaderboard"></div>

    </aside>

</div>


<script>
const PLAYER_COLORS = {
    scarlet: "#FF4D5A",
    tangerine: "#FF8A3D",
    gold: "#F2C94C",
    emerald: "#32D583",
    cyan: "#22D3EE",
    blue: "#3B82F6",
    violet: "#8B5CF6",
    pink: "#FF7AB8"
};


let roomCode = "";
let state = null;
let pollTimer = null;
let pollBusy = false;

let regularFightIndex = 0;
let selectedSide = {};
let lastResultKey = null;


function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;
}


function money(value) {

    return (
        "$"
        +
        Math.round(
            Number(value ?? 0)
        ).toLocaleString()
    );
}


function signedMoney(value) {

    const amount =
        Math.round(
            Number(value ?? 0)
        );


    if (amount === 0) {
        return "$0";
    }


    return (
        amount > 0
        ? `+${money(amount)}`
        : `-${money(Math.abs(amount))}`
    );
}


function playerById(id) {

    return (
        state?.players
        ?.find(
            player =>
                player.id === id
        )
        ?? null
    );
}


function playerName(id) {

    return (
        playerById(id)
        ?.display_name
        ?? "Player"
    );
}


function playerColor(id) {

    const code =
        playerById(id)
        ?.color_code;


    return (
        PLAYER_COLORS[code]
        ?? "#8b97ae"
    );
}


function myBetFor(
    kind,
    matchId
) {

    return (
        state?.my_bets
        ?.find(
            bet =>
                bet.bet_kind === kind
                &&
                (
                    kind === "regular"
                    ? bet.regular_match_id ===
                      matchId
                    : bet.final_war_match_id ===
                      matchId
                )
        )
        ?? null
    );
}


async function ensureSession() {

    const session =
        await db.auth.getSession();


    if (
        session.data
        ?.session
    ) {
        return;
    }


    const { error } =
        await db.auth
        .signInAnonymously();


    if (error) {
        throw error;
    }
}


function roomFromUrl() {

    return (
        new URLSearchParams(
            window.location.search
        )
        .get("room")
        ?.trim()
        .toUpperCase()
        ?? ""
    );
}


function setJoinMessage(text) {

    document
        .getElementById(
            "join-message"
        )
        .textContent =
            text ?? "";
}


async function joinAudience() {

    const code =
        document
        .getElementById(
            "room-code"
        )
        .value
        .trim()
        .toUpperCase();


    const name =
        document
        .getElementById(
            "audience-name"
        )
        .value
        .trim();


    if (code.length !== 6) {

        setJoinMessage(
            "Enter the 6-character room code."
        );

        return;
    }


    if (!name) {

        setJoinMessage(
            "Choose an Audience name."
        );

        return;
    }


    setJoinMessage(
        "Joining..."
    );


    try {

        await ensureSession();


        const { error } =
            await db.rpc(
                "join_audience_event",
                {
                    p_code: code,
                    p_display_name:
                        name
                }
            );


        if (error) {
            throw error;
        }


        roomCode = code;


        localStorage.setItem(
            "tabsAudienceRoom",
            roomCode
        );


        const url =
            new URL(
                window.location.href
            );

        url.searchParams.set(
            "room",
            roomCode
        );

        history.replaceState(
            null,
            "",
            url
        );


        await refreshState(true);


        showGame();
        startPolling();

    }

    catch (error) {

        console.error(error);

        setJoinMessage(
            error.message
        );
    }
}


function showGame() {

    document
        .getElementById(
            "join-panel"
        )
        .classList.add("hidden");


    document
        .getElementById(
            "game"
        )
        .classList.remove("hidden");
}


function startPolling() {

    clearInterval(
        pollTimer
    );


    pollTimer =
        setInterval(
            () =>
                refreshState(false),
            2000
        );
}


async function refreshState(
    initial = false
) {

    if (
        pollBusy
        ||
        !roomCode
    ) {
        return;
    }


    pollBusy = true;


    try {

        const { data, error } =
            await db.rpc(
                "get_audience_state",
                {
                    p_code:
                        roomCode
                }
            );


        if (error) {
            throw error;
        }


        state =
            data;


        if (!state.gambler) {

            if (initial) {
                return;
            }

            throw new Error(
                "This browser has not joined the Audience pool."
            );
        }


        render();

    }

    catch (error) {

        console.error(error);

        if (initial) {
            setJoinMessage(
                error.message
            );
        }

    }

    finally {
        pollBusy = false;
    }
}


function phaseLabel() {

    const e =
        state.event;


    switch (e.status) {

        case "lobby":
            return "Waiting in Lobby";

        case "draft_order":
        case "draft":
        case "draft_complete":
            return "Watching the Draft";

        case "shop":
        case "army_build":
            return `Round ${e.current_round} Prep`;

        case "betting_open":
            return `Round ${e.current_round} Betting Open`;

        case "betting_locked":
            return `Round ${e.current_round} Pools Locked`;

        case "fight":
            return `Round ${e.current_round} Fight ${e.current_match_number}`;

        case "regular_complete":
            return "Final War Coming";

        case "final_war_build":
        case "final_war_ready":
            return `Final War Stage ${e.final_war_current_stage} Betting`;

        case "final_war_fight":
            return `Final War Stage ${e.final_war_current_stage}`;

        case "final_war_complete":
            return "Event Complete";

        default:
            return String(
                e.status
            ).replaceAll("_"," ");
    }
}


function render() {

    if (!state?.gambler) {
        return;
    }


    const g =
        state.gambler;


    document
        .getElementById(
            "audience-name-display"
        )
        .textContent =
            g.display_name;


    document
        .getElementById(
            "phase-label"
        )
        .textContent =
            phaseLabel();


    document
        .getElementById(
            "available-money"
        )
        .textContent =
            money(
                g.available_war_chest
            );


    document
        .getElementById(
            "bankroll-value"
        )
        .textContent =
            money(
                g.bankroll_value
            );


    document
        .getElementById(
            "audience-rank"
        )
        .textContent =
            `#${g.audience_rank}`;


    document
        .getElementById(
            "bet-record"
        )
        .textContent =
            `${g.bets_won}–${Math.max(
                0,
                g.settled_bets
                -
                g.bets_won
            )}`;


    renderContent();
    renderLeaderboard();
}


function renderContent() {

    const content =
        document.getElementById(
            "content"
        );


    const status =
        state.event.status;


    if (status === "betting_open") {

        renderRegularBetting(
            content
        );

        return;
    }


    if (
        status === "betting_locked"
        ||
        status === "fight"
    ) {

        renderRegularLocked(
            content
        );

        return;
    }


    if (
        status === "final_war_build"
        ||
        status === "final_war_ready"
    ) {

        renderFinalBetting(
            content
        );

        return;
    }


    if (
        status === "final_war_fight"
    ) {

        renderFinalLocked(
            content
        );

        return;
    }


    if (
        status === "final_war_complete"
    ) {

        renderFinalResults(
            content
        );

        return;
    }


    renderWaiting(
        content
    );
}


function latestSettledMyBet() {

    return (
        state.my_bets
        ?.filter(
            bet =>
                bet.status ===
                "settled"
        )
        .sort(
            (a,b) =>
                new Date(b.updated_at)
                -
                new Date(a.updated_at)
        )[0]
        ?? null
    );
}


function resultBannerHtml() {

    const bet =
        latestSettledMyBet();


    if (!bet) {
        return "";
    }


    const key =
        `${bet.id}:${bet.payout}`;


    const net =
        Number(bet.payout)
        -
        Number(bet.amount);


    const className =
        key !== lastResultKey
        ? "result-banner win"
        : "result-banner";


    lastResultKey =
        key;


    return `
        <div class="${className}">

            <strong>
                Last Bet:
                ${signedMoney(net)}
            </strong>

            <div class="status">
                ${money(bet.amount)} wager •
                ${money(bet.payout)} returned
            </div>

        </div>
    `;
}


function regularMatches() {

    return (
        state.regular_matches
        ?? []
    );
}


function changeRegularFight(delta) {

    const matches =
        regularMatches();


    regularFightIndex =
        Math.max(
            0,
            Math.min(
                matches.length - 1,
                regularFightIndex + delta
            )
        );


    renderContent();
}


function renderRegularBetting(content) {

    const matches =
        regularMatches();


    if (!matches.length) {

        renderWaiting(content);
        return;
    }


    if (
        regularFightIndex >=
        matches.length
    ) {
        regularFightIndex =
            matches.length - 1;
    }


    const match =
        matches[
            regularFightIndex
        ];


    content.innerHTML = `
        ${resultBannerHtml()}

        <h2 class="scene-title">
            Round ${state.event.current_round} Betting
        </h2>

        <div class="status">
            Audience wagers are separate from competitor pools.
            Betting closes when the Host locks the round.
        </div>

        ${
            matches.length > 1
            ? `
                <div class="fight-nav">

                    <button
                        class="secondary"
                        ${regularFightIndex <= 0 ? "disabled" : ""}
                        onclick="changeRegularFight(-1)"
                    >
                        ←
                    </button>

                    <div class="counter">
                        Fight
                        ${regularFightIndex + 1}
                        of
                        ${matches.length}
                    </div>

                    <button
                        class="secondary"
                        ${
                            regularFightIndex >=
                            matches.length - 1
                            ? "disabled"
                            : ""
                        }
                        onclick="changeRegularFight(1)"
                    >
                        →
                    </button>

                </div>
              `
            : ""
        }

        ${renderOpenMatch(
            "regular",
            match
        )}
    `;
}


function renderOpenMatch(
    kind,
    match
) {

    const bet =
        myBetFor(
            kind,
            match.id
        );


    const selected =
        selectedSide[match.id]
        ??
        bet?.backed_player_id
        ??
        null;


    const currentAmount =
        Number(
            bet?.amount
            ?? 500
        );


    return `
        <div
            class="match-card"
            style="
                --p1:
                ${playerColor(match.player1_id)};
                --p2:
                ${playerColor(match.player2_id)};
            "
        >

            <div class="match-label">
                ${
                    kind === "regular"
                    ? `Fight ${match.match_number}`
                    : `Final War • Stage ${match.stage_number}`
                }
            </div>

            <div class="fighter-grid">

                <button
                    class="
                        fighter
                        one
                        ${
                            selected ===
                            match.player1_id
                            ? "selected"
                            : ""
                        }
                    "
                    onclick="
                        chooseSide(
                            '${match.id}',
                            '${match.player1_id}'
                        )
                    "
                >

                    <div class="fighter-name">
                        ${escapeHtml(
                            playerName(
                                match.player1_id
                            )
                        )}
                    </div>

                </button>


                <button
                    class="
                        fighter
                        two
                        ${
                            selected ===
                            match.player2_id
                            ? "selected"
                            : ""
                        }
                    "
                    onclick="
                        chooseSide(
                            '${match.id}',
                            '${match.player2_id}'
                        )
                    "
                >

                    <div class="fighter-name">
                        ${escapeHtml(
                            playerName(
                                match.player2_id
                            )
                        )}
                    </div>

                </button>

            </div>


            ${
                selected
                ? `
                    <div class="bet-controls">

                        <select
                            id="amount-${match.id}"
                        >
                            ${
                                [250,500,750,1000]
                                .map(
                                    amount => `
                                        <option
                                            value="${amount}"
                                            ${
                                                amount ===
                                                currentAmount
                                                ? "selected"
                                                : ""
                                            }
                                        >
                                            ${money(amount)}
                                        </option>
                                    `
                                ).join("")
                            }
                        </select>

                        <button
                            onclick="
                                placeBet(
                                    '${kind}',
                                    '${match.id}',
                                    '${selected}'
                                )
                            "
                        >
                            ${bet ? "Update Bet" : "Place Bet"}
                        </button>

                    </div>
                  `
                : `
                    <div
                        class="status"
                        style="margin-top:10px;"
                    >
                        Pick a fighter.
                    </div>
                  `
            }


            ${
                bet
                ? `
                    <div class="current-bet">

                        <div>
                            <strong>
                                ${money(bet.amount)}
                                on
                                ${escapeHtml(
                                    playerName(
                                        bet.backed_player_id
                                    )
                                )}
                            </strong>

                            <span class="status">
                                Current Audience wager
                            </span>
                        </div>

                        <button
                            class="secondary"
                            onclick="
                                cancelBet(
                                    '${kind}',
                                    '${match.id}'
                                )
                            "
                        >
                            Cancel
                        </button>

                    </div>
                  `
                : ""
            }

            <div
                id="bet-message-${match.id}"
                class="message"
            ></div>

        </div>
    `;
}


function chooseSide(
    matchId,
    playerId
) {

    selectedSide[matchId] =
        playerId;

    renderContent();
}


async function placeBet(
    kind,
    matchId,
    playerId
) {

    const select =
        document.getElementById(
            `amount-${matchId}`
        );


    const message =
        document.getElementById(
            `bet-message-${matchId}`
        );


    try {

        const { error } =
            await db.rpc(
                "place_audience_bet",
                {
                    p_event_id:
                        state.event.id,

                    p_bet_kind:
                        kind,

                    p_match_id:
                        matchId,

                    p_backed_player_id:
                        playerId,

                    p_amount:
                        Number(
                            select.value
                        )
                }
            );


        if (error) {
            throw error;
        }


        if (message) {
            message.textContent =
                "Bet placed.";
        }


        await refreshState();

    }

    catch (error) {

        console.error(error);

        if (message) {
            message.textContent =
                error.message;
        }
    }
}


async function cancelBet(
    kind,
    matchId
) {

    try {

        const { error } =
            await db.rpc(
                "cancel_audience_bet",
                {
                    p_event_id:
                        state.event.id,

                    p_bet_kind:
                        kind,

                    p_match_id:
                        matchId
                }
            );


        if (error) {
            throw error;
        }


        delete selectedSide[
            matchId
        ];


        await refreshState();

    }

    catch (error) {

        console.error(error);
    }
}


function currentRegularMatch() {

    return (
        regularMatches()
        .find(
            match =>
                match.match_number ===
                state.event
                .current_match_number
        )
        ??
        regularMatches()[0]
        ??
        null
    );
}


function renderRegularLocked(content) {

    const match =
        currentRegularMatch();


    if (!match) {
        renderWaiting(content);
        return;
    }


    content.innerHTML = `
        ${resultBannerHtml()}

        <h2 class="scene-title">
            Fight ${match.match_number}
        </h2>

        <div class="status">
            Audience pool locked.
        </div>

        ${renderLockedMatch(
            "regular",
            match
        )}
    `;
}


function renderLockedMatch(
    kind,
    match
) {

    const bet =
        myBetFor(
            kind,
            match.id
        );


    return `
        <div
            class="match-card"
            style="
                --p1:
                ${playerColor(match.player1_id)};
                --p2:
                ${playerColor(match.player2_id)};
            "
        >

            <div class="fighter-grid">

                <div class="fighter one">

                    <div class="fighter-name">
                        ${escapeHtml(
                            playerName(
                                match.player1_id
                            )
                        )}
                    </div>

                    <div class="fighter-pool">
                        ${money(
                            match.player1_pool
                            ?? 1000
                        )}
                    </div>

                </div>


                <div class="fighter two">

                    <div class="fighter-name">
                        ${escapeHtml(
                            playerName(
                                match.player2_id
                            )
                        )}
                    </div>

                    <div class="fighter-pool">
                        ${money(
                            match.player2_pool
                            ?? 1000
                        )}
                    </div>

                </div>

            </div>


            ${
                bet
                ? `
                    <div class="current-bet">

                        <div>

                            <strong>
                                Your Bet:
                                ${money(bet.amount)}
                                on
                                ${escapeHtml(
                                    playerName(
                                        bet.backed_player_id
                                    )
                                )}
                            </strong>

                            <span class="status">
                                ${
                                    bet.status === "settled"
                                    ? `Return: ${money(bet.payout)}`
                                    : "Waiting for result"
                                }
                            </span>

                        </div>

                    </div>
                  `
                : `
                    <div
                        class="status"
                        style="margin-top:10px;"
                    >
                        You did not bet on this fight.
                    </div>
                  `
            }

        </div>
    `;
}


function renderFinalBetting(content) {

    const match =
        state.final_match;


    if (!match) {

        renderWaiting(content);
        return;
    }


    content.innerHTML = `
        ${resultBannerHtml()}

        <h2 class="scene-title">
            Final War Betting
        </h2>

        <div class="status">
            Betting stays open until the Host reveals the Final War armies.
        </div>

        ${renderOpenMatch(
            "final",
            match
        )}
    `;
}


function renderFinalLocked(content) {

    const match =
        state.final_match;


    if (!match) {

        renderWaiting(content);
        return;
    }


    content.innerHTML = `
        ${resultBannerHtml()}

        <h2 class="scene-title">
            Final War • Stage ${match.stage_number}
        </h2>

        <div class="status">
            Audience pool locked. The Final War is live.
        </div>

        ${renderLockedMatch(
            "final",
            match
        )}
    `;
}


function renderWaiting(content) {

    const status =
        state.event.status;


    let title =
        "Waiting for Betting";

    let copy =
        "The next Audience betting window will appear automatically.";


    if (status === "lobby") {

        title =
            "Welcome to the Audience Pool";

        copy =
            `${state.audience_count} Audience Gambler${
                state.audience_count === 1
                ? ""
                : "s"
            } joined. Betting begins during the Regular Season.`;
    }


    else if (
        status === "draft_order"
        ||
        status === "draft"
        ||
        status === "draft_complete"
    ) {

        title =
            "Draft in Progress";

        copy =
            "Scout the competitors. Your first betting window opens before Round 1.";
    }


    else if (
        status === "shop"
        ||
        status === "army_build"
    ) {

        title =
            `Round ${state.event.current_round} Prep`;

        copy =
            "Players are preparing their armies. Audience betting opens once the Host starts the betting phase.";
    }


    else if (
        status === "regular_complete"
    ) {

        title =
            "Final War Incoming";

        copy =
            "Audience betting continues through every Final War fight.";
    }


    content.innerHTML = `
        ${resultBannerHtml()}

        <div class="waiting">

            <div>

                <div class="waiting-icon">
                    🎰
                </div>

                <h2>
                    ${title}
                </h2>

                <p class="status">
                    ${copy}
                </p>

            </div>

        </div>
    `;
}


function renderFinalResults(content) {

    const top =
        state.leaderboard?.[0];


    content.innerHTML = `
        ${resultBannerHtml()}

        <div class="final-title">

            <div class="trophy">
                🎰
            </div>

            <h1>
                Audience Betting Complete
            </h1>

            ${
                top
                ? `
                    <p>
                        <strong>
                            ${escapeHtml(top.display_name)}
                        </strong>
                        finishes #1 with
                        <strong>
                            ${money(top.bankroll)}
                        </strong>.
                    </p>
                  `
                : ""
            }

            <p class="status">
                Open the leaderboard to see the final Audience standings.
            </p>

        </div>
    `;
}


function leaveAudienceEvent() {

    const confirmed =
        window.confirm(
            "Leave this event on this device? "
            +
            "Your Audience Gambler record, bankroll, and completed betting history will remain in the event."
        );


    if (!confirmed) {
        return;
    }


    clearInterval(
        pollTimer
    );

    pollTimer = null;
    pollBusy = false;


    localStorage.removeItem(
        "tabsAudienceRoom"
    );


    const previousRoom =
        roomCode;


    roomCode = "";
    state = null;
    regularFightIndex = 0;
    selectedSide = {};
    lastResultKey = null;


    const url =
        new URL(
            window.location.href
        );


    url.searchParams.delete(
        "room"
    );


    history.replaceState(
        null,
        "",
        url.pathname
        +
        url.search
        +
        url.hash
    );


    document
        .getElementById(
            "game"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "join-panel"
        )
        .classList.remove(
            "hidden"
        );


    document
        .getElementById(
            "room-code"
        )
        .value =
            previousRoom;


    setJoinMessage("");
}


function openLeaderboard() {

    renderLeaderboard();

    document
        .getElementById(
            "leaderboard-overlay"
        )
        .classList.add("open");
}


function closeLeaderboard() {

    document
        .getElementById(
            "leaderboard-overlay"
        )
        .classList.remove("open");
}


function renderLeaderboard() {

    if (!state) {
        return;
    }


    const me =
        state.gambler;


    document
        .getElementById(
            "leaderboard"
        )
        .innerHTML =
            (
                state.leaderboard
                ?? []
            )
            .map(
                row => `
                    <div
                        class="
                            rank-row
                            ${
                                row.display_name ===
                                me?.display_name
                                ? "me"
                                : ""
                            }
                        "
                    >

                        <div class="rank-num">
                            #${row.rank}
                        </div>

                        <div class="rank-name">
                            ${escapeHtml(row.display_name)}
                        </div>

                        <div class="rank-money">
                            ${money(row.bankroll)}
                        </div>

                        <div class="rank-meta">
                            ${row.bets_won} winning bet${
                                row.bets_won === 1
                                ? ""
                                : "s"
                            }
                            •
                            ${row.settled_bets} settled
                            •
                            best +${money(row.biggest_net_win)}
                        </div>

                    </div>
                `
            )
            .join("");
}


async function initialize() {

    try {

        await ensureSession();


        const preferredRoom =
            roomFromUrl()
            ||
            localStorage.getItem(
                "tabsAudienceRoom"
            )
            ||
            "";


        if (preferredRoom) {

            roomCode =
                preferredRoom
                .trim()
                .toUpperCase();


            document
                .getElementById(
                    "room-code"
                )
                .value =
                    roomCode;


            await refreshState(true);


            if (state?.gambler) {

                showGame();
                startPolling();
                return;
            }
        }


        roomCode = "";

    }

    catch (error) {

        console.error(error);

        setJoinMessage(
            error.message
        );
    }
}


document
    .getElementById(
        "room-code"
    )
    .addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                joinAudience();
            }
        }
    );


document
    .getElementById(
        "audience-name"
    )
    .addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                joinAudience();
            }
        }
    );


initialize();
</script>

</body>
</html>
