<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Audience Gambler | TABS War Chest
</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --accent: #F2C94C;
    --accent-rgb: 242,201,76;
    --bg: #121722;
    --panel: #1b2130;
    --soft: rgba(255,255,255,.055);
    --line: rgba(255,255,255,.12);
    --text: #f8f9fb;
    --muted: rgba(248,249,251,.64);
}

html,
body {
    min-height: 100%;
    margin: 0;
}

body {
    background:
        linear-gradient(
            180deg,
            rgba(var(--accent-rgb), .055),
            transparent 220px
        ),
        var(--bg);
    color: var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body::before {
    content: "";
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--accent);
    pointer-events: none;
}

button,
input,
select {
    font: inherit;
}

button {
    min-height: 44px;
    padding: 10px 13px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: rgba(var(--accent-rgb), .14);
    color: white;
    font-weight: 800;
    cursor: pointer;
}

button:hover:not(:disabled) {
    background:
        rgba(var(--accent-rgb), .22);
    border-color:
        rgba(var(--accent-rgb), .48);
}

button:disabled {
    opacity: .35;
    cursor: default;
}

button.secondary {
    background: rgba(255,255,255,.045);
}

.hidden {
    display: none !important;
}

main {
    width: min(720px, calc(100% - 24px));
    margin: auto;
    padding: 14px 0 45px;
}

.panel {
    margin-bottom: 12px;
    padding: 16px;
    border-radius: 14px;
    background: rgba(27,33,48,.92);
    border: 1px solid var(--line);
}

.join-panel {
    margin-top: 42px;
}

.join-panel h1 {
    margin: 0;
    font-size: 2.25rem;
}

.join-panel p {
    color: var(--muted);
}

.join-grid {
    display: grid;
    gap: 10px;
    margin-top: 18px;
}

input,
select {
    width: 100%;
    min-height: 46px;
    padding: 10px 12px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: #111722;
    color: white;
}

#room-code {
    text-transform: uppercase;
    letter-spacing: .13em;
}

.disclaimer {
    margin-top: 12px;
    color: var(--muted);
    font-size: .76rem;
}

.message {
    min-height: 1.3em;
    margin-top: 8px;
    color: #ffd3d3;
    font-size: .82rem;
}

.audience-header {
    position: sticky;
    z-index: 50;
    top: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    padding: 10px 12px;
    border-radius: 0 0 12px 12px;
    background: rgba(18,23,34,.95);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(var(--accent-rgb), .25);
    border-top: 0;
}

.audience-id {
    min-width: 0;
    flex: 1 1 auto;
}

.audience-name {
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.phase-label {
    margin-top: 2px;
    color: var(--muted);
    font-size: .68rem;
    text-transform: uppercase;
    letter-spacing: .09em;
}

.header-money {
    flex: 0 0 auto;
    text-align: right;
}

.header-money strong {
    display: block;
    font-size: 1.12rem;
    font-variant-numeric: tabular-nums;
}

.header-money span {
    display: block;
    color: var(--muted);
    font-size: .65rem;
}

.stats-strip {
    display: grid;
    grid-template-columns:
        repeat(3, minmax(0,1fr));
    gap: 7px;
    margin-bottom: 12px;
}

.stat {
    padding: 10px;
    border-radius: 10px;
    background: var(--soft);
    text-align: center;
}

.stat span {
    display: block;
    color: var(--muted);
    font-size: .68rem;
}

.stat strong {
    display: block;
    margin-top: 3px;
    font-size: 1.05rem;
}

.scene-title {
    margin: 0 0 5px;
    font-size: 1.55rem;
}

.status {
    color: var(--muted);
    font-size: .82rem;
}

.fight-nav {
    display: grid;
    grid-template-columns:
        auto 1fr auto;
    align-items: center;
    gap: 8px;
    margin: 12px 0;
}

.fight-nav .counter {
    text-align: center;
    color: var(--muted);
    font-size: .76rem;
}

.match-card {
    --p1: #8b97ae;
    --p2: #8b97ae;
    margin-top: 10px;
    padding: 14px;
    border-radius: 12px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.10);
}

.match-label {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .09em;
    font-size: .68rem;
    font-weight: 800;
}

.fighter-grid {
    display: grid;
    grid-template-columns:
        repeat(2, minmax(0,1fr));
    gap: 8px;
    margin-top: 10px;
}

.fighter {
    min-width: 0;
    min-height: 72px;
    padding: 10px;
    border-radius: 10px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.10);
    text-align: left;
}

.fighter.one {
    border-top: 4px solid var(--p1);
}

.fighter.two {
    border-top: 4px solid var(--p2);
}

.fighter.selected {
    background:
        rgba(var(--accent-rgb), .14);
    outline: 2px solid var(--accent);
}

.fighter-name {
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.fighter-pool {
    margin-top: 5px;
    font-size: 1.15rem;
    font-weight: 900;
}

.bet-controls {
    display: grid;
    grid-template-columns:
        1fr auto;
    gap: 8px;
    margin-top: 10px;
}

.current-bet {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    margin-top: 10px;
    padding: 10px;
    border-radius: 9px;
    background: rgba(var(--accent-rgb), .08);
}

.current-bet strong {
    display: block;
}

.result-banner {
    margin-bottom: 10px;
    padding: 11px 12px;
    border-radius: 10px;
    background: rgba(var(--accent-rgb), .10);
    border: 1px solid rgba(var(--accent-rgb), .28);
}

.result-banner.win {
    animation: resultPop 520ms ease both;
}

@keyframes resultPop {
    from {
        opacity: .25;
        transform: scale(.96);
    }
    60% {
        transform: scale(1.025);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.waiting {
    min-height: 260px;
    display: grid;
    place-items: center;
    text-align: center;
}

.waiting-icon {
    font-size: 2.5rem;
}

.leaderboard-button {
    width: 100%;
    margin-top: 10px;
}

.overlay {
    position: fixed;
    z-index: 200;
    inset: 0;
    display: none;
    background: rgba(6,8,12,.72);
    backdrop-filter: blur(7px);
}

.overlay.open {
    display: block;
}

.drawer {
    position: absolute;
    inset: 0 0 0 auto;
    width: min(520px,100%);
    overflow-y: auto;
    padding: 16px;
    background: #181e2a;
    border-left: 3px solid var(--accent);
}

.drawer-head {
    position: sticky;
    z-index: 2;
    top: -16px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin: -16px -16px 14px;
    padding: 14px 16px;
    background: rgba(24,30,42,.98);
    border-bottom: 1px solid var(--line);
}

.drawer-head h2 {
    flex: 1;
    margin: 0;
}

.rank-row {
    display: grid;
    grid-template-columns:
        42px minmax(0,1fr) auto;
    gap: 9px;
    align-items: center;
    padding: 10px 8px;
    border-bottom: 1px solid rgba(255,255,255,.07);
}

.rank-row.me {
    background: rgba(var(--accent-rgb), .10);
    border-radius: 9px;
}

.rank-num {
    font-weight: 900;
    color: var(--accent);
}

.rank-name {
    min-width: 0;
    font-weight: 850;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.rank-money {
    text-align: right;
    font-weight: 900;
}

.rank-meta {
    grid-column: 2 / -1;
    color: var(--muted);
    font-size: .69rem;
}

.final-title {
    text-align: center;
    padding: 10px 0 5px;
}

.final-title .trophy {
    font-size: 3rem;
}

.final-title h1 {
    margin: 4px 0;
}

@media (max-width: 520px) {
    main {
        width: calc(100% - 16px);
    }

    .stats-strip {
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

    .stat {
        padding: 8px 4px;
    }

    .fighter-grid {
        grid-template-columns: 1fr 1fr;
    }

    .bet-controls {
        grid-template-columns: 1fr;
    }
}

.leave-event-button {
    width: 100%;
    margin-top: 8px;
    background: rgba(255,255,255,.025);
    color: var(--muted);
}

.leave-event-button:hover:not(:disabled) {
    color: #fff;
    background: rgba(255,255,255,.07);
}


/* =========================================================
   AUDIENCE SHOP / SKILL TREE REFERENCE
   ========================================================= */

.aud-shop-reference {
    display: grid;
    gap: 14px;
}

.aud-shop-hero {
    padding: 18px;
    border-radius: 18px;
    border: 1px solid var(--line);
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.025)
        );
}

.aud-shop-hero .eyebrow {
    color: var(--muted);
    font-size: .72rem;
    font-weight: 900;
    letter-spacing: .10em;
    text-transform: uppercase;
}

.aud-shop-hero h2 {
    margin: 5px 0 6px;
}

.aud-shop-hero p {
    margin: 0;
    color: var(--muted);
    line-height: 1.45;
}

.aud-shop-section-title {
    margin-top: 4px;
    font-size: .82rem;
    font-weight: 950;
    letter-spacing: .08em;
    text-transform: uppercase;
}

.aud-shop-items {
    display: grid;
    gap: 9px;
}

.aud-shop-item {
    padding: 13px 14px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.035);
}

.aud-shop-item-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.aud-shop-item-top strong {
    font-size: .95rem;
}

.aud-shop-item-top b {
    color: #f2c94c;
    font-size: .95rem;
}

.aud-shop-item p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: .82rem;
    line-height: 1.38;
}

.aud-shop-skill-key {
    margin-top: -5px;
    color: var(--muted);
    font-size: .77rem;
}

.aud-shop-skill-key strong {
    color: #fff;
}

.aud-shop-branches {
    display: grid;
    gap: 9px;
}

.aud-shop-branch {
    overflow: hidden;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.03);
}

.aud-shop-branch summary {
    display: grid;
    grid-template-columns:
        38px
        minmax(0,1fr);
    gap: 10px;
    align-items: center;
    padding: 12px 13px;
    cursor: pointer;
    list-style: none;
}

.aud-shop-branch summary::-webkit-details-marker {
    display: none;
}

.aud-shop-branch summary::after {
    content: "+";
    position: absolute;
    right: 16px;
    color: var(--muted);
    font-weight: 950;
}

.aud-shop-branch[open] summary::after {
    content: "–";
}

.aud-shop-branch summary {
    position: relative;
    padding-right: 40px;
}

.aud-shop-branch-icon {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.045);
    font-weight: 1000;
}

.aud-shop-branch summary strong {
    display: block;
}

.aud-shop-branch summary small {
    display: block;
    margin-top: 3px;
    color: #f2c94c;
    font-size: .67rem;
}

.aud-shop-node-list {
    display: grid;
    gap: 7px;
    padding: 0 10px 10px;
}

.aud-shop-node {
    padding: 11px 12px;
    border-radius: 11px;
    border: 1px solid rgba(255,255,255,.075);
    background: rgba(8,11,17,.48);
}

.aud-shop-node-head {
    display: flex;
    align-items: start;
    justify-content: space-between;
    gap: 12px;
}

.aud-shop-node-head strong {
    font-size: .88rem;
}

.aud-shop-node-head span {
    flex: 0 0 auto;
    padding: 4px 7px;
    border-radius: 999px;
    background: rgba(255,255,255,.06);
    color: #f2c94c;
    font-size: .67rem;
    font-weight: 900;
}

.aud-shop-node p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: .78rem;
    line-height: 1.38;
}

.aud-shop-owners {
    margin-top: 9px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
    color: var(--muted);
    font-size: .68rem;
}

.aud-shop-owner-chip {
    --owner: #7c8aa6;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 7px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.035);
    color: #fff;
}

.aud-shop-owner-chip i {
    width: 9px;
    height: 9px;
    flex: 0 0 auto;
    border-radius: 999px;
    background: var(--owner);
    border: 1px solid rgba(255,255,255,.45);
    box-shadow:
        0 0 7px
        color-mix(
            in srgb,
            var(--owner) 48%,
            transparent
        );
}

</style>

</head>

<body>

<main>

    <section
        id="join-panel"
        class="panel join-panel"
    >

        <h1>Audience Gambler</h1>

        <p>
            Join the TABS War Chest audience pool and bet
            against the crowd.
        </p>

        <div class="join-grid">

            <input
                id="room-code"
                maxlength="6"
                placeholder="ROOM CODE"
            >

            <input
                id="audience-name"
                maxlength="24"
                placeholder="DISPLAY NAME"
            >

            <button onclick="joinAudience()">
                Join Audience Pool
            </button>

        </div>

        <div
            id="join-message"
            class="message"
        ></div>

        <div class="disclaimer">
            Fictional War Chest only. No real money or prizes are
            wagered through this page.
        </div>

    </section>


    <section
        id="game"
        class="hidden"
    >

        <header class="audience-header">

            <div class="audience-id">

                <div
                    id="audience-name-display"
                    class="audience-name"
                >
                    Audience Gambler
                </div>

                <div
                    id="phase-label"
                    class="phase-label"
                >
                    Waiting
                </div>

            </div>

            <div class="header-money">

                <strong id="available-money">
                    $10,000
                </strong>

                <span>
                    available
                </span>

            </div>

        </header>


        <div class="stats-strip">

            <div class="stat">
                <span>Rank</span>
                <strong id="audience-rank">—</strong>
            </div>

            <div class="stat">
                <span>Total Bankroll</span>
                <strong id="bankroll-value">$10,000</strong>
            </div>

            <div class="stat">
                <span>Bet Record</span>
                <strong id="bet-record">0–0</strong>
            </div>

        </div>


        <section
            id="content"
            class="panel"
        ></section>


        <button
            class="secondary leaderboard-button"
            onclick="openLeaderboard()"
        >
            Audience Leaderboard
        </button>

        <button
            class="secondary leave-event-button"
            onclick="leaveAudienceEvent()"
        >
            Leave Event
        </button>

    </section>

</main>


<div
    id="leaderboard-overlay"
    class="overlay"
    onclick="closeLeaderboard()"
>

    <aside
        class="drawer"
        onclick="event.stopPropagation()"
    >

        <div class="drawer-head">

            <h2>
                Audience Leaderboard
            </h2>

            <button
                class="secondary"
                onclick="closeLeaderboard()"
            >
                Close
            </button>

        </div>

        <div id="leaderboard"></div>

    </aside>

</div>


<script>
const PLAYER_COLORS = {
    scarlet: "#FF4D5A",
    tangerine: "#FF8A3D",
    gold: "#F2C94C",
    emerald: "#32D583",
    cyan: "#22D3EE",
    blue: "#3B82F6",
    violet: "#8B5CF6",
    pink: "#FF7AB8"
};


let roomCode = "";
let state = null;
let pollTimer = null;
let pollBusy = false;

let regularFightIndex = 0;
let selectedSide = {};
let selectedBetAmount = {};
let openShopBranches = new Set();
let audienceSelectFocused = false;
let lastResultKey = null;


function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;
}


function money(value) {

    return (
        "$"
        +
        Math.round(
            Number(value ?? 0)
        ).toLocaleString()
    );
}


function signedMoney(value) {

    const amount =
        Math.round(
            Number(value ?? 0)
        );


    if (amount === 0) {
        return "$0";
    }


    return (
        amount > 0
        ? `+${money(amount)}`
        : `-${money(Math.abs(amount))}`
    );
}


function setAudienceSelectFocus(
    focused
) {

    audienceSelectFocused =
        Boolean(focused);
}


function audienceNativeSelectIsActive() {

    const active =
        document.activeElement;


    return (
        audienceSelectFocused
        ||
        (
            active
            &&
            active.tagName === "SELECT"
            &&
            active.closest("#content")
        )
    );
}


function rememberBetAmount(
    matchId,
    value
) {

    selectedBetAmount[
        matchId
    ] =
        Number(value);
}


function rememberShopBranch(
    branchCode,
    isOpen
) {

    if (isOpen) {

        openShopBranches.add(
            branchCode
        );

    }

    else {

        openShopBranches.delete(
            branchCode
        );
    }
}


function audienceShopPlayerColor(
    player
) {

    const raw =
        player?.color_code;


    return (
        PLAYER_COLORS[
            raw
        ]
        ??
        raw
        ??
        "#8b97ae"
    );
}


function playerById(id) {

    return (
        state?.players
        ?.find(
            player =>
                player.id === id
        )
        ?? null
    );
}


function playerName(id) {

    return (
        playerById(id)
        ?.display_name
        ?? "Player"
    );
}


function playerColor(id) {

    const code =
        playerById(id)
        ?.color_code;


    return (
        PLAYER_COLORS[code]
        ?? "#8b97ae"
    );
}


function myBetFor(
    kind,
    matchId
) {

    return (
        state?.my_bets
        ?.find(
            bet =>
                bet.bet_kind === kind
                &&
                (
                    kind === "regular"
                    ? bet.regular_match_id ===
                      matchId
                    : bet.final_war_match_id ===
                      matchId
                )
        )
        ?? null
    );
}


async function ensureSession() {

    const session =
        await db.auth.getSession();


    if (
        session.data
        ?.session
    ) {
        return;
    }


    const { error } =
        await db.auth
        .signInAnonymously();


    if (error) {
        throw error;
    }
}


function roomFromUrl() {

    return (
        new URLSearchParams(
            window.location.search
        )
        .get("room")
        ?.trim()
        .toUpperCase()
        ?? ""
    );
}


function setJoinMessage(text) {

    document
        .getElementById(
            "join-message"
        )
        .textContent =
            text ?? "";
}


async function joinAudience() {

    const code =
        document
        .getElementById(
            "room-code"
        )
        .value
        .trim()
        .toUpperCase();


    const name =
        document
        .getElementById(
            "audience-name"
        )
        .value
        .trim();


    if (code.length !== 6) {

        setJoinMessage(
            "Enter the 6-character room code."
        );

        return;
    }


    if (!name) {

        setJoinMessage(
            "Choose an Audience name."
        );

        return;
    }


    setJoinMessage(
        "Joining..."
    );


    try {

        await ensureSession();


        const { error } =
            await db.rpc(
                "join_audience_event",
                {
                    p_code: code,
                    p_display_name:
                        name
                }
            );


        if (error) {
            throw error;
        }


        roomCode = code;


        localStorage.setItem(
            "tabsAudienceRoom",
            roomCode
        );


        const url =
            new URL(
                window.location.href
            );

        url.searchParams.set(
            "room",
            roomCode
        );

        history.replaceState(
            null,
            "",
            url
        );


        await refreshState(true);


        showGame();
        startPolling();

    }

    catch (error) {

function startPolling() {

    clearInterval(
        pollTimer
    );


    pollTimer =
        setInterval(
            () =>
                refreshState(false),
            2000
        );
}


async function refreshState(
    initial = false
) {

    if (
        pollBusy
        ||
        !roomCode
    ) {
        return;
    }


    pollBusy = true;


    try {

        const { data, error } =
            await db.rpc(
                "get_audience_state",
                {
                    p_code:
                        roomCode
                }
            );


        if (error) {
            throw error;
        }


        if (
            data?.event?.status ===
            "shop"
        ) {

            const {
                data:
                    shopSceneState,
                error:
                    shopSceneError
            } =
                await db.rpc(
                    "get_shop_scene_state",
                    {
                        p_code:
                            roomCode
                    }
                );


            if (shopSceneError) {

                console.error(
                    shopSceneError
                );

            }

            else if (
                shopSceneState
            ) {

                data.shop =
                    shopSceneState;
            }
        }


        state =
            data;


        if (!state.gambler) {

            if (initial) {
                return;
            }

            throw new Error(
                "This browser has not joined the Audience pool."
            );
        }


        /*
           Native select menus close if their DOM node is replaced.
           While the viewer is actively using a betting dropdown,
           keep the current DOM intact. The fresh state is still saved
           above, and the next poll after blur will render normally.
        */
        if (
            !initial
            &&
            audienceNativeSelectIsActive()
        ) {
            return;
        }


        render();

    }

    catch (error) {

        console.error(error);

        if (initial) {
            setJoinMessage(
                error.message
            );
        }

    }

    finally {
        pollBusy = false;
    }
}


function phaseLabel() {

    const e =
        state.event;


    switch (e.status) {

        case "lobby":
            return "Waiting in Lobby";

        case "draft_order":
        case "draft":
        case "draft_complete":
            return "Watching the Draft";

        case "shop":
            return `Round ${e.current_round} Shop`;

        case "army_build":
            return `Round ${e.current_round} Army Build`;

        case "betting_open":
            return `Round ${e.current_round} Betting Open`;

        case "betting_locked":
            return `Round ${e.current_round} Pools Locked`;

        case "fight":
            return `Round ${e.current_round} Fight ${e.current_match_number}`;

        case "regular_complete":
            return "Final War Coming";

        case "final_war_build":
        case "final_war_ready":
            return `Final War Stage ${e.final_war_current_stage} Betting`;

        case "final_war_fight":
            return `Final War Stage ${e.final_war_current_stage}`;

        case "final_war_complete":
            return "Event Complete";

        default:
            return String(
                e.status
            ).replaceAll("_"," ");
    }
}


function render() {

    if (!state?.gambler) {
        return;
    }


    const g =
        state.gambler;


    document
        .getElementById(
            "audience-name-display"
        )
        .textContent =
            g.display_name;


    document
        .getElementById(
            "phase-label"
        )
        .textContent =
            phaseLabel();


    document
        .getElementById(
            "available-money"
        )
        .textContent =
            money(
                g.available_war_chest
            );


    document
        .getElementById(
            "bankroll-value"
        )
        .textContent =
            money(
                g.bankroll_value
            );


    document
        .getElementById(
            "audience-rank"
        )
        .textContent =
            `#${g.audience_rank}`;


    document
        .getElementById(
            "bet-record"
        )
        .textContent =
            `${g.bets_won}–${Math.max(
                0,
                g.settled_bets
                -
                g.bets_won
            )}`;


    renderContent();
    renderLeaderboard();
}


function renderContent() {

    const content =
        document.getElementById(
            "content"
        );


    const status =
        state.event.status;


    if (
        status === "shop"
    ) {

        renderShopReference(
            content
        );

        return;
    }


    if (status === "betting_open") {

        renderRegularBetting(
            content
        );

        return;
    }


    if (
        status === "betting_locked"
        ||
        status === "fight"
    ) {

        renderRegularLocked(
            content
        );

        return;
    }


    if (
        status === "final_war_build"
        ||
        status === "final_war_ready"
    ) {

        renderFinalBetting(
            content
        );

        return;
    }


    if (
        status === "final_war_fight"
    ) {

        renderFinalLocked(
            content
        );

        return;
    }


    if (
        status === "final_war_complete"
    ) {

        renderFinalResults(
            content
        );

        return;
    }


    renderWaiting(
        content
    );
}

function changeRegularFight(delta) {

    const matches =
        regularMatches();


    regularFightIndex =
        Math.max(
            0,
            Math.min(
                matches.length - 1,
                regularFightIndex + delta
            )
        );


    renderContent();
}


function renderRegularBetting(content) {

    const matches =
        regularMatches();


    if (!matches.length) {

        renderWaiting(content);
        return;

    if (
        regularFightIndex >=
        matches.length
    ) {
        regularFightIndex =
            matches.length - 1;

    const match =
        matches[

    content.innerHTML = `

async function placeBet(
    kind,
    matchId,
    playerId
) {

    const select =
        document.getElementById(
            `amount-${matchId}`
        );


    const message =
        document.getElementById(
            `bet-message-${matchId}`
        );


    try {

        const { error } =
            await db.rpc(
                "place_audience_bet",
                {
                    p_event_id:
                        state.event.id,

                    p_bet_kind:
                        kind,

                    p_match_id:
                        matchId,

                    p_backed_player_id:
                        playerId,

                    p_amount:
                        Number(
                            select.value
                        )
                }
            );


        if (error) {
            throw error;
        }


        selectedBetAmount[
            matchId
        ] =
            Number(
                select.value
            );


        if (message) {
            message.textContent =
                "Bet placed.";
        }


        await refreshState();

    }

    catch (error) {

        console.error(error);

        if (message) {
            message.textContent =
                error.message;
        }
    }
}


async function cancelBet(
    kind,
    matchId
) {

    try {

        const { error } =
            await db.rpc(
                "cancel_audience_bet",
                {
                    p_event_id:
                        state.event.id,

                    p_bet_kind:
                        kind,

                    p_match_id:
                        matchId
                }
            );


        if (error) {
            throw error;
        }


        delete selectedSide[
            matchId
        ];


        await refreshState();

    }

    catch (error) {

        console.error(error);
    }
}

    ) {

        title =
            `Round ${state.event.current_round} Prep`;

        copy =
            "Players are preparing their armies. Audience betting opens once the Host starts the betting phase.";
    }


    else if (
        status === "regular_complete"
    ) {

        title =
            "Final War Incoming";

        copy =
            "Audience betting continues through every Final War fight.";
    }


    content.innerHTML = `
        ${resultBannerHtml()}

        <div class="waiting">

            <div>

                <div class="waiting-icon">
                    🎰
                </div>

                <h2>
                    ${title}
                </h2>

                <p class="status">
                    ${copy}
                </p>

            </div>

        </div>
    `;
}


function renderFinalResults(content) {

    const top =
        state.leaderboard?.[0];


    content.innerHTML = `
        ${resultBannerHtml()}

        <div class="final-title">

            <div class="trophy">
                🎰
            </div>

            <h1>
                Audience Betting Complete
            </h1>

            ${
                top
                ? `
                    <p>
                        <strong>
                            ${escapeHtml(top.display_name)}
                        </strong>
                        finishes #1 with
                        <strong>
                            ${money(top.bankroll)}
                        </strong>.
                    </p>
                  `
                : ""
            }

            <p class="status">
                Open the leaderboard to see the final Audience standings.
            </p>

        </div>
    `;
}


function leaveAudienceEvent() {

    const confirmed =
        window.confirm(
            "Leave this event on this device? "
            +
            "Your Audience Gambler record, bankroll, and completed betting history will remain in the event."
        );


    if (!confirmed) {
        return;
    }


    clearInterval(
        pollTimer
    );

    pollTimer = null;
    pollBusy = false;


    localStorage.removeItem(
        "tabsAudienceRoom"
    );


    const previousRoom =
        roomCode;


    roomCode = "";
    state = null;
    regularFightIndex = 0;
    selectedSide = {};
    selectedBetAmount = {};
    openShopBranches.clear();
    audienceSelectFocused = false;
    lastResultKey = null;


    const url =
        new URL(
            window.location.href
        );


    url.searchParams.delete(
        "room"
    );


    history.replaceState(
        null,
        "",
        url.pathname
        +
        url.search
        +
        url.hash
    );


    document
        .getElementById(
            "game"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "join-panel"
        )
        .classList.remove(
            "hidden"
        );


    document
        .getElementById(
            "room-code"
        )
        .value =
            previousRoom;


    setJoinMessage("");
}


function openLeaderboard() {

    renderLeaderboard();

    document
        .getElementById(
            "leaderboard-overlay"
        )
        .classList.add("open");
}


function closeLeaderboard() {

    document
        .getElementById(
            "leaderboard-overlay"
        )
        .classList.remove("open");
}


function renderLeaderboard() {

    if (!state) {
        return;
    }


    const me =
        state.gambler;


    document
        .getElementById(
            "leaderboard"
        )
        .innerHTML =
            (
                state.leaderboard
                ?? []
            )
            .map(
                row => `
                    <div
                        class="
                            rank-row
                            ${
                                row.display_name ===
                                me?.display_name
                                ? "me"
                                : ""
                            }
                        "
                    >

                        <div class="rank-num">
                            #${row.rank}
                        </div>

                        <div class="rank-name">
                            ${escapeHtml(row.display_name)}
                        </div>

                        <div class="rank-money">
                            ${money(row.bankroll)}
                        </div>

                        <div class="rank-meta">
                            ${row.bets_won} winning bet${
                                row.bets_won === 1
                                ? ""
                                : "s"
                            }
                            •
                            ${row.settled_bets} settled
                            •
                            best +${money(row.biggest_net_win)}
                        </div>

                    </div>
                `
            )
            .join("");
}


async function initialize() {

    try {

        await ensureSession();


        const preferredRoom =
            roomFromUrl()
            ||
            localStorage.getItem(
                "tabsAudienceRoom"
            )
            ||
            "";


        if (preferredRoom) {

            roomCode =
                preferredRoom
                .trim()
                .toUpperCase();


            document
                .getElementById(
                    "room-code"
                )
                .value =
                    roomCode;


            await refreshState(true);


            if (state?.gambler) {

                showGame();
                startPolling();
                return;
            }
        }


        roomCode = "";

    }

    catch (error) {

        console.error(error);

        setJoinMessage(
            error.message
        );
    }
}


document
    .getElementById(
        "room-code"
    )
    .addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                joinAudience();
            }
        }
    );


document
    .getElementById(
        "audience-name"
    )
    .addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                joinAudience();
            }
        }
    );


initialize();
</script>

</body>
</html>
